<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eSAMz v7 - AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui;background:#0a0a0a;color:#e5e5e5}
.app{display:flex;height:100vh}

/* Sidebar */
.sidebar{width:280px;background:#111;border-right:1px solid #222;display:flex;flex-direction:column}
.sidebar-header{padding:20px;border-bottom:1px solid #222}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.logo-icon{width:36px;height:36px;border-radius:8px;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;align-items:center;justify-content:center;font-weight:bold}
.new-chat-btn{width:100%;padding:10px;border:none;border-radius:8px;
background:#667eea;color:white;cursor:pointer}

.sidebar-content{padding:16px;flex:1}
.sidebar-content a{display:block;padding:8px;color:#999;text-decoration:none;border-radius:6px}
.sidebar-content a:hover{background:#1a1a1a;color:#fff}

.sidebar-footer{padding:12px;font-size:11px;color:#666;border-top:1px solid #222;text-align:center}

/* Main */
.main{flex:1;display:flex;flex-direction:column}
.header{height:60px;background:#111;border-bottom:1px solid #222;
display:flex;align-items:center;justify-content:space-between;padding:0 20px}

.chat{flex:1;padding:20px;overflow-y:auto}
.welcome{padding:20px;margin-bottom:16px;border-radius:12px;
background:linear-gradient(135deg,#667eea20,#764ba220);text-align:center}

.message{display:flex;margin-bottom:12px}
.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}
.bubble{max-width:70%;padding:14px 18px;border-radius:16px;white-space:pre-wrap}
.user .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
.ai .bubble{background:#111;border:1px solid #222}

/* Input */
.input-bar{padding:16px;background:#111;border-top:1px solid #222}
.input-wrap{display:flex;gap:10px;background:#1a1a1a;border-radius:12px;padding:8px}
textarea{flex:1;background:none;border:none;color:#e5e5e5;resize:none;outline:none}
button{cursor:pointer}

.file-btn{background:none;border:none;color:#999;font-size:18px}
.send-btn{background:#667eea;border:none;border-radius:8px;color:white;padding:10px 16px}

.file-preview{margin-top:8px;font-size:12px;color:#aaa}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">e</div>
      <div>eSAMz v7</div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
  </div>

  <div class="sidebar-content">
    <a href="https://esamz.info" target="_blank">🏠 Home</a>
    <a href="https://esamz.info/docs" target="_blank">📚 Docs</a>
    <a href="https://esamz.info/aboutus" target="_blank">ℹ️ About</a>
    <a href="https://esamz.info/privacypolicy" target="_blank">🔒 Privacy</a>
  </div>

  <div class="sidebar-footer">
    © 2025 eSAMz<br>Created by Alakmar Teenwala
  </div>
</aside>

<main class="main">
  <div class="header">
    <div>Chat with eSAMz</div>
    <div>● Online</div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome">
      <h2>Welcome to eSAMz v7</h2>
      <p>Ask anything. Clarity first.</p>
    </div>
  </div>

  <div class="input-bar">
    <div class="input-wrap">
      <input type="file" id="fileInput" style="display:none"
        accept=".txt,.pdf,.doc,.docx">
      <button class="file-btn" onclick="fileInput.click()">📎</button>

      <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
      <button class="send-btn" id="send">Send</button>
    </div>
    <div class="file-preview" id="filePreview"></div>
  </div>
</main>

</div>

<script>
const chat = document.getElementById("chat")
const input = document.getElementById("input")
const send = document.getElementById("send")
const fileInput = document.getElementById("fileInput")
const filePreview = document.getElementById("filePreview")

let uploadedFile = null
let uploadedText = ""
let conversationHistory = []  // Store conversation history

/* Chat helpers */
function add(text, who){
  const m=document.createElement("div")
  m.className="message "+who
  const b=document.createElement("div")
  b.className="bubble"
  b.textContent=text
  m.appendChild(b)
  chat.appendChild(m)
  chat.scrollTop=chat.scrollHeight
}

function newChat(){
  chat.innerHTML=`<div class="welcome">
    <h2>Welcome to eSAMz v7</h2>
    <p>Ask anything. Clarity first.</p>
  </div>`
  uploadedFile=null
  uploadedText=""
  filePreview.textContent=""
  conversationHistory=[]  // Clear history on new chat
  console.log("Chat history cleared")
}

/* File handling */
fileInput.onchange=async()=>{
  const file=fileInput.files[0]
  if(!file)return
  uploadedFile=file
  uploadedText=""

  if(file.type==="text/plain"){
    uploadedText=await file.text()
  }

  filePreview.textContent=
    "Attached: "+file.name+
    (uploadedText ? " (text loaded)" : " (name only)")
}

/* Send */
async function sendMsg(){
  const text=input.value.trim()
  if(!text && !uploadedFile)return

  let payload=text
  if(uploadedText){
    payload=`[FILE CONTENT START]\n${uploadedText}\n[FILE CONTENT END]\n\n${text}`
  } else if(uploadedFile){
    payload=`[Attached file: ${uploadedFile.name}]\n\n${text}`
  }

  add(text || "[File sent]", "user")
  input.value=""
  fileInput.value=""
  filePreview.textContent=""
  uploadedFile=null
  uploadedText=""

  // Add user message to history
  conversationHistory.push({
    role: "user",
    content: payload
  })

  console.log(`Sending message with ${conversationHistory.length} history items`)

  try{
    const r=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message: payload,
        history: conversationHistory  // Send history with request
      })
    })
    const j=await r.json()
    const reply = j.reply || "No response."
    
    add(reply, "ai")
    
    // Add assistant response to history
    conversationHistory.push({
      role: "assistant",
      content: reply
    })
    
    console.log(`History now has ${conversationHistory.length} items`)
  }catch(err){
    add("Error connecting to AI.", "ai")
    console.error("API Error:", err)
  }
}

send.onclick=sendMsg
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault()
    sendMsg()
  }
})
</script>
</body>
</html>
