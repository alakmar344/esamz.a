    <style>
        /* =========================================
           1. DESIGN TOKENS & RESET
           ========================================= */
        :root {
            /* Monochrome Deep Dark (Zinc/Slate Scale) */
            --bg-root: #09090b;       /* Zinc 950 */
            --bg-surface: #18181b;    /* Zinc 900 */
            --bg-hover: #27272a;      /* Zinc 800 */
            
            --border-subtle: #27272a; /* Zinc 800 */
            --border-focus: #52525b;  /* Zinc 600 */
            
            --text-primary: #fafafa;  /* Zinc 50 */
            --text-secondary: #a1a1aa;/* Zinc 400 */
            --text-muted: #52525b;    /* Zinc 600 */
            --text-code: #e4e4e7;     /* Zinc 200 */

            /* Accents (Subtle) */
            --accent-bg: rgba(255, 255, 255, 0.05);
            --accent-border: rgba(255, 255, 255, 0.1);

            /* Dimensions */
            --sidebar-width: 280px;
            --header-height: 56px;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;

            /* Animation */
            --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg-root);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Typography Hierarchy */
        h1, h2, h3 { font-weight: 600; letter-spacing: -0.025em; color: var(--text-primary); }
        h1 { font-size: 24px; }
        h2 { font-size: 18px; margin-top: 1.5em; margin-bottom: 0.5em; }
        h3 { font-size: 16px; margin-top: 1.2em; margin-bottom: 0.4em; }
        p { margin-bottom: 0.8em; color: var(--text-secondary); }
        p:last-child { margin-bottom: 0; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-focus); }

        /* Buttons & Interactions */
        button { 
            font-family: inherit; 
            background: none; 
            border: none; 
            cursor: pointer; 
            color: inherit; 
            transition: all 0.15s ease; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
        }
        
        .btn-base {
            height: 32px;
            padding: 0 12px;
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            border: 1px solid transparent;
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--border-subtle);
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
            background: var(--accent-bg);
        }
        .btn-secondary:active { transform: scale(0.98); }

        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-root);
        }
        .btn-primary:hover {
            background: #ffffff;
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* =========================================
           2. LAYOUT STRUCTURE
           ========================================= */
        
        /* Sidebar */
        .sidebar { 
            width: var(--sidebar-width);
            background: var(--bg-root);
            border-right: 1px solid var(--border-subtle);
            display: flex; flex-direction: column;
            height: 100%;
            z-index: 100;
            flex-shrink: 0;
            transition: transform 0.3s var(--ease-out);
        }

        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border-subtle); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
        .logo-box { 
            width: 28px; height: 28px; 
            background: var(--text-primary); 
            color: var(--bg-root);
            border-radius: var(--radius-sm);
            display: grid; place-items: center;
            font-weight: 700; font-size: 14px;
        }
        .brand-name { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
        
        .nav-section { flex: 1; overflow-y: auto; padding: 12px; }
        .nav-label { 
            font-size: 11px; font-weight: 600; 
            color: var(--text-muted); text-transform: uppercase; 
            letter-spacing: 0.05em; margin: 16px 0 8px 4px; 
        }
        
        .nav-item { 
            width: 100%; height: 32px; 
            padding: 0 8px; margin-bottom: 2px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-align: left; font-size: 13px;
            gap: 8px; transition: background 0.1s;
        }
        .nav-item:hover { background: var(--accent-bg); color: var(--text-primary); }
        .nav-item svg { width: 14px; height: 14px; opacity: 0.7; }
        
        .sidebar-footer { 
            padding: 16px; border-top: 1px solid var(--border-subtle); 
            font-size: 11px; color: var(--text-muted); text-align: center;
        }

        /* Main Content */
        .main-content { 
            flex: 1; display: flex; flex-direction: column; 
            position: relative; background: var(--bg-root); min-width: 0;
        }

        header { 
            height: var(--header-height); padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            background: rgba(9, 9, 11, 0.8); /* Very subtle blur base */
            backdrop-filter: blur(8px);
            z-index: 50;
            position: sticky; top: 0;
        }

        .status-badge {
            font-size: 11px; font-weight: 500; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px;
            padding: 4px 8px; background: var(--bg-surface);
            border: 1px solid var(--border-subtle); border-radius: 99px;
        }
        .status-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; }

        /* Chat Area */
        .chat-container { 
            flex: 1; overflow-y: auto; 
            padding: 24px 0; 
            display: flex; flex-direction: column; 
            width: 100%; 
        }
        
        .chat-wrapper { max-width: 768px; margin: 0 auto; width: 100%; padding: 0 24px; }

        /* Welcome Screen */
        .welcome {
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; height: 100%; text-align: center;
            padding-top: 10vh;
        }
        .welcome h1 { font-size: 28px; margin-bottom: 8px; }
        .welcome p { font-size: 15px; color: var(--text-muted); max-width: 400px; margin-bottom: 32px; }

        /* Messages */
        .message { 
            display: flex; gap: 16px; margin-bottom: 24px; width: 100%;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { flex-direction: row-reverse; }
        
        .avatar { 
            width: 24px; height: 24px; border-radius: 4px; 
            flex-shrink: 0; display: grid; place-items: center; 
            font-size: 11px; font-weight: 600;
        }
        .ai .avatar { background: var(--text-primary); color: var(--bg-root); }
        .user .avatar { background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border-subtle); }

        .msg-content { flex: 1; min-width: 0; }
        
        /* BUBBLES & CONTENT */
        
        /* User: Minimalist Pill */
        .user .bubble {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px;
            display: inline-block;
            float: right; /* Keeps it right aligned */
            max-width: 100%;
            font-size: 14px;
        }
        .user .bubble::after { content: ""; display: block; clear: both; }

        /* AI: Transparent, Document Style */
        .ai .bubble {
            background: transparent;
            padding: 0;
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.7;
        }

        /* AI Markdown Specifics */
        .ai .bubble strong { color: var(--text-primary); font-weight: 600; }
        .ai .bubble a { color: var(--text-primary); text-decoration: underline; text-underline-offset: 3px; }
        .ai .bubble ul, .ai .bubble ol { margin: 0.8em 0; padding-left: 1.5em; color: var(--text-secondary); }
        .ai .bubble li { margin-bottom: 0.4em; }
        .ai .bubble p { margin-bottom: 1em; }
        .ai .bubble p:last-child { margin-bottom: 0; }

        /* Code Blocks */
        .code-block-wrapper {
            background: #0d0d0d; /* Slightly lighter than root */
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            margin: 1em 0;
            overflow: hidden;
        }
        .code-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; border-bottom: 1px solid var(--border-subtle);
            background: #111;
            font-size: 11px; color: var(--text-muted);
            font-family: 'Inter', sans-serif;
        }
        .code-header button {
            font-size: 10px; opacity: 0.7; gap: 4px;
        }
        .code-header button:hover { opacity: 1; color: var(--text-primary); }
        
        .ai .bubble pre {
            margin: 0 !important; padding: 0 !important;
            background: transparent !important; border: none !important;
        }
        .ai .bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: transparent;
        }
        .ai .bubble :not(pre) > code {
            background: var(--accent-bg);
            border: 1px solid var(--border-subtle);
            padding: 2px 6px; border-radius: 4px; color: var(--text-code);
            font-size: 0.9em;
        }

        /* Input Area - The "Command Center" */
        .input-wrapper {
            width: 100%; max-width: 768px; margin: 0 auto;
            padding: 0 24px 24px;
        }
        
        .input-box {
            background: var(--bg-root);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex; flex-direction: column; gap: 8px;
            transition: border-color 0.2s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4); /* Heavy feel */
        }
        .input-box:focus-within { border-color: var(--text-muted); }

        .file-row { display: flex; flex-wrap: wrap; gap: 6px; }
        .file-chip {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            font-size: 11px; padding: 4px 8px; border-radius: 4px;
            display: flex; align-items: center; gap: 6px; color: var(--text-secondary);
        }
        .file-chip button { padding: 0; margin-left: 2px; }
        .file-chip button:hover { color: var(--text-primary); }

        .type-row { display: flex; align-items: flex-end; gap: 8px; }
        
        textarea {
            width: 100%; background: transparent; border: none; color: var(--text-primary);
            font-family: inherit; font-size: 14px; resize: none; max-height: 200px;
            padding: 4px 0; outline: none; line-height: 1.5;
        }
        textarea::placeholder { color: var(--text-muted); }

        .tool-btn {
            width: 32px; height: 32px; border-radius: var(--radius-md);
            color: var(--text-muted); font-size: 16px;
        }
        .tool-btn:hover { background: var(--bg-surface); color: var(--text-primary); }
        .tool-btn.recording { color: #ef4444; animation: pulse-red 1.5s infinite; }
        
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); } 70% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

        .input-footer {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; color: var(--text-muted); padding: 0 4px;
        }

        /* Toast Notification */
        #toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 10000;
            display: flex; flex-direction: column; gap: 10px; pointer-events: none;
        }
        .toast {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            color: var(--text-primary); padding: 12px 16px; border-radius: var(--radius-md);
            font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px;
            pointer-events: auto; animation: slideIn 0.3s ease;
            min-width: 250px;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* Loading / Cursor */
        .typing-indicator { display: inline-flex; gap: 4px; align-items: center; height: 24px; margin-top: 8px;}
        .typing-cursor { width: 6px; height: 14px; background: var(--text-muted); animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Modal */
        dialog {
            background: var(--bg-surface); border: 1px solid var(--border-subtle);
            color: var(--text-primary); border-radius: var(--radius-lg);
            padding: 0; width: 90%; max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        dialog::backdrop { background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
        .dialog-header { padding: 16px; border-bottom: 1px solid var(--border-subtle); font-weight: 600; display: flex; justify-content: space-between;}
        .dialog-body { padding: 8px; }
        .dialog-btn {
            width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--radius-md);
            color: var(--text-secondary); display: flex; align-items: center; gap: 8px;
        }
        .dialog-btn:hover { background: var(--accent-bg); color: var(--text-primary); }

        /* Mobile */
        .mobile-toggle, .overlay { display: none; }
        @media (max-width: 768px) {
            .sidebar { 
                position: fixed; top: 0; left: 0; bottom: 0; 
                transform: translateX(-100%); width: 85%; max-width: 300px;
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }
            .sidebar.active { transform: translateX(0); }
            .overlay {
                display: block; position: fixed; inset: 0;
                background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
                z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.3s;
            }
            .overlay.active { opacity: 1; pointer-events: auto; }
            .mobile-toggle { display: block; margin-right: 8px; }
            .chat-wrapper, .input-wrapper { padding: 0 16px; }
            .input-wrapper { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
        }
    </style>

<body>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Overlay for Mobile Sidebar -->
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="logo-box">v9.1</div>
                <div class="brand-name">eSAMz AI</div>
            </div>
            <button class="btn-base btn-secondary" style="width: 100%; justify-content: center; gap: 6px;" id="btnNewChat">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                New Chat
            </button>
        </div>

        <div class="nav-section">
            <div class="nav-label">Recent</div>
            <div id="historyList"></div>
            
            <div class="nav-label">System</div>
            <button class="nav-item" id="btnExport">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Data
            </button>
            <button class="nav-item" id="btnClearCache">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                Clear History
            </button>
        </div>

        <div class="sidebar-footer">
            &copy; 2025 eSAMz AI
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div style="display: flex; align-items: center;">
                <button class="mobile-toggle tool-btn" id="openSidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="status-badge">
                    <div class="status-dot"></div>
                    <span id="statusText">Ready</span>
                </div>
            </div>
            <button class="btn-base btn-secondary" id="btnClearChat">Clear Chat</button>
        </header>

        <div class="chat-container">
            <div class="chat-wrapper">
                <!-- Welcome Screen -->
                <div class="welcome" id="welcomeScreen">
                    <h1>hello architect</h1>
                    <p>Hwhat do you want to build today</p>
                </div>
                
                <!-- Chat Messages Area -->
                <div id="chatList"></div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-wrapper">
            <div class="input-box" id="inputBox">
                <div class="file-row" id="filePreview"></div>
                <div class="type-row">
                    <button class="tool-btn" id="btnUpload" title="Attach file">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>

                    </button>
                    <textarea id="userInput" rows="1" placeholder="Type a message..."></textarea>
                    <button class="btn-base btn-primary" id="btnSend" style="width: 32px; padding: 0; justify-content: center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <div class="input-footer">

        </div>

    <dialog id="exportDialog">
        <div class="dialog-header">
            <span>Export Conversation</span>
            <button class="tool-btn" id="closeDialog">✕</button>
        </div>
        <div class="dialog-body">

            <button class="dialog-btn" onclick="app.exportChat('md')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Markdown (.md)
            </button>
        </div>
    </dialog>

    <script>
        /* =========================================
           LOGIC & APPLICATION STATE
           ========================================= */

        // Simple Intent Detector
        function detectIntent(text, files) {
            if (files && files.length > 0) return "file";
            const codeTriggers = ["code", "function", "class", "import", "script", "debug", "refactor", "api", "endpoint", "json", "sql"];
            if (codeTriggers.some(k => text.toLowerCase().includes(k))) return "code";
            return "chat";
        }

        class App {
            constructor() {
                this.dom = {
                    chatList: document.getElementById('chatList'),
                    input: document.getElementById('userInput'),
                    welcome: document.getElementById('welcomeScreen'),
                    historyList: document.getElementById('historyList'),
                    filePreview: document.getElementById('filePreview'),
                    sidebar: document.getElementById('sidebar'),
                    overlay: document.getElementById('overlay'),
                    statusText: document.getElementById('statusText'),
                    charCount: document.getElementById('charCount'),
                    toastContainer: document.getElementById('toast-container'),
                    inputBox: document.getElementById('inputBox')
                };

                this.state = {
                    chatId: null,
                    files: [],
                    isProcessing: false,
                    isRecording: false,
                    maxChars: 4000,
                    abortController: null,
                    reader: null
                };

                this.storageKey = 'esamz_conversations_v13';
                
                this.recognition = null;
                this.initSpeech();
                this.init();
            }

            initSpeech() {
                if ('webkitSpeechRecognition' in window) {
                    const SpeechRecognition = window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = false;
                    this.recognition.lang = 'en-US';
                    
                    this.recognition.onstart = () => {
                        this.state.isRecording = true;
                        document.getElementById('btnVoice').classList.add('recording');
                        this.dom.statusText.textContent = "Listening...";
                    };
                    
                    this.recognition.onend = () => {
                        this.state.isRecording = false;
                        document.getElementById('btnVoice').classList.remove('recording');
                        this.dom.statusText.textContent = "Ready";
                    };
                    
                    this.recognition.onresult = (e) => {
                        const transcript = e.results[0][0].transcript;
                        this.dom.input.value += (this.dom.input.value ? ' ' : '') + transcript;
                        this.dom.input.dispatchEvent(new Event('input'));
                    };
                } else {
                    document.getElementById('btnVoice').style.display = 'none';
                }
            }

            init() {
                this.loadHistory();
                this.setupListeners();
                this.dom.input.focus();
                
                // Responsive sidebar
                document.getElementById('openSidebar').onclick = () => {
                    this.dom.sidebar.classList.add('active');
                    this.dom.overlay.classList.add('active');
                };
                const closeSidebar = () => {
                    this.dom.sidebar.classList.remove('active');
                    this.dom.overlay.classList.remove('active');
                };
                this.dom.overlay.onclick = closeSidebar;
            }

            setupListeners() {
                // Input Auto-resize
                this.dom.input.addEventListener('input', () => {
                    this.dom.input.style.height = 'auto';
                    this.dom.input.style.height = Math.min(this.dom.input.scrollHeight, 200) + 'px';
                    this.dom.charCount.textContent = `${this.dom.input.value.length} / ${this.state.maxChars}`;
                });

                this.dom.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.handleSend();
                    }
                });

                document.getElementById('btnSend').onclick = () => this.handleSend();
                document.getElementById('btnNewChat').onclick = () => this.newChat();
                document.getElementById('btnClearChat').onclick = () => {
                    if(confirm("Clear current chat?")) this.newChat();
                };
                document.getElementById('btnClearCache').onclick = () => {
                    if(confirm("Delete ALL history?")) {
                        localStorage.removeItem(this.storageKey);
                        location.reload();
                    }
                };

                // Files
                document.getElementById('btnUpload').onclick = () => document.getElementById('fileInput').click();
                document.getElementById('fileInput').onchange = (e) => this.handleFiles(e.target.files);

                // Voice
                document.getElementById('btnVoice').onclick = () => {
                    if (this.state.isRecording) this.recognition.stop();
                    else this.recognition.start();
                };

                // Export
                const dialog = document.getElementById('exportDialog');
                document.getElementById('btnExport').onclick = () => dialog.showModal();
                document.getElementById('closeDialog').onclick = () => dialog.close();
            }

            /* --- UI HELPERS --- */

            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = 'toast';
                let icon = type === 'error' ? '⚠️' : 'ℹ️';
                toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
                this.dom.toastContainer.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            scrollToBottom() {
                this.dom.chatList.lastElementChild?.scrollIntoView({ behavior: 'smooth' });
            }

            /* --- FILE HANDLING & OCR --- */

            async handleFiles(fileList) {
                if (!fileList.length) return;
                
                for (const file of fileList) {
                    // Simple visual feedback immediately
                    const chip = document.createElement('div');
                    chip.className = 'file-chip';
                    chip.innerHTML = `<span>${file.name}</span>`;
                    this.dom.filePreview.appendChild(chip);

                    const ext = file.name.split('.').pop().toLowerCase();
                    const imageExts = ['png','jpg','jpeg','gif','webp','bmp'];
                    
                    try {
                        let content = '';
                        if (imageExts.includes(ext)) {
                            this.showToast(`Scanning ${file.name}...`);
                            content = await this.runOCR(file);
                        } else {
                            content = await file.text();
                        }
                        
                        this.state.files.push({
                            name: file.name,
                            type: imageExts.includes(ext) ? 'image' : 'text',
                            content: content
                        });
                    } catch (e) {
                        this.showToast(`Failed to process ${file.name}`, 'error');
                        chip.remove();
                    }
                }
            }

            async runOCR(file) {
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage('eng');
                await worker.initialize('eng');
                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();
                return text;
            }

            /* --- CHAT LOGIC --- */

            async handleSend() {
                const text = this.dom.input.value.trim();
                if ((!text && this.state.files.length === 0) || this.state.isProcessing) return;

                this.dom.input.value = '';
                this.dom.input.style.height = 'auto';
                this.dom.welcome.style.display = 'none';
                
                // Start new session if needed
                if (!this.state.chatId) {
                    this.state.chatId = Date.now().toString();
                    this.saveToHistory({ id: this.state.chatId, title: text.slice(0, 30) || 'Untitled', messages: [] });
                    this.renderHistoryItem(this.state.chatId, text.slice(0, 30));
                }

                // 1. Render User Message
                let userMsgText = text;
                if (this.state.files.length > 0) {
                    userMsgText += '\n\n' + this.state.files.map(f => {
                        const icon = f.type === 'image' ? '🖼️' : '📄';
                        return `${icon} **${f.name}**\n\`\`\`\n${f.content}\n\`\`\``;
                    }).join('\n');
                }
                this.appendMessage('user', userMsgText);
                this.saveMessage(this.state.chatId, 'user', userMsgText);

                const filesToSend = [...this.state.files];
                this.state.files = [];
                this.dom.filePreview.innerHTML = '';

                // 2. Render AI Placeholder with Thinking Indicator
                this.state.isProcessing = true;
                document.getElementById('btnSend').disabled = true;
                this.dom.statusText.textContent = "Thinking...";
                
                const aiMsgDiv = this.appendMessage('ai', '', true); // True = loading state
                const contentDiv = aiMsgDiv.querySelector('.bubble');

                // 3. API Call
                this.state.abortController = new AbortController();

                try {
                    const response = await fetch("/api/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            intent: detectIntent(text, filesToSend),
                            files: filesToSend,
                            sessionId: this.state.chatId
                        }),
                        signal: this.state.abortController.signal
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);

                    // 4. Handle Stream
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let fullText = "";
                    let buffer = "";

                    // Remove thinking indicator once stream starts
                    contentDiv.innerHTML = ''; 

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || "";

                        for (const line of lines) {
                            if (!line.trim()) continue;
                            const sepIdx = line.indexOf('|');
                            if (sepIdx === -1) continue;
                            
                            const type = line.substring(0, sepIdx);
                            const data = line.substring(sepIdx + 1);

                            if (type === 'STATUS') {
                                if (data === 'SEARCHING') this.dom.statusText.textContent = "Searching...";
                                if (data === 'TYPING') this.dom.statusText.textContent = "Typing...";
                            } else if (type === 'CHUNK') {
                                const cleanData = data.replace(/\\n/g, '\n');
                                fullText += cleanData;
                                
                                // Live Markdown Render
                                try {
                                    contentDiv.innerHTML = marked.parse(fullText);
                                    // Re-apply syntax highlight to new content
                                    if (window.Prism) Prism.highlightAllUnder(contentDiv);
                                    // Inject copy buttons into new code blocks
                                    this.injectCodeButtons(contentDiv);
                                } catch (e) { contentDiv.textContent = fullText; }
                                
                                this.scrollToBottom();
                            } else if (type === 'ERROR') {
                                throw new Error(data);
                            }
                        }
                    }

                    // Finalize
                    this.saveMessage(this.state.chatId, 'ai', fullText);
                    
                } catch (error) {
                    if (error.name === 'AbortError') {
                        contentDiv.innerHTML += '<p><i>[Stopped by user]</i></p>';
                    } else {
                        this.showToast(error.message, 'error');
                        contentDiv.innerHTML = `<span style="color:#ef4444">Error: ${error.message}</span>`;
                    }
                } finally {
                    this.state.isProcessing = false;
                    document.getElementById('btnSend').disabled = false;
                    this.dom.statusText.textContent = "Ready";
                    this.state.abortController = null;
                    this.scrollToBottom();
                }
            }

            appendMessage(role, text, isLoading = false) {
                const div = document.createElement('div');
                div.className = `message ${role}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = role === 'user' ? 'U' : 'eS';

                const content = document.createElement('div');
                content.className = 'msg-content';

                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                
                if (isLoading) {
                    bubble.innerHTML = `
                        <div class="typing-indicator">
                            <span style="font-size:12px; color:var(--text-muted);">eSAMz is thinking</span>
                            <div class="typing-cursor"></div>
                        </div>`;
                } else {
                    // Parse text immediately for non-streaming (history load)
                    try {
                        bubble.innerHTML = marked.parse(text);
                        if (window.Prism) Prism.highlightAllUnder(bubble);
                        this.injectCodeButtons(bubble);
                    } catch (e) { bubble.textContent = text; }
                }

                content.appendChild(bubble);
                
                // Actions (Copy) for User & AI
                const actions = document.createElement('div');
                actions.style.marginTop = '8px';
                actions.style.opacity = '0'; // Hidden by default
                actions.style.transition = 'opacity 0.2s';
                actions.style.fontSize = '12px';
                
                const copyBtn = document.createElement('button');
                copyBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                copyBtn.style.color = 'var(--text-muted)';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    this.showToast("Copied to clipboard");
                };
                actions.appendChild(copyBtn);
                content.appendChild(actions);

                div.onmouseenter = () => actions.style.opacity = '1';
                div.onmouseleave = () => actions.style.opacity = '0';

                div.appendChild(avatar);
                div.appendChild(content);
                this.dom.chatList.appendChild(div);
                return div;
            }

            injectCodeButtons(container) {
                const pres = container.querySelectorAll('pre');
                pres.forEach(pre => {
                    if (pre.parentElement.classList.contains('code-block-wrapper')) return; // Already wrapped

                    const code = pre.querySelector('code');
                    const lang = code ? code.className.replace('language-', '') : 'Code';
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';
                    
                    const header = document.createElement('div');
                    header.className = 'code-header';
                    header.innerHTML = `<span>${lang}</span><button>Copy</button>`;
                    
                    header.querySelector('button').onclick = () => {
                        navigator.clipboard.writeText(pre.textContent);
                        header.querySelector('button').textContent = 'Copied!';
                        setTimeout(() => header.querySelector('button').textContent = 'Copy', 2000);
                    };

                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(header);
                    wrapper.appendChild(pre);
                });
            }

            /* --- HISTORY & STORAGE --- */

            loadHistory() {
                const raw = localStorage.getItem(this.storageKey);
                const history = raw ? JSON.parse(raw) : [];
                history.forEach(chat => {
                    if(chat.id) this.renderHistoryItem(chat.id, chat.title);
                });
            }

            renderHistoryItem(id, title) {
                const btn = document.createElement('button');
                btn.className = 'nav-item';
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> ${title}`;
                btn.onclick = () => {
                    this.dom.sidebar.classList.remove('active');
                    this.dom.overlay.classList.remove('active');
                    this.loadChat(id);
                };
                this.dom.historyList.appendChild(btn);
            }

            loadChat(id) {
                this.state.chatId = id;
                this.dom.welcome.style.display = 'none';
                this.dom.chatList.innerHTML = '';
                
                const raw = localStorage.getItem(this.storageKey);
                const history = raw ? JSON.parse(raw) : [];
                const chat = history.find(c => c.id === id);
                
                if (chat && chat.messages) {
                    chat.messages.forEach(m => this.appendMessage(m.role, m.content));
                }
            }

            saveToHistory(chatObj) {
                const raw = localStorage.getItem(this.storageKey);
                const history = raw ? JSON.parse(raw) : [];
                history.unshift(chatObj);
                localStorage.setItem(this.storageKey, JSON.stringify(history));
            }

            saveMessage(chatId, role, content) {
                const raw = localStorage.getItem(this.storageKey);
                const history = raw ? JSON.parse(raw) : [];
                const chat = history.find(c => c.id === chatId);
                if (chat) {
                    chat.messages.push({ role, content, ts: Date.now() });
                    localStorage.setItem(this.storageKey, JSON.stringify(history));
                }
            }

            newChat() {
                this.state.chatId = null;
                this.state.files = [];
                this.dom.chatList.innerHTML = '';
                this.dom.welcome.style.display = 'flex';
                this.dom.input.focus();
            }

            /* --- EXPORT --- */
            exportChat(type) {
                const messages = Array.from(document.querySelectorAll('.message'));
                if (!messages.length) return this.showToast("Nothing to export", 'error');

                const content = messages.map(m => {
                    const role = m.classList.contains('user') ? 'User' : 'eSAMz';
                    const txt = m.querySelector('.bubble').innerText;
                    return `### ${role}\n${txt}`;
                }).join('\n\n---\n\n');

                const blob = new Blob([content], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `esamz-chat-${Date.now()}.${type}`;
                a.click();
                URL.revokeObjectURL(url);
                document.getElementById('exportDialog').close();
            }
        }

        const app = new App();
    </script>
</body>
</html>
