<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eSAMz v7 – AI Assistant</title>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://esamz.site/#organization",
      "name": "eSAMz",
      "legalName": "eSAMz AI",
      "url": "https://esamz.site",
      "logo": "https://esamz.site/logo.png",
      "foundingDate": "2025",
      "founder": { "@type": "Person", "name": "Alakmar Teenwala" },
      "brand": { "@type": "Brand", "name": "eSAMz AI", "slogan": "Not just responsive but supportive" }
    }
  ]
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<style>
/* RESTORED SPICES + SIDEBAR FIX */
:root {
    --accent: #667eea;
    --accent-grad: linear-gradient(135deg, #667eea, #764ba2);
    --bg: #0a0a0a;
    --panel: #111;
    --border: rgba(255, 255, 255, 0.08);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter', sans-serif; background:var(--bg); color:#e5e5e5; height:100vh; overflow:hidden;}

.app{height:100%; display:flex; position:relative}

/* SIDEBAR: Visible on Desktop by default */
.sidebar{
    width:300px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; flex-shrink:0; transition: transform 0.3s ease;
}
.sidebar.collapsed{transform:translateX(-100%)}

.main{flex:1; display:flex; flex-direction:column; min-width:0; position:relative;}

/* HEADER */
.header{
    height:60px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; padding:0 24px;
}
.header-title{font-weight:700; background:var(--accent-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}
.header-btn{background:rgba(102,126,234,.1); border:1px solid rgba(102,126,234,.2); border-radius:6px; padding:6px 12px; color:#999; cursor:pointer; font-size:12px; margin-left:5px;}

/* CHAT AREA */
.chat{flex:1; padding:24px 24px 120px; overflow-y:auto; scroll-behavior:smooth}
.welcome{
    padding:48px 24px; border-radius:16px; text-align:center;
    background:linear-gradient(135deg,rgba(102,126,234,.1),rgba(118,75,162,.1));
    border:1px solid rgba(102,126,234,.2); margin-bottom:20px;
}
.welcome h2{font-size:28px; margin-bottom:10px; background:var(--accent-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}

/* MESSAGES */
.message{display:flex; margin-bottom:25px; gap:12px; animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:translateY(0)}}
.message.user{justify-content:flex-end}
.message-avatar{width:35px; height:35px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700;}
.user .message-avatar{background:var(--accent-grad); order:2}
.ai .message-avatar{background:#1a1a1a; border:1px solid var(--border)}

.bubble{max-width:75%; padding:14px 18px; border-radius:14px; font-size:14px; line-height:1.6;}
.user .bubble{background:var(--accent-grad); color:#fff; border-bottom-right-radius:2px}
.ai .bubble{background:#1a1a1a; border:1px solid var(--border); border-bottom-left-radius:2px; color:#ddd;}

/* CODE BLOCK SPICE */
.code-wrapper{background:#000; border-radius:10px; margin:15px 0; border:1px solid var(--border); overflow:hidden;}
.code-header{background:#1d1d1d; padding:8px 15px; display:flex; justify-content:space-between; font-size:11px; color:#888;}
pre{padding:15px !important; margin:0 !important; font-family:'JetBrains Mono', monospace !important; font-size:13px !important;}

/* INPUT BAR */
.input-bar{position:fixed; bottom:0; left:300px; right:0; background:var(--panel); border-top:1px solid var(--border); padding:15px 20px; z-index:100;}
@media(max-width:768px){ .input-bar{left:0;} .sidebar{position:fixed; z-index:1000; height:100%; transform:translateX(-100%);} .sidebar.open{transform:translateX(0);}}

.input-wrap{display:flex; gap:10px; background:#1a1a1a; border:1px solid var(--border); border-radius:12px; padding:10px 15px; align-items:flex-end;}
textarea{flex:1; background:none; border:none; color:#fff; resize:none; outline:none; font-size:14px; max-height:150px;}

.files-preview{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
.file-badge{background:rgba(102,126,234,0.2); padding:5px 10px; border-radius:6px; font-size:11px; display:flex; align-items:center; gap:5px; border:1px solid var(--accent);}

.send-btn{background:var(--accent-grad); border:none; color:white; padding:8px 20px; border-radius:8px; cursor:pointer; font-weight:600;}
.icon-btn{background:none; border:none; color:#777; font-size:18px; cursor:pointer; transition:0.2s;}
.icon-btn:hover{color:var(--accent);}
.recording{color:#ef4444 !important; animation: pulse 1s infinite;}
@keyframes pulse{50%{opacity:0.5}}
</style>
</head>

<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div style="padding:25px; border-bottom:1px solid var(--border)">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
                <div style="width:35px; height:35px; background:var(--accent-grad); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800;">e</div>
                <h2 style="font-size:18px;">eSAMz v7</h2>
            </div>
            <button onclick="newChat()" style="width:100%; padding:10px; border:none; border-radius:8px; background:var(--accent-grad); color:white; font-weight:600; cursor:pointer;">+ New Chat</button>
        </div>
        <div id="chatHistory" style="flex:1; overflow-y:auto; padding:15px;"></div>
        <div style="padding:15px; border-top:1px solid var(--border)">
            <button onclick="clearAllHistory()" style="width:100%; background:none; border:1px solid #333; color:#888; padding:8px; border-radius:6px; font-size:12px; cursor:pointer;">🗑 Clear History</button>
            <div style="font-size:10px; color:#444; margin-top:10px; text-align:center;">© 2025 Alakmar Teenwala</div>
        </div>
    </aside>

    <main class="main">
        <button onclick="toggleSidebar()" style="position:fixed; top:12px; left:12px; z-index:1001; background:var(--panel); border:1px solid var(--border); color:white; width:35px; height:35px; border-radius:6px; cursor:pointer;" class="mobile-only">☰</button>
        <header class="header">
            <div class="header-title">Intelligence Center</div>
            <div class="header-actions">
                <button class="header-btn" onclick="exportChat()">📥 Export</button>
                <button class="header-btn" onclick="clearCurrentChat()">🗑 Clear</button>
            </div>
        </header>

        <section class="chat" id="chat">
            <div class="welcome" id="welcomeMsg">
                <h2>eSAMz Artificial Intelligence</h2>
                <p>Fast. Contextual. Reliable.</p>
                <div style="display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap;">
                    <div style="padding:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; font-size:12px;">⚡ High Speed</div>
                    <div style="padding:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; font-size:12px;">📎 Multi-File</div>
                    <div style="padding:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; font-size:12px;">🎤 Voice Mode</div>
                </div>
            </div>
        </section>

        <div class="input-bar">
            <div class="files-preview" id="filesContainer"></div>
            <div class="input-wrap">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" hidden multiple onchange="handleFiles(this.files)">
                <button class="icon-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
                <textarea id="userInput" placeholder="Ask eSAMz anything..." rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('userInput'), sendBtn = $('sendBtn'), sidebar = $('sidebar'), chatHistory = $('chatHistory'), welcomeMsg = $('welcomeMsg'), filesContainer = $('filesContainer');

let currentChatId = null, uploadedFiles = [], recognition = null, isRecording = false;

/* RESTORED ORIGINAL API LOGIC */
async function sendMessage() {
    const text = input.value.trim();
    if (!text && uploadedFiles.length === 0) return;

    if (!currentChatId) createChatEntry(text);
    
    welcomeMsg.style.display = 'none';
    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';

    // File Data for JSON (Original method)
    const fileData = uploadedFiles.map(f => ({ name: f.name, type: f.type, size: f.size }));
    
    // Clear previews
    uploadedFiles = [];
    filesContainer.innerHTML = '';

    addLoading();

    try {
        const res = await fetch('/api/chat', { // RESTORED ORIGINAL ENDPOINT
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, files: fileData }) // RESTORED ORIGINAL JSON FORMAT
        });
        const data = await res.json();
        removeLoading();
        addMessage(data.reply, 'ai');
    } catch (e) {
        removeLoading();
        addMessage("Connection to backend failed. Check your API route.", 'ai');
    }
}

function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    
    // Process markdown + code blocks
    let content = marked.parse(text);

    div.innerHTML = `
        <div class="message-avatar">${role === 'user' ? '👤' : '🤖'}</div>
        <div class="bubble">${content}</div>
    `;
    chat.appendChild(div);

    if (role === 'ai') {
        div.querySelectorAll('pre').forEach(pre => {
            const wrap = document.createElement('div');
            wrap.className = 'code-wrapper';
            wrap.innerHTML = `<div class="code-header"><span>Terminal</span><button onclick="copyCode(this)" style="background:none; border:none; color:var(--accent); cursor:pointer;">Copy</button></div>`;
            pre.parentNode.insertBefore(wrap, pre);
            wrap.appendChild(pre);
        });
        Prism.highlightAllUnder(div);
    }
    chat.scrollTop = chat.scrollHeight;
    saveToLocal();
}

/* STATE & HISTORY LOGIC */
function createChatEntry(title) {
    currentChatId = 'chat_' + Date.now();
    const history = JSON.parse(localStorage.getItem('esamz_history') || '[]');
    history.unshift({ id: currentChatId, title: title.slice(0, 30), timestamp: Date.now(), html: "" });
    localStorage.setItem('esamz_history', JSON.stringify(history));
    renderHistory();
}

function saveToLocal() {
    const history = JSON.parse(localStorage.getItem('esamz_history') || '[]');
    const idx = history.findIndex(i => i.id === currentChatId);
    if (idx !== -1) {
        history[idx].html = chat.innerHTML;
        localStorage.setItem('esamz_history', JSON.stringify(history));
    }
}

function renderHistory() {
    const history = JSON.parse(localStorage.getItem('esamz_history') || '[]');
    chatHistory.innerHTML = history.map(item => `
        <div class="history-item" onclick="loadChat('${item.id}')" style="padding:10px; cursor:pointer; border-radius:8px; margin-bottom:5px; background:rgba(255,255,255,0.03); font-size:13px;">
            💬 ${item.title}...
        </div>
    `).join('');
}

function loadChat(id) {
    const history = JSON.parse(localStorage.getItem('esamz_history') || '[]');
    const item = history.find(i => i.id === id);
    if (item) {
        currentChatId = id;
        welcomeMsg.style.display = 'none';
        chat.innerHTML = item.html;
        Prism.highlightAll();
    }
}

/* TOOLS */
function handleFiles(files) {
    Array.from(files).forEach(f => {
        uploadedFiles.push(f);
        const badge = document.createElement('div');
        badge.className = 'file-badge';
        badge.innerHTML = `📄 ${f.name.slice(0,10)}... <span onclick="this.parentElement.remove()" style="cursor:pointer">×</span>`;
        filesContainer.appendChild(badge);
    });
}

function toggleVoice() {
    if (!('webkitSpeechRecognition' in window)) return alert("Voice not supported");
    if (!recognition) {
        recognition = new webkitSpeechRecognition();
        recognition.onresult = (e) => { input.value += e.results[0][0].transcript; };
        recognition.onstart = () => $('voiceBtn').classList.add('recording');
        recognition.onend = () => $('voiceBtn').classList.remove('recording');
    }
    isRecording ? recognition.stop() : recognition.start();
    isRecording = !isRecording;
}

function addLoading() {
    const l = document.createElement('div'); l.id = 'loader'; l.className = 'message ai';
    l.innerHTML = `<div class="message-avatar">🤖</div><div class="bubble">Thinking...</div>`;
    chat.appendChild(l);
}
function removeLoading() { if($('loader')) $('loader').remove(); }

function toggleSidebar() { sidebar.classList.toggle('open'); }
function newChat() { welcomeMsg.style.display = 'block'; chat.innerHTML = ""; chat.appendChild(welcomeMsg); currentChatId = null; }
function clearAllHistory() { localStorage.removeItem('esamz_history'); renderHistory(); newChat(); }
function copyCode(btn) { 
    const code = btn.closest('.code-wrapper').querySelector('code').innerText;
    navigator.clipboard.writeText(code); btn.innerText = "Copied!";
    setTimeout(() => btn.innerText = "Copy", 2000);
}
function exportChat() {
    const blob = new Blob([chat.innerText], {type:'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'chat.txt'; a.click();
}

window.onload = () => { renderHistory(); };
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }});
</script>
</body>
</html>
