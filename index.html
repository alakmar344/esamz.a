    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111114;
            --surface-light: #1a1a1f;
            --surface-dark: #08080b;
            --accent: #7c3aed;
            --accent-glow: rgba(124, 58, 237, 0.25);
            --text-main: #f0f0f5;
            --text-muted: #a0a0b0;
            --border: rgba(255, 255, 255, 0.06);
            --shadow-dark: 10px 10px 20px rgba(0, 0, 0, 0.5);
            --shadow-light: -10px -10px 20px rgba(255, 255, 255, 0.08);
            --shadow-inset-dark: inset 6px 6px 12px rgba(0, 0, 0, 0.5);
            --shadow-inset-light: inset -6px -6px 12px rgba(255, 255, 255, 0.08);
            --radius: 24px;
            --radius-sm: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: 'Outfit', system-ui, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: grid;
            grid-template-columns: 300px 1fr;
            transition: grid-template-columns 0.4s ease;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Sidebar */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(20px);
            box-shadow: var(--shadow-dark), var(--shadow-light);
            display: flex;
            flex-direction: column;
            z-index: 20;
            height: 100%;
            transition: transform 0.4s ease;
        }

        .sidebar-header {
            padding: 1.5rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: grid;
            place-items: center;
            color: white;
            font-weight: 800;
            font-size: 1.3rem;
            box-shadow: var(--shadow-dark), var(--shadow-light);
        }

        .btn-new {
            width: 100%;
            padding: 1rem;
            background: var(--surface);
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            box-shadow: var(--shadow-dark), var(--shadow-light);
            transition: var(--transition);
        }

        .btn-new:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--accent-glow); }
        .btn-new:active { box-shadow: var(--shadow-inset-dark), var(--shadow-inset-light); }

        .nav-scroller {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 1rem;
        }

        .nav-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 1.5rem 0 0.5rem 0.25rem;
            font-weight: 700;
        }

        .nav-item {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--surface);
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            cursor: pointer;
            text-align: left;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            box-shadow: var(--shadow-dark), var(--shadow-light);

        .nav-item:hover { color: var(--text-main); transform: translateY(-2px); box-shadow: 0 0 20px var(--accent-glow); }
        .nav-item:active { box-shadow: var(--shadow-inset-dark), var(--shadow-inset-light); }

        .sidebar-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);

        /* Main Area */

            position: relative;
            display: flex;
            flex-direction: column;

        header {
            height: 64px;
            padding: 0 1.5rem;

            align-items: center;

            backdrop-filter: blur(20px);

        }

        .chat-stream {

        }

        .hero {

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }

        .avatar {

            color: white;
        }

        .ai .avatar {
            background: var(--surface-light);
            color: var(--accent);
        }

        .bubble {
            max-width: 85%;
            padding: 1.25rem 1.75rem;
            border-radius: var(--radius);
            font-size: 0.95rem;
            line-height: 1.6;
            box-shadow: var(--shadow-dark), var(--shadow-light);
        }

        .user .bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 8px;
        }

        .ai .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 8px;
            backdrop-filter: blur(10px);
        }

        /* Input Dock */
        .input-dock {
            position: sticky;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 5% 1.5rem;
            background: linear-gradient(to top, var(--bg) 50%, transparent);
            z-index: 30;
        }

        .dock-container {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 0.75rem 1.25rem;
            box-shadow: var(--shadow-dark), var(--shadow-light);
            backdrop-filter: blur(20px);
            transition: var(--transition);
        }

        .dock-container:focus-within {
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .file-chips {
            display: flex;
            gap: 0.5rem;
            padding: 0 0.5rem 0.75rem;
            flex-wrap: wrap;
        }

        .chip {
            background: var(--surface-light);
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.8rem;
            box-shadow: var(--shadow-dark), var(--shadow-light);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 0.75rem;
        }

        .btn-tool {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface);
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            box-shadow: var(--shadow-dark), var(--shadow-light);
            transition: var(--transition);
        }

        .btn-tool:hover { transform: scale(1.08); box-shadow: 0 0 20px var(--accent-glow); }
        .btn-send { background: var(--accent); color: white; }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            padding: 0.75rem 0;
            font-size: 1rem;
            resize: none;
            max-height: 180px;
            line-height: 1.5;
        }

        textarea::placeholder { color: var(--text-muted); }

        /* Mobile */
        @media (max-width: 768px) {
            body { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed;
                inset: 0 0 0 auto;
                width: 80%;
                max-width: 320px;

            .sidebar.active { transform: translateX(0); }

        }

        @media (max-width: 480px) {
            header { padding: 0 1rem; }
            .chat-stream { padding: 1rem 4% 14rem; }
            .bubble { max-width: 90%; padding: 1rem 1.5rem; }
        }

   <script>
/**
 * eSAMz v8  –  Universal File Support + OCR + Persistent Memory
 * Drop-in replacement script
 */
class App {
    constructor() {
        this.dom = {
            chat: document.getElementById('chatStream'),
            input: document.getElementById('userInput'),
            hero: document.getElementById('heroSection'),
            history: document.getElementById('historyList'),
            preview: document.getElementById('filePreview'),
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('overlay'),
            dock: document.getElementById('dockContainer'),
            dialog: document.getElementById('exportDialog')
        };

        this.state = {
            chatId: null,
            files: [],          // {file, textExtracted}
            isRecording: false,
            recognition: null,
            context: []
        };

        this.memoryKey = 'esamz_memory_v8'; // full memory array
        this.init();
    }

    /* ----------  LIFE-CYCLE  ---------- */
    init() {
        this.loadMemory();
        this.setupEventListeners();
        this.setupDragDrop();
        this.dom.input.focus();
    }

    setupEventListeners() {
        const { input } = this.dom;
        document.getElementById('btnSend').addEventListener('click', () => this.handleSend());
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.handleSend(); }
        });
        input.addEventListener('input', () => {
            input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px';
        });

        /* sidebar */
        document.getElementById('openSidebar').addEventListener('click', () => this.toggleSidebar(true));
        document.getElementById('closeSidebar').addEventListener('click', () => this.toggleSidebar(false));
        this.dom.overlay.addEventListener('click', () => this.toggleSidebar(false));

        /* nav */
        document.getElementById('btnNewChat').addEventListener('click', () => this.newChat());
        document.getElementById('btnClearChat').addEventListener('click', () => this.clearChat());
        document.getElementById('btnClearCache').addEventListener('click', () => this.purgeCache());

        /* files */
        document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput').addEventListener('change', e => this.handleFiles(e.target.files));

        /* voice */
        document.getElementById('btnVoice').addEventListener('click', () => this.toggleVoice());

        /* export */
        document.getElementById('btnExportModal').addEventListener('click', () => this.dom.dialog.showModal());
        document.getElementById('closeDialog').addEventListener('click', () => this.dom.dialog.close());
    }

    setupDragDrop() {
        const dock = this.dom.dock;
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt =>
            dock.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); })
        );
        dock.addEventListener('dragenter', () => dock.style.borderColor = 'var(--accent)');
        dock.addEventListener('dragleave', () => dock.style.borderColor = 'var(--border-glass)');
        dock.addEventListener('drop', e => this.handleFiles(e.dataTransfer.files));
    }

    /* ----------  FILE + OCR  ---------- */
    async handleFiles(fileList) {
        for (const file of fileList) {
            let text = '';
            if (file.type.startsWith('image/')) {
                text = await this.ocrImage(file);
            } else {
                text = await this.textFromFile(file);
            }
            this.state.files.push({ file, textExtracted: text });
        }
        this.renderFiles();
    }

    textFromFile(file) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => resolve('(unable to read file)');
            reader.readAsText(file);
        });
    }

    async ocrImage(file) {
        if (!('Tesseract' in window)) {
            // load tesseract from cdn on first use
            await import('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js');
        }
        try {
            const { data: { text } } = await Tesseract.recognize(file, 'eng');
            return text.trim();
        } catch {
            return '(OCR failed)';
        }
    }

    renderFiles() {
        this.dom.preview.innerHTML = '';
        this.state.files.forEach((item, idx) => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `📎 ${item.file.name} <button onclick="app.removeFile(${idx})">×</button>`;
            this.dom.preview.appendChild(chip);
        });
    }

    removeFile(idx) { this.state.files.splice(idx, 1); this.renderFiles(); }

    /* ----------  CHAT / MEMORY  ---------- */
    async handleSend() {
        const text = this.dom.input.value.trim();
        if (!text && this.state.files.length === 0) return;

        if (!this.state.chatId) this.createChatSession(text);

        this.dom.hero.style.display = 'none';

        // build user message
        let fullUser = text;
        if (this.state.files.length) {
            fullUser += '\n\n' + this.state.files.map(f =>
                `**File:** ${f.file.name}\n\`\`\`\n${f.textExtracted}\n\`\`\``
            ).join('\n');
        }

        this.addMessage(fullUser, 'user');
        this.appendToCurrentChat('user', fullUser);

        // clear input
        this.dom.input.value = ''; this.dom.input.style.height = 'auto';
        this.state.files = []; this.renderFiles();

        // thinking
        const thinkingId = this.addThinking();

        // backend call
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    files: this.state.files,
                    context: this.getContext(),
                    enableWebSearch: true
                })
            });
            if (!res.ok) throw new Error('Server error');
            const data = await res.json();
            this.removeThinking(thinkingId);
            const reply = data.reply || data.message || 'No reply';
            this.addMessage(reply, 'ai');
            this.appendToCurrentChat('ai', reply);
        } catch (e) {
            this.removeThinking(thinkingId);
            const reply = this.generateDemoResponse(text);
            this.addMessage(reply, 'ai');
            this.appendToCurrentChat('ai', reply);
        }
    }

    addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg-group ${sender}`;
        const avatar = sender === 'user' ? 'U' : 'v8';
        const htmlContent = marked.parse(text);
        div.innerHTML = `
            <div class="avatar">${avatar}</div>
            <div style="width:100%">
                <div class="bubble">${htmlContent}</div>
                ${sender === 'ai' ? `<div class="msg-actions"><button class="action-link" onclick="app.copyText(this)">Copy</button></div>` : ''}
            </div>`;
        this.dom.chat.appendChild(div);
        this.dom.chat.scrollTop = this.dom.chat.scrollHeight;
        if (window.Prism) Prism.highlightAllUnder(div);
    }

    addThinking() {
        const id = 'thinking-' + Date.now();
        const div = document.createElement('div');
        div.className = 'msg-group ai'; div.id = id;
        div.innerHTML = `
            <div class="avatar">v8</div>
            <div class="bubble" style="display:flex; align-items:center; gap:8px;">
                <span style="color:var(--accent); font-weight:600;">Processing</span>
                <span class="status-dot" style="background:var(--accent); animation:pulse-red 1s infinite"></span>
            </div>`;
        this.dom.chat.appendChild(div);
        this.dom.chat.scrollTop = this.dom.chat.scrollHeight;
        return id;
    }

    removeThinking(id) { const el = document.getElementById(id); if (el) el.remove(); }

    generateDemoResponse(text) {
        return `**eSAMz v8 (Demo Mode):**\n\nBackend unreachable. Simulating for "${text.slice(0,30)}..."\n\n\`\`\`javascript\nconsole.log("Backend Offline");\n\`\`\``;
    }

    /* ----------  MEMORY STORAGE  ---------- */
    loadMemory() {
        const raw = localStorage.getItem(this.memoryKey);
        const memory = raw ? JSON.parse(raw) : [];
        memory.forEach(chat => this.renderHistoryEntry(chat));
    }

    renderHistoryEntry(chat) {
        const btn = document.createElement('button');
        btn.className = 'nav-item';
        btn.innerHTML = `<span>💬</span> ${chat.title} <button onclick="app.deleteChat('${chat.id}')" style="margin-left:auto;background:none;border:none;color:#f87171;cursor:pointer;">🗑</button>`;
        btn.onclick = () => this.loadChat(chat.id);
        this.dom.history.appendChild(btn);
    }

    createChatSession(firstText) {
        this.state.chatId = Date.now().toString();
        const title = firstText.slice(0, 30) + (firstText.length > 30 ? '…' : '');
        const chat = { id: this.state.chatId, title, messages: [] };
        this.saveChat(chat);
        this.renderHistoryEntry(chat);
    }

    appendToCurrentChat(role, content) {
        const memory = this.getMemory();
        const chat = memory.find(c => c.id === this.state.chatId);
        if (chat) {
            chat.messages.push({ role, content, ts: Date.now() });
            this.saveMemory(memory);
        }
    }

    loadChat(chatId) {
        const memory = this.getMemory();
        const chat = memory.find(c => c.id === chatId);
        if (!chat) return;
        this.state.chatId = chatId;
        this.dom.chat.innerHTML = '';
        chat.messages.forEach(m => this.addMessage(m.content, m.role));
        this.dom.hero.style.display = 'none';
        this.toggleSidebar(false);
    }

    deleteChat(chatId) {
        if (!confirm('Delete this chat?')) return;
        let memory = this.getMemory();
        memory = memory.filter(c => c.id !== chatId);
        this.saveMemory(memory);
        // rebuild list
        this.dom.history.innerHTML = '';
        memory.forEach(c => this.renderHistoryEntry(c));
        if (this.state.chatId === chatId) this.newChat();
    }

    getContext() {
        const memory = this.getMemory();
        const chat = memory.find(c => c.id === this.state.chatId);
        if (!chat) return [];
        return chat.messages.slice(-10); // last 10
    }

    getMemory() { return JSON.parse(localStorage.getItem(this.memoryKey) || '[]'); }
    saveChat(chat) {
        const memory = this.getMemory();
        memory.unshift(chat);
        this.saveMemory(memory);
    }
    saveMemory(memory) { localStorage.setItem(this.memoryKey, JSON.stringify(memory)); }

    /* ----------  UTILS  ---------- */
    toggleSidebar(open) {
        if (open) { this.dom.sidebar.classList.add('active'); this.dom.overlay.classList.add('active'); }
        else { this.dom.sidebar.classList.remove('active'); this.dom.overlay.classList.remove('active'); }
    }
    newChat() {
        this.state.chatId = null;
        this.dom.chat.innerHTML = '';
        this.dom.chat.appendChild(this.dom.hero);
        this.dom.hero.style.display = 'block';
        this.toggleSidebar(false);
    }
    clearChat() { this.newChat(); }
    purgeCache() { if (confirm('Delete ALL neural memories?')) { localStorage.clear(); location.reload(); } }
    fillInput(text) { this.dom.input.value = text; this.dom.input.focus(); }
    copyText(btn) {
        const text = btn.closest('.msg-group').querySelector('.bubble').innerText;
        navigator.clipboard.writeText(text);
        const orig = btn.innerText; btn.innerText = 'Copied';
        setTimeout(() => btn.innerText = orig, 1500);
    }
    toggleVoice() {
        const btn = document.getElementById('btnVoice');
        if (!this.state.recognition) {
            if (!('webkitSpeechRecognition' in window)) return alert('Voice API not supported');
            this.state.recognition = new webkitSpeechRecognition();
            this.state.recognition.lang = 'en-US';
            this.state.recognition.onresult = e => this.dom.input.value += e.results[0][0].transcript;
            this.state.recognition.onend = () => { this.state.isRecording = false; btn.classList.remove('recording'); };
        }
        if (this.state.isRecording) { this.state.recognition.stop(); this.state.isRecording = false; btn.classList.remove('recording'); }
        else { this.state.recognition.start(); this.state.isRecording = true; btn.classList.add('recording'); }
    }
    exportChat(type) {
        const msgs = Array.from(document.querySelectorAll('.msg-group')).map(el => {
            const who = el.classList.contains('user') ? 'User' : 'eSAMz';
            const txt = el.querySelector('.bubble').innerText;
            return `[${who}]: ${txt}`;
        }).join('\n\n');
        const filename = `esamz-v8-export`;
        if (type === 'txt') this.download(filename + '.txt', msgs);
        if (type === 'md') this.download(filename + '.md', msgs);
        if (type === 'html') this.download(filename + '.html', `<pre>${msgs}</pre>`);
        if (type === 'pdf') {
            const el = document.createElement('div');
            el.innerHTML = marked.parse(msgs);
            html2pdf().from(el).save(filename + '.pdf');
        }
        this.dom.dialog.close();
    }
    download(name, content) {
        const link = document.createElement('a');
        link.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(content);
        link.download = name; link.click();
    }
}

const app = new App();
</script>
    </body>
</html>
