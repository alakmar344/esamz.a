<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>eSAMz v7 - AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- OFFICIAL eSAMz SCHEMA -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "name": "eSAMz",
        "legalName": "eSAMz AI",
        "url": "https://esamz.info",
        "logo": "https://esamz.info/logo.png",
        "founder": { "@type": "Person", "name": "Alakmar Teenwala" },
        "description": "eSAMz is a Strategic Artificial Mind engineered for clarity, warmth, and human-aligned intelligence."
      }
    ]
  }
  </script>

  <!-- ✅ ORIGINAL UI STYLES — UNTOUCHED -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
    }

    .app { height: 100vh; display: flex; background: #0a0a0a; }

    .sidebar {
      width: 280px;
      background: #111;
      border-right: 1px solid #222;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
      position: relative;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #222;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
    }

    .new-chat-btn {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .sidebar-content { padding: 16px; flex: 1; }

    .sidebar-content a {
      display: block;
      padding: 10px;
      margin-bottom: 6px;
      color: #999;
      border-radius: 6px;
      text-decoration: none;
    }

    .sidebar-content a:hover {
      background: #1a1a1a;
      color: white;
    }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid #222;
      font-size: 11px;
      color: #666;
      text-align: center;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    .header {
      height: 64px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .welcome {
      background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
      border: 1px solid #667eea30;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 24px;
      text-align: center;
    }

    .message { display: flex; margin-bottom: 16px; animation: slideIn 0.3s ease; }
    .message.user { justify-content: flex-end; }
    .message.ai { justify-content: flex-start; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 2px 8px rgba(102,126,234,.3);
    }

    .ai .bubble {
      background: #111;
      border: 1px solid #222;
    }

    .input-bar {
      padding: 20px;
      background: #111;
      border-top: 1px solid #222;
    }

    .input-wrap {
      display: flex;
      gap: 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 8px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      background: transparent;
      color: #e5e5e5;
      outline: none;
    }

    .send-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      cursor: pointer;
    }

    .file-preview {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">e</div>
        <div>eSAMz v7</div>
      </div>
      <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
    </div>

    <div class="sidebar-content">
      <a href="https://esamz.info" target="_blank">🏠 Home</a>
      <a href="https://esamz.info/docs" target="_blank">📚 Docs</a>
      <a href="https://esamz.info/aboutus" target="_blank">ℹ️ About</a>
      <a href="https://esamz.info/privacypolicy" target="_blank">🔒 Privacy</a>
    </div>

    <div class="sidebar-footer">
      © 2025 eSAMz<br>Created by Alakmar Teenwala
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="header">
      <div>Chat with eSAMz</div>
      <div>● Online</div>
    </div>

    <div class="chat" id="chat">
      <div class="welcome">
        <h2>Welcome to eSAMz v7</h2>
        <p>Ask anything. and dive into it.</p>
      </div>
    </div>

    <div class="input-bar">
      <div id="filePreview" class="file-preview"></div>
      <div class="input-wrap">
        <input type="file" id="fileInput" hidden accept=".txt,.pdf,.doc,.docx">
        <button onclick="fileInput.click()">📎</button>
        <textarea id="input" rows="1" placeholder="Type your message..."></textarea>
        <button class="send-btn" id="send">Send</button>
      </div>
    </div>
  </main>

</div>

<!-- ✅ LOGIC — FIXED BUT NOT STYLED -->
<script>
const chat = document.getElementById("chat")
const input = document.getElementById("input")
const send = document.getElementById("send")
const fileInput = document.getElementById("fileInput")
const filePreview = document.getElementById("filePreview")

let uploadedFile = null
let uploadedText = ""

function add(text, who) {
  const m = document.createElement("div")
  m.className = "message " + who
  const b = document.createElement("div")
  b.className = "bubble"
  b.textContent = text
  m.appendChild(b)
  chat.appendChild(m)
  chat.scrollTop = chat.scrollHeight
}

function newChat() {
  chat.innerHTML = `
    <div class="welcome">
      <h2>Welcome to eSAMz v7</h2>
      <p>Ask anything. Clarity first.</p>
    </div>`
  uploadedFile = null
  uploadedText = ""
  filePreview.textContent = ""
}

fileInput.onchange = async () => {
  const f = fileInput.files[0]
  if (!f) return
  uploadedFile = f
  uploadedText = f.type === "text/plain" ? await f.text() : ""
  filePreview.textContent = "Attached: " + f.name
}

async function sendMsg() {
  const text = input.value.trim()
  if (!text && !uploadedFile) return

  let payload = text
  if (uploadedText) {
    payload = `${uploadedText}\n\n${text}`
  } else if (uploadedFile) {
    payload = `[Attached file: ${uploadedFile.name}]\n\n${text}`
  }

  add(text || "[File sent]", "user")
  input.value = ""
  filePreview.textContent = ""
  uploadedFile = null
  uploadedText = ""

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: payload })
    })
    const j = await r.json()
    add(j.reply || "No response.", "ai")
  } catch {
    add("Error connecting to AI.", "ai")
  }
}

send.onclick = sendMsg
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault()
    sendMsg()
  }
})
</script>

</body>
</html>
