<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eSAMz v7 – Intelligence Redefined</title>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://esamz.site/#organization",
      "name": "eSAMz",
      "legalName": "eSAMz AI",
      "url": "https://esamz.site",
      "logo": "https://esamz.site/logo.png",
      "brand": { "name": "eSAMz AI", "slogan": "Not just responsive but supportive" }
    }
  ]
}
</script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<style>
:root {
    --accent: #667eea;
    --accent-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --bg: #050505;
    --panel: #111111;
    --border: rgba(255, 255, 255, 0.08);
    --text-main: #e5e5e5;
    --text-dim: #999;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; }

.app { display: flex; height: 100vh; width: 100%; position: relative; }

/* --- SPICED SIDEBAR --- */
.sidebar { 
    width: 300px; background: var(--panel); border-right: 1px solid var(--border); 
    display: flex; flex-direction: column; flex-shrink: 0; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 100;
}

.sidebar-header { padding: 25px; border-bottom: 1px solid var(--border); }
.logo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.logo-icon { width: 40px; height: 40px; background: var(--accent-grad); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: white; }

.side-nav { flex: 1; overflow-y: auto; padding: 15px; }
.nav-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin: 20px 0 10px 10px; display: block; }

.side-btn { 
    width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    color: #ccc; border-radius: 10px; cursor: pointer; text-align: left; margin-bottom: 8px; transition: 0.2s;
    display: flex; align-items: center; gap: 12px; font-size: 13px; text-decoration: none;
}
.side-btn:hover { background: rgba(255,255,255,0.07); border-color: var(--accent); color: white; }

/* --- MAIN CONTENT --- */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: radial-gradient(circle at top right, #111, transparent); }

.header { height: 65px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 25px; background: rgba(5,5,5,0.8); backdrop-filter: blur(10px); z-index: 10; }

/* Mobile Menu Toggle */
.menu-toggle { display: none; background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

/* --- RESPONSIVE LOGIC --- */
@media (max-width: 768px) {
    .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%); /* Closed by default on mobile */
    }
    .sidebar.open {
        transform: translateX(0);
    }
    .menu-toggle { display: block; }
    .chat-container, .input-area { padding-left: 5%; padding-right: 5%; }
    .feature-grid { grid-template-columns: 1fr; }
}

/* --- CHAT FLOW --- */
.chat-container { flex: 1; overflow-y: auto; padding: 40px 15%; scroll-behavior: smooth; }
.welcome-screen { text-align: center; padding: 60px 20px; animation: fadeIn 0.8s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.feature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 600px; margin: 30px auto; }
.feature-card { background: var(--panel); border: 1px solid var(--border); padding: 20px; border-radius: 16px; cursor: pointer; transition: 0.3s; text-align: left; }
.feature-card:hover { border-color: var(--accent); transform: translateY(-3px); background: rgba(255,255,255,0.02); }

/* --- MESSAGES --- */
.msg { margin-bottom: 30px; animation: slideUp 0.4s ease; line-height: 1.7; display: flex; gap: 15px; }
@keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { flex-direction: row-reverse; }
.msg-avatar { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
.user .msg-avatar { background: var(--accent-grad); }
.ai .msg-avatar { background: #1a1a1a; border: 1px solid var(--border); color: var(--accent); }

.bubble { max-width: 80%; padding: 16px 20px; border-radius: 18px; font-size: 15px; position: relative; }
.user .bubble { background: var(--accent-grad); color: white; border-bottom-right-radius: 4px; }
.ai .bubble { background: #161616; border: 1px solid var(--border); border-bottom-left-radius: 4px; color: #ddd; }

/* --- INPUT SPICE --- */
.input-area { padding: 20px 15% 40px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
.input-box-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 12px 18px; display: flex; flex-direction: column; backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
.input-row { display: flex; align-items: flex-end; gap: 12px; }
textarea { flex: 1; background: none; border: none; color: white; resize: none; outline: none; font-size: 15px; padding: 8px 0; max-height: 180px; }

.tool-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,255,255,0.05); color: #888; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.tool-btn:hover { background: rgba(255,255,255,0.1); color: white; }
.send-btn { background: var(--accent-grad) !important; color: white !important; }
.recording-mic { background: #ef4444 !important; color: white !important; animation: pulse 1.5s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } }

.file-preview-bar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.chip { background: var(--accent); color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 8px; }

/* --- CODE SPICE --- */
.code-wrapper { background: #000; border-radius: 12px; margin: 15px 0; border: 1px solid var(--border); overflow: hidden; }
.code-header { background: #1a1a1a; padding: 10px 15px; display: flex; justify-content: space-between; font-size: 11px; color: #666; }
</style>
</head>

<body>
<div class="app">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-box">
                <div class="logo-icon">e</div>
                <h2 style="font-weight: 800; letter-spacing: -0.5px;">eSAMz v7</h2>
            </div>
            <button class="side-btn" style="background: var(--accent-grad); color: white; border: none; font-weight: 600;" onclick="newChat()">+ New Chat</button>
        </div>
        
        <div class="side-nav">
            <span class="nav-label">Recent History</span>
            <div id="chatHistory"></div>

            <span class="nav-label">Options</span>
            <button class="side-btn" onclick="exportChat()"><span>📥</span> Export Chat</button>
            <button class="side-btn" onclick="clearAllHistory()"><span>🗑</span> Clear All Cache</button>
            
            <span class="nav-label">Resources</span>
            <a href="https://esamz.info/docs" class="side-btn"><span>📚</span> Documentation</a>
            <a href="https://esamz.info" class="side-btn"><span>🌐</span> Home Portal</a>
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <div id="status" style="font-size: 12px; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">● eSAMz Active</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="tool-btn" style="border-radius: 8px; width: auto; padding: 0 15px; font-size: 12px;" onclick="clearCurrentChat()">Clear Screen</button>
            </div>
        </header>

        <div class="chat-container" id="chat" onclick="closeSidebarOnMobile()">
            <div class="welcome-screen" id="welcomeMsg">
                <h1 style="font-size: 42px; font-weight: 800; margin-bottom: 10px;">Hello, Architect.</h1>
                <p style="color: var(--text-dim); font-size: 18px;">Ready to build something extraordinary today?</p>
                <div class="feature-grid">
                    <div class="feature-card" onclick="fillInput('Design a scalable database schema for a SaaS app')">
                        <h4 style="color: var(--accent); margin-bottom: 5px;">Logic Design</h4>
                        <p style="font-size: 12px; color: var(--text-dim);">Ask for code architectures and system flows.</p>
                    </div>
                    <div class="feature-card" onclick="fillInput('Explain the core principles of AI Alignment')">
                        <h4 style="color: #a855f7; margin-bottom: 5px;">Deep Research</h4>
                        <p style="font-size: 12px; color: var(--text-dim);">Summarize complex topics into clear insights.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="file-preview-bar" id="filesPreview"></div>
            <div class="input-box-wrap">
                <div class="input-row">
                    <button class="tool-btn" title="Upload Files" onclick="document.getElementById('fileInput').click()">📎</button>
                    <input type="file" id="fileInput" hidden multiple onchange="handleFiles(this.files)">
                    
                    <button class="tool-btn" id="voiceBtn" title="Voice Input" onclick="toggleVoice()">🎤</button>
                    
                    <textarea id="userInput" placeholder="Message eSAMz..." rows="1" oninput="autoGrow(this)"></textarea>
                    
                    <button class="tool-btn send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('userInput'), historyDiv = $('chatHistory'), welcomeMsg = $('welcomeMsg'), preview = $('filesPreview'), sidebar = $('sidebar');

let currentChatId = null, uploadedFiles = [], recognition = null, isRecording = false;

/* --- SIDEBAR TOGGLE --- */
function toggleSidebar() {
    sidebar.classList.toggle('open');
}

function closeSidebarOnMobile() {
    if (window.innerWidth <= 768) {
        sidebar.classList.remove('open');
    }
}

/* --- BACKEND CORE --- */
async function sendMessage() {
    const text = input.value.trim();
    if (!text && uploadedFiles.length === 0) return;
    
    closeSidebarOnMobile();

    if (!currentChatId) createChatId(text);
    
    welcomeMsg.style.display = 'none';
    addMessage(text, 'user');
    
    const filePayload = uploadedFiles.map(f => ({ name: f.name, type: f.type, size: f.size }));
    
    input.value = '';
    input.style.height = 'auto';
    preview.innerHTML = '';
    uploadedFiles = [];

    addLoading();

    try {
        const res = await fetch('/api/chat', { 
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, files: filePayload }) 
        });
        const data = await res.json();
        removeLoading();
        addMessage(data.reply || data.message, 'ai');
    } catch (e) {
        removeLoading();
        addMessage("System Alert: Connection to /api/chat failed. Check backend status.", 'ai');
    }
}

function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    
    const content = marked.parse(text);

    div.innerHTML = `
        <div class="msg-avatar">${role === 'user' ? '👤' : '🤖'}</div>
        <div class="bubble">${content}</div>
    `;
    chat.appendChild(div);

    if (role === 'ai') {
        div.querySelectorAll('pre').forEach(pre => {
            const w = document.createElement('div');
            w.className = 'code-wrapper';
            w.innerHTML = `<div class="code-header"><span>Terminal</span><button onclick="copyCode(this)" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:600;">Copy</button></div>`;
            pre.parentNode.insertBefore(w, pre);
            w.appendChild(pre);
        });
        Prism.highlightAllUnder(div);
    }
    chat.scrollTop = chat.scrollHeight;
    saveSession();
}

function createChatId(title) {
    currentChatId = 'chat_' + Date.now();
    const history = JSON.parse(localStorage.getItem('esamz_v7_history') || '[]');
    history.unshift({ id: currentChatId, title: title.slice(0, 30) + '...', html: "" });
    localStorage.setItem('esamz_v7_history', JSON.stringify(history));
    renderHistory();
}

function saveSession() {
    const history = JSON.parse(localStorage.getItem('esamz_v7_history') || '[]');
    const item = history.find(i => i.id === currentChatId);
    if (item) {
        item.html = chat.innerHTML;
        localStorage.setItem('esamz_v7_history', JSON.stringify(history));
    }
}

function renderHistory() {
    const history = JSON.parse(localStorage.getItem('esamz_v7_history') || '[]');
    historyDiv.innerHTML = history.map(h => `
        <button class="side-btn" onclick="loadChat('${h.id}')">💬 ${h.title}</button>
    `).join('');
}

function loadChat(id) {
    const history = JSON.parse(localStorage.getItem('esamz_v7_history') || '[]');
    const item = history.find(i => i.id === id);
    if (item) {
        currentChatId = id;
        welcomeMsg.style.display = 'none';
        chat.innerHTML = item.html;
        Prism.highlightAll();
        closeSidebarOnMobile();
    }
}

function handleFiles(files) {
    Array.from(files).forEach(f => {
        uploadedFiles.push(f);
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerHTML = `📄 ${f.name.slice(0,10)}... <span onclick="this.parentElement.remove()" style="cursor:pointer">×</span>`;
        preview.appendChild(chip);
    });
}

function toggleVoice() {
    if (!('webkitSpeechRecognition' in window)) return alert("Speech API not supported");
    if (!recognition) {
        recognition = new webkitSpeechRecognition();
        recognition.onresult = e => { input.value += e.results[0][0].transcript; autoGrow(input); };
        recognition.onstart = () => $('voiceBtn').classList.add('recording-mic');
        recognition.onend = () => $('voiceBtn').classList.remove('recording-mic');
    }
    isRecording ? recognition.stop() : recognition.start();
    isRecording = !isRecording;
}

function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function fillInput(t) { input.value = t; input.focus(); autoGrow(input); }
function addLoading() {
    const l = document.createElement('div'); l.id = 'loader'; l.className = 'msg ai';
    l.innerHTML = `<div class="msg-avatar">🤖</div><div class="bubble">Thinking...</div>`;
    chat.appendChild(l);
}
function removeLoading() { if($('loader')) $('loader').remove(); }
function clearCurrentChat() { chat.innerHTML = ''; chat.appendChild(welcomeMsg); welcomeMsg.style.display='block'; currentChatId = null; }
function clearAllHistory() { if(confirm("Clear all history?")) { localStorage.removeItem('esamz_v7_history'); location.reload(); } }
function copyCode(btn) { 
    const code = btn.closest('.code-wrapper').querySelector('code').innerText;
    navigator.clipboard.writeText(code); btn.innerText = "Done!";
    setTimeout(() => btn.innerText = "Copy", 2000);
}
function exportChat() {
    const blob = new Blob([chat.innerText], {type:'text/plain'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'esamz-chat.txt'; a.click();
}

window.onload = renderHistory;
input.addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }});
</script>
</body>
</html>
