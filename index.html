  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fa;
      color: #0f172a;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .header {
      height: 56px;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .header-title {
      font-weight: 600;
      font-size: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 6px rgba(34,197,94,0.25);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background: #f8fafc;
    }

    .welcome {
      background: #eff6ff;
      border: 1px solid #dbeafe;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      color: #1e3a8a;
    }

    .message {
      display: flex;
      margin-bottom: 12px;
    }

    .message.user { justify-content: flex-end; }
    .message.ai { justify-content: flex-start; }

    .bubble {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 6px;
    }

    .ai .bubble {
      background: white;
      border: 1px solid #e5e7eb;
      border-bottom-left-radius: 6px;
    }

    .input-bar {
      padding: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .input-wrap {
      display: flex;
      gap: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      background: #f9fafb;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
      background: white;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
<div class="app">
  <div class="header">
    <div class="header-title">eSAMz v7</div>
    <div class="status"><div class="dot"></div>Online</div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome">
      Ask anything. Clarity first. Practical answers.
    </div>
  </div>

  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="input" placeholder="Type your message..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function add(text, who) {
    const m = document.createElement("div");
    m.className = "message " + who;
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    m.appendChild(b);
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text) return;
    add(text, "user");
    input.value = "";
    send.disabled = true;

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const j = await r.json();
      add(j.reply || "No response.", "ai");
    } catch {
      add("Error connecting to AI.", "ai");
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  send.onclick = sendMsg;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });
</script>
</body>
