<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>eSAMz v7 - AI Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- OFFICIAL eSAMz SCHEMA -->
  <script type="application/ld+json">
  {

    "@graph": [
      {
        "@type": "Organization",
        "name": "eSAMz",

        "url": "https://esamz.info",
        "logo": "https://esamz.info/logo.png",
        "founder": {
          "@type": "Person",
          "name": "Alakmar Teenwala",
          "sameAs": [
            "https://www.instagram.com/esamz_ai",
            "https://www.youtube.com/@esamzai"
          ]
        },
        "description": "eSAMz is a Strategic Artificial Mind engineered for clarity, warmth, and human-aligned intelligence.",
        "foundingDate": "2025-10-21",
        "sameAs": [
          "https://esamz.info",
          "https://esamz.info/docs",
          "https://www.instagram.com/esamz_ai",
          "https://www.youtube.com/@esamzai",
          "https://esamz.site"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "esamzai365@gmail.com",
          "contactType": "Customer Support"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock",

        }

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: #0a0a0a; color: #e5e5e5; }
    .app { height: 100vh; display: flex; background: #0a0a0a; }
    .sidebar { width: 280px; background: #111; border-right: 1px solid #222; display: flex; flex-direction: column; transition: width 0.3s ease, transform 0.3s ease; position: relative; }
    .sidebar.collapsed { width: 0; border-right: none; }
    .collapse-btn { position: absolute; right: -12px; top: 50%; transform: translateY(-50%); width: 24px; height: 48px; background: #667eea; border: none; border-radius: 0 8px 8px 0; color: white; cursor: pointer; }
    .main { flex: 1; display: flex; flex-direction: column; background: #000; }
    .chat { flex: 1; overflow-y: auto; padding: 24px; }
    .welcome { background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%); border: 1px solid #667eea30; padding: 20px; border-radius: 12px; margin-bottom: 24px; text-align: center; }
    .message { display: flex; margin-bottom: 16px; }
    .message.user { justify-content: flex-end; }
    .message.ai { justify-content: flex-start; }
    .bubble { max-width: 70%; padding: 14px 18px; border-radius: 16px; font-size: 14px; white-space: pre-wrap; }
    .user .bubble { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
    .ai .bubble { background: #111; border: 1px solid #222; color: #e5e5e5; }
    .input-bar { padding: 20px 24px; background: #111; border-top: 1px solid #222; }
    .input-wrap { display: flex; gap: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 8px; }
    textarea { flex: 1; resize: none; background: transparent; border: none; color: #e5e5e5; outline: none; }
    .send-btn { padding: 10px 20px; border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; cursor: pointer; }
  </style>
</head>

<body>
<div class="app">

  <main class="main">
    <div class="chat" id="chat">
      <div class="welcome">
        <h2>Welcome to eSAMz v7</h2>
        <p>Ask anything. Clarity first. Practical answers with strategic nuance. now go further and dive into it</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
        <button class="send-btn" id="send">Send ➤</button>
      </div>
    </div>
  </main>

</div>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function add(text, who) {
    const m = document.createElement("div");
    m.className = "message " + who;
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    m.appendChild(b);
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMsg() {
    const text = input.value.trim();
    if (!text) return;

    add(text, "user");
    input.value = "";

    try {
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const j = await r.json();
      add(j.reply || "No response.", "ai");
    } catch {
      add("Error connecting to AI. Please try again.", "ai");
    }
  }

  send.onclick = sendMsg;
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });
</script>

</body>
</html>
