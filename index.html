<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5}
.app{display:flex;height:100vh;position:relative;overflow:hidden}

.app::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 20% 50%, rgba(102,126,234,0.08) 0%, transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(118,75,162,0.08) 0%, transparent 50%);
  animation:gradient 20s ease infinite;
  pointer-events:none;
  z-index:0;
}

@keyframes gradient{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%{transform:translate(5%,5%) rotate(120deg)}
  66%{transform:translate(-5%,10%) rotate(240deg)}
}

.sidebar{
  width:320px;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:10;
  box-shadow:2px 0 24px rgba(0,0,0,0.4);
  transition:transform 0.3s ease;
}

.sidebar.collapsed{
  transform:translateX(-320px);
}

.sidebar-toggle{
  position:absolute;
  right:-40px;
  top:20px;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:0 8px 8px 0;
  padding:12px 10px;
  cursor:pointer;
  color:#999;
  font-size:18px;
  transition:all 0.3s ease;
  z-index:11;
}

.sidebar.collapsed .sidebar-toggle{
  right:auto;
  left:100%;
}

.sidebar-toggle:hover{
  background:rgba(102,126,234,0.3);
  color:#667eea;
  transform:scale(1.05);
}

.menu-toggle{
  position:fixed;
  top:20px;
  left:20px;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
  padding:12px 14px;
  cursor:pointer;
  color:#999;
  font-size:18px;
  transition:all 0.3s ease;
  z-index:5;
  display:none;
}

.sidebar.collapsed ~ .main .menu-toggle{
  display:block;
}

.menu-toggle:hover{
  background:rgba(102,126,234,0.3);
  color:#667eea;
}

.sidebar-header{
  padding:24px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}

.logo{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:16px;
  animation:slideDown 0.6s ease;
}

@keyframes slideDown{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
  box-shadow:0 8px 24px rgba(102,126,234,0.3);
  position:relative;
  overflow:hidden;
}

.logo-icon::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:linear-gradient(45deg,transparent,rgba(255,255,255,0.15),transparent);
  transform:rotate(45deg);
  animation:shine 3s infinite;
}

@keyframes shine{
  0%{transform:translateX(-100%) translateY(-100%) rotate(45deg)}
  100%{transform:translateX(100%) translateY(100%) rotate(45deg)}
}

.logo-text{
  display:flex;
  flex-direction:column;
}

.logo-title{
  font-size:18px;
  font-weight:700;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.logo-subtitle{
  font-size:11px;
  color:#999;
  font-weight:500;
}

.new-chat-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
  transition:all 0.3s ease;
  box-shadow:0 4px 16px rgba(102,126,234,0.3);
  position:relative;
  overflow:hidden;
}

.new-chat-btn::before{
  content:'';
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  transition:left 0.5s ease;
}

.new-chat-btn:hover::before{
  left:100%;
}

.new-chat-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 24px rgba(102,126,234,0.5);
}

.new-chat-btn:active{
  transform:translateY(0);
}

.chat-history{
  flex:1;
  overflow-y:auto;
  padding:16px;
}

.chat-history::-webkit-scrollbar{
  width:6px;
}

.chat-history::-webkit-scrollbar-track{
  background:transparent;
}

.chat-history::-webkit-scrollbar-thumb{
  background:rgba(102,126,234,0.3);
  border-radius:3px;
}

.history-section{
  margin-bottom:24px;
}

.history-label{
  font-size:11px;
  font-weight:700;
  color:#666;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:8px;
  padding:0 8px;
}

.history-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  margin-bottom:4px;
  border-radius:10px;
  cursor:pointer;
  transition:all 0.3s ease;
  position:relative;
  overflow:hidden;
}

.history-item::before{
  content:'';
  position:absolute;
  left:0;
  top:0;
  width:3px;
  height:0;
  background:linear-gradient(135deg,#667eea,#764ba2);
  transition:height 0.3s ease;
}

.history-item:hover{
  background:rgba(102,126,234,0.1);
  transform:translateX(4px);
}

.history-item:hover::before{
  height:100%;
}

.history-item.active{
  background:rgba(102,126,234,0.15);
  border:1px solid rgba(102,126,234,0.3);
}

.history-icon{
  font-size:16px;
  opacity:0.8;
}

.history-content{
  flex:1;
  min-width:0;
}

.history-title{
  font-size:14px;
  font-weight:600;
  color:#e5e5e5;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history-time{
  font-size:11px;
  color:#999;
  margin-top:2px;
}

.history-delete{
  opacity:0;
  background:none;
  border:none;
  color:#999;
  font-size:16px;
  padding:6px;
  cursor:pointer;
  border-radius:6px;
  transition:all 0.2s ease;
}

.history-item:hover .history-delete{
  opacity:1;
}

.history-delete:hover{
  background:rgba(239,68,68,0.2);
  color:#ef4444;
}

.sidebar-links{
  padding:16px;
  border-top:1px solid rgba(255,255,255,0.06);
}

.sidebar-links a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  color:#999;
  text-decoration:none;
  border-radius:8px;
  transition:all 0.3s ease;
  margin-bottom:4px;
  font-size:13px;
  font-weight:500;
}

.sidebar-links a:hover{
  background:rgba(102,126,234,0.1);
  color:#fff;
  transform:translateX(4px);
}

.sidebar-footer{
  padding:16px;
  font-size:11px;
  color:#666;
  border-top:1px solid rgba(255,255,255,0.06);
  text-align:center;
  line-height:1.6;
  background:rgba(0,0,0,0.2);
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}

.header{
  height:70px;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 32px;
  box-shadow:0 2px 16px rgba(0,0,0,0.2);
}

.header-title{
  font-size:18px;
  font-weight:600;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-btn{
  background:rgba(102,126,234,0.1);
  border:1px solid rgba(102,126,234,0.2);
  border-radius:8px;
  padding:8px 16px;
  color:#999;
  cursor:pointer;
  font-size:13px;
  font-weight:500;
  transition:all 0.3s ease;
}

.header-btn:hover{
  background:rgba(102,126,234,0.2);
  color:#667eea;
  transform:translateY(-2px);
}

.chat{
  flex:1;
  padding:32px;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:8px;
}

.chat::-webkit-scrollbar-track{
  background:transparent;
}

.chat::-webkit-scrollbar-thumb{
  background:rgba(102,126,234,0.3);
  border-radius:4px;
}

.chat::-webkit-scrollbar-thumb:hover{
  background:rgba(102,126,234,0.5);
}

.welcome{
  padding:64px 32px;
  margin-bottom:24px;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(102,126,234,0.15),rgba(118,75,162,0.15));
  text-align:center;
  border:1px solid rgba(102,126,234,0.2);
  backdrop-filter:blur(10px);
  animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.welcome h2{
  font-size:36px;
  margin-bottom:12px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-weight:700;
}

.welcome p{
  font-size:16px;
  color:#999;
  font-weight:500;
  margin-bottom:24px;
}

.welcome-features{
  display:flex;
  gap:16px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:24px;
}

.feature-card{
  background:rgba(17,17,17,0.6);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;
  padding:16px 20px;
  min-width:140px;
  transition:all 0.3s ease;
}

.feature-card:hover{
  background:rgba(102,126,234,0.1);
  border-color:rgba(102,126,234,0.3);
  transform:translateY(-4px);
}

.feature-icon{
  font-size:24px;
  margin-bottom:8px;
}

.feature-text{
  font-size:13px;
  color:#999;
  font-weight:500;
}

.message{
  display:flex;
  margin-bottom:24px;
  animation:slideUp 0.4s ease;
  gap:12px;
}

@keyframes slideUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}

.message-avatar{
  width:36px;
  height:36px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.message.user .message-avatar{
  background:linear-gradient(135deg,#667eea,#764ba2);
  order:2;
}

.message.ai .message-avatar{
  background:rgba(17,17,17,0.9);
  border:1px solid rgba(255,255,255,0.1);
}

.bubble{
  max-width:70%;
  padding:16px 20px;
  border-radius:18px;
  white-space:pre-wrap;
  font-size:15px;
  line-height:1.6;
  position:relative;
  box-shadow:0 2px 12px rgba(0,0,0,0.15);
}

.user .bubble{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  border-bottom-right-radius:4px;
}

.ai .bubble{
  background:rgba(17,17,17,0.9);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  border-bottom-left-radius:4px;
}

.ai-tools{
  display:flex;
  gap:12px;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,0.06);
}

.ai-tools button{
  background:rgba(102,126,234,0.1);
  border:1px solid rgba(102,126,234,0.2);
  border-radius:6px;
  padding:6px 12px;
  color:#999;
  cursor:pointer;
  font-size:12px;
  font-weight:500;
  transition:all 0.2s ease;
}

.ai-tools button:hover{
  background:rgba(102,126,234,0.2);
  color:#667eea;
  transform:scale(1.05);
}

.input-bar{
  padding:24px 32px;
  background:rgba(17,17,17,0.9);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.06);
}

.input-wrap{
  display:flex;
  gap:12px;
  background:rgba(26,26,26,0.8);
  border-radius:16px;
  padding:12px 16px;
  border:1px solid rgba(255,255,255,0.08);
  transition:all 0.3s ease;
  align-items:flex-end;
}

.input-wrap:focus-within{
  border-color:rgba(102,126,234,0.5);
  box-shadow:0 0 0 3px rgba(102,126,234,0.1);
}

textarea{
  flex:1;
  background:none;
  border:none;
  color:#e5e5e5;
  resize:none;
  outline:none;
  font-size:15px;
  font-family:inherit;
  line-height:1.5;
  max-height:150px;
}

textarea::placeholder{
  color:#666;
}

.file-btn, .voice-btn{
  background:none;
  border:none;
  color:#999;
  font-size:20px;
  padding:6px 8px;
  border-radius:8px;
  transition:all 0.3s ease;
  cursor:pointer;
}

.file-btn:hover, .voice-btn:hover{
  background:rgba(102,126,234,0.15);
  color:#667eea;
  transform:scale(1.1);
}

.voice-btn.recording{
  color:#ef4444;
  animation:recordPulse 1s ease infinite;
}

@keyframes recordPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.15)}
}

.send-btn{
  background:linear-gradient(135deg,#667eea,#764ba2);
  border:none;
  border-radius:12px;
  color:white;
  padding:10px 24px;
  font-weight:600;
  font-size:14px;
  transition:all 0.3s ease;
  box-shadow:0 4px 12px rgba(102,126,234,0.3);
  cursor:pointer;
}

.send-btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(102,126,234,0.5);
}

.send-btn:active:not(:disabled){
  transform:translateY(0);
}

.send-btn:disabled{
  opacity:0.5;
  cursor:not-allowed;
}

.file-preview{
  margin-bottom:12px;
  display:none;
}

.file-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  background:rgba(102,126,234,0.15);
  border:1px solid rgba(102,126,234,0.3);
  border-radius:12px;
  color:#e5e5e5;
  animation:slideUp 0.3s ease;
}

.file-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  color:white;
  box-shadow:0 2px 8px rgba(102,126,234,0.3);
}

.file-info{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.file-name{
  font-weight:600;
  font-size:14px;
  max-width:250px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.file-type{
  font-size:11px;
  color:#999;
}

.file-remove{
  background:none;
  border:none;
  color:#999;
  font-size:18px;
  padding:6px;
  margin-left:8px;
  cursor:pointer;
  border-radius:6px;
  transition:all 0.2s ease;
}

.file-remove:hover{
  background:rgba(239,68,68,0.2);
  color:#ef4444;
}

.approval-popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0);
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  padding:20px 32px;
  border-radius:16px;
  font-size:15px;
  font-weight:600;
  box-shadow:0 12px 48px rgba(102,126,234,0.5);
  z-index:1000;
  opacity:0;
  transition:all 0.3s ease;
  display:flex;
  align-items:center;
  gap:12px;
}

.approval-popup.show{
  transform:translate(-50%, -50%) scale(1);
  opacity:1;
}

.approval-popup .icon{
  font-size:24px;
  animation:popIn 0.4s ease;
}

@keyframes popIn{
  0%{transform:scale(0) rotate(0deg)}
  50%{transform:scale(1.2) rotate(10deg)}
  100%{transform:scale(1) rotate(0deg)}
}

.clear-history-btn{
  width:100%;
  padding:10px;
  margin-top:8px;
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.2);
  border-radius:8px;
  color:#ef4444;
  cursor:pointer;
  font-size:12px;
  font-weight:600;
  transition:all 0.3s ease;
}

.clear-history-btn:hover{
  background:rgba(239,68,68,0.2);
  transform:translateY(-2px);
}

@media(max-width:768px){
  .sidebar{width:280px}
  .chat{padding:20px}
  .input-bar{padding:16px}
  .bubble{max-width:85%}
  .welcome{padding:40px 20px}
  .welcome-features{flex-direction:column;align-items:center}
  .feature-card{width:100%;max-width:200px}
  .header-actions{display:none}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">e</div>
      <div class="logo-text">
        <div class="logo-title">eSAMz v7</div>
        <div class="logo-subtitle">AI Assistant</div>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
  </div>

  <div class="chat-history" id="chatHistory"></div>

  <div class="sidebar-links">
    <a href="https://esamz.info" target="_blank">🏠 Home</a>
    <a href="https://esamz.info/docs" target="_blank">📚 Docs</a>
    <a href="https://esamz.info/aboutus" target="_blank">ℹ️ About</a>
    <a href="https://esamz.info/privacypolicy" target="_blank">🔒 Privacy</a>
    <button class="clear-history-btn" onclick="clearAllHistory()">🗑️ Clear All History</button>
  </div>

  <div class="sidebar-footer">
    © 2025 eSAMz<br>Created by Alakmar Teenwala
  </div>
</aside>

<main class="main">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  
  <div class="header">
    <div class="header-title">eSAMz AI Assistant</div>
    <div class="header-actions">
      <button class="header-btn" onclick="exportChat()">📥 Export</button>
      <button class="header-btn" onclick="clearCurrentChat()">🗑️ Clear</button>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcomeMsg">
      <h2>Welcome to eSAMz v7</h2>
      <p>Your intelligent AI companion for meaningful conversations</p>
      <div class="welcome-features">
        <div class="feature-card">
          <div class="feature-icon">💬</div>
          <div class="feature-text">Natural Conversations</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">💾</div>
          <div class="feature-text">Chat History</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎤</div>
          <div class="feature-text">Voice Input</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📎</div>
          <div class="feature-text">File Support</div>
        </div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="file-preview" id="filePreview"></div>
    <div class="input-wrap">
      <input type="file" id="fileInput" style="display:none" accept=".txt,.pdf,.doc,.docx">
      <button class="file-btn" onclick="fileInput.click()">📎</button>
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
      <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
      <button class="send-btn" id="send">Send</button>
    </div>
  </div>
</main>

</div>

<div class="approval-popup" id="approvalPopup">
  <span class="icon" id="popupIcon"></span>
  <span id="popupText"></span>
</div>

<script>
const chat = document.getElementById("chat")
const input = document.getElementById("input")
const send = document.getElementById("send")
const fileInput = document.getElementById("fileInput")
const filePreview = document.getElementById("filePreview")
const voiceBtn = document.getElementById("voiceBtn")
const sidebar = document.getElementById("sidebar")
const chatHistory = document.getElementById("chatHistory")

let uploadedFile = null
let uploadedText = ""
let conversationHistory = []
let recognition = null
let isRecording = false
let currentChatId = null
let allChats = {}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  loadChatsFromStorage()
  renderChatHistory()
  autoResizeTextarea()
})

// Auto-resize textarea
input.addEventListener('input', autoResizeTextarea)

function autoResizeTextarea() {
  input.style.height = 'auto'
  input.style.height = Math.min(input.scrollHeight, 150) + 'px'
}

// Storage Functions
function saveChatsToStorage() {
  try {
    localStorage.setItem('esamz_chats', JSON.stringify(allChats))
    localStorage.setItem('esamz_current_chat', currentChatId)
  } catch (e) {
    console.error('Storage error:', e)
  }
}

function loadChatsFromStorage() {
  try {
    const stored = localStorage.getItem('esamz_chats')
    const storedCurrent = localStorage.getItem('esamz_current_chat')
    
    if (stored) {
      allChats = JSON.parse(stored)
    }
    
    if (storedCurrent && allChats[storedCurrent]) {
      currentChatId = storedCurrent
      loadChat(currentChatId)
    }
  } catch (e) {
    console.error('Load error:', e)
    allChats = {}
  }
}

// Chat History UI
function renderChatHistory() {
  const chatArray = Object.entries(allChats).sort((a, b) => b[1].timestamp - a[1].timestamp)
  
  if (chatArray.length === 0) {
    chatHistory.innerHTML = '<div style="padding:20px;text-align:center;color:#666;font-size:13px;">No chat history yet</div>'
    return
  }
  
  const today = []
  const yesterday = []
  const older = []
  
  const now = Date.now()
  const oneDay = 24 * 60 * 60 * 1000
  
  chatArray.forEach(([id, chat]) => {
    const age = now - chat.timestamp
    if (age < oneDay) {
      today.push([id, chat])
    } else if (age < 2 * oneDay) {
      yesterday.push([id, chat])
    } else {
      older.push([id, chat])
    }
  })
  
  let html = ''
  
  if (today.length > 0) {
    html += '<div class="history-section"><div class="history-label">Today</div>'
    today.forEach(([id, chat]) => {
      html += renderHistoryItem(id, chat)
    })
    html += '</div>'
  }
  
  if (yesterday.length > 0) {
    html += '<div class="history-section"><div class="history-label">Yesterday</div>'
    yesterday.forEach(([id, chat]) => {
      html += renderHistoryItem(id, chat)
    })
    html += '</div>'
  }
  
  if (older.length > 0) {
    html += '<div class="history-section"><div class="history-label">Older</div>'
    older.forEach(([id, chat]) => {
      html += renderHistoryItem(id, chat)
    })
    html += '</div>'
  }
  
  chatHistory.innerHTML = html
}

function renderHistoryItem(id, chat) {
  const isActive = id === currentChatId ? 'active' : ''
  const title = chat.title || 'New conversation'
  const time = formatTime(chat.timestamp)
  
  return `
    <div class="history-item ${isActive}" onclick="loadChat('${id}')">
      <div class="history-icon">💬</div>
      <div class="history-content">
        <div class="history-title">${title}</div>
        <div class="history-time">${time}</div>
      </div>
      <button class="history-delete" onclick="event.stopPropagation(); deleteChat('${id}')">🗑️</button>
    </div>
  `
}

function formatTime(timestamp) {
  const date = new Date(timestamp)
  const now = new Date()
  
  if (date.toDateString() === now.toDateString()) {
    return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
  }
  
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
}

// Chat Management
function newChat() {
  currentChatId = 'chat_' + Date.now()
  conversationHistory = []
  
  allChats[currentChatId] = {
    id: currentChatId,
    title: 'New conversation',
    messages: [],
    timestamp: Date.now()
  }
  
  saveChatsToStorage()
  renderChatHistory()
  
  chat.innerHTML = `
    <div class="welcome" id="welcomeMsg">
      <h2>Welcome to eSAMz v7</h2>
      <p>Your intelligent AI companion for meaningful conversations</p>
      <div class="welcome-features">
        <div class="feature-card">
          <div class="feature-icon">💬</div>
          <div class="feature-text">Natural Conversations</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">💾</div>
          <div class="feature-text">Chat History</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎤</div>
          <div class="feature-text">Voice Input</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📎</div>
          <div class="feature-text">File Support</div>
        </div>
      </div>
    </div>`
  
  resetFile()
}

function loadChat(chatId) {
  if (!allChats[chatId]) return
  
  currentChatId = chatId
  const chatData = allChats[chatId]
  conversationHistory = chatData.messages || []
  
  chat.innerHTML = ''
  
  if (conversationHistory.length === 0) {
    chat.innerHTML = `
      <div class="welcome" id="welcomeMsg">
        <h2>Welcome to eSAMz v7</h2>
        <p>Your intelligent AI companion for meaningful conversations</p>
        <div class="welcome-features">
          <div class="feature-card">
            <div class="feature-icon">💬</div>
            <div class="feature-text">Natural Conversations</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">💾</div>
            <div class="feature-text">Chat History</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🎤</div>
            <div class="feature-text">Voice Input</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">📎</div>
            <div class="feature-text">File Support</div>
          </div>
        </div>
      </div>`
  } else {
    conversationHistory.forEach(msg => {
      addMessageToUI(msg.content, msg.role)
    })
  }
  
  saveChatsToStorage()
  renderChatHistory()
}

function deleteChat(chatId) {
  if (!confirm('Delete this conversation?')) return
  
  delete allChats[chatId]
  
  if (currentChatId === chatId) {
    newChat()
  } else {
    saveChatsToStorage()
    renderChatHistory()
  }
  
  showApproval("🗑️", "Chat deleted")
}

function clearCurrentChat() {
  if (!currentChatId || conversationHistory.length === 0) return
  
  if (!confirm('Clear current conversation?')) return
  
  conversationHistory = []
  allChats[currentChatId].messages = []
  allChats[currentChatId].timestamp = Date.now()
  
  saveChatsToStorage()
  loadChat(currentChatId)
  showApproval("✓", "Chat cleared")
}

function clearAllHistory() {
  if (!confirm('Delete all chat history? This cannot be undone.')) return
  
  allChats = {}
  localStorage.removeItem('esamz_chats')
  localStorage.removeItem('esamz_current_chat')
  
  newChat()
  showApproval("🗑️", "All history cleared")
}

function exportChat() {
  if (!currentChatId || conversationHistory.length === 0) {
    showApproval("⚠️", "No messages to export")
    return
  }
  
  const chatData = allChats[currentChatId]
  let content = `eSAMz Chat Export\nTitle: ${chatData.title}\nDate: ${new Date(chatData.timestamp).toLocaleString()}\n\n`
  
  conversationHistory.forEach(msg => {
    content += `${msg.role === 'user' ? 'You' : 'eSAMz'}: ${msg.content}\n\n`
  })
  
  const blob = new Blob([content], { type: 'text/plain' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `esamz-chat-${Date.now()}.txt`
  a.click()
  URL.revokeObjectURL(url)
  
  showApproval("📥", "Chat exported")
}

// Sidebar Toggle
function toggleSidebar() {
  sidebar.classList.toggle("collapsed")
}

// Voice Recognition
function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showApproval("⚠️", "Voice not supported")
    return
  }
  
  if (isRecording) {
    stopRecording()
  } else {
    startRecording()
  }
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
  recognition = new SpeechRecognition()
  recognition.continuous = true
  recognition.interimResults = true
  recognition.lang = 'en-US'
  
  recognition.onstart = () => {
    isRecording = true
    voiceBtn.classList.add("recording")
  }
  
  recognition.onresult = (event) => {
    let transcript = ''
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript
    }
    input.value = transcript
    autoResizeTextarea()
  }
  
  recognition.onerror = (event) => {
    console.error("Voice error:", event.error)
    stopRecording()
  }
  
  recognition.onend = () => {
    stopRecording()
  }
  
  recognition.start()
}

function stopRecording() {
  if (recognition) {
    recognition.stop()
    recognition = null
  }
  isRecording = false
  voiceBtn.classList.remove("recording")
}

// File Handling
fileInput.onchange = async () => {
  const file = fileInput.files[0]
  if (!file) return
  
  uploadedFile = file
  uploadedText = ""
  
  if (file.type === "text/plain") {
    uploadedText = await file.text()
  }
  
  filePreview.style.display = "block"
  filePreview.innerHTML = `
    <div class="file-badge">
      <div class="file-icon">${file.name.split('.').pop().toUpperCase()}</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
        <div class="file-type">${(file.size / 1024).toFixed(1)} KB</div>
      </div>
      <button class="file-remove" onclick="removeFile()">✕</button>
    </div>`
}

function removeFile() {
  uploadedFile = null
  uploadedText = ""
  fileInput.value = ""
  filePreview.style.display = "none"
  filePreview.innerHTML = ""
}

function resetFile() {
  uploadedFile = null
  uploadedText = ""
  fileInput.value = ""
  filePreview.style.display = "none"
  filePreview.innerHTML = ""
}

// Message Functions
function addMessageToUI(text, role) {
  const msg = document.createElement("div")
  msg.className = "message " + role
  
  const avatar = document.createElement("div")
  avatar.className = "message-avatar"
  avatar.textContent = role === "user" ? "👤" : "🤖"
  
  const bubble = document.createElement("div")
  bubble.className = "bubble"
  bubble.textContent = text
  
  if (role === "ai") attachTools(bubble, text)
  
  msg.appendChild(avatar)
  msg.appendChild(bubble)
  chat.appendChild(msg)
  chat.scrollTop = chat.scrollHeight
}

function attachTools(bubble, text) {
  const tools = document.createElement("div")
  tools.className = "ai-tools"
  
  const copyBtn = document.createElement("button")
  copyBtn.textContent = "📋 Copy"
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(text)
    showApproval("✓", "Copied!")
  }
  
  const likeBtn = document.createElement("button")
  likeBtn.textContent = "👍 Like"
  likeBtn.onclick = () => {
    showApproval("👍", "Thanks!")
  }
  
  const dislikeBtn = document.createElement("button")
  dislikeBtn.textContent = "👎 Dislike"
  dislikeBtn.onclick = () => {
    showApproval("👎", "Feedback noted")
  }
  
  tools.append(copyBtn, likeBtn, dislikeBtn)
  bubble.appendChild(tools)
}

// Send Message
async function sendMsg() {
  const text = input.value.trim()
  if (!text && !uploadedFile) return
  
  const welcome = document.getElementById("welcomeMsg")
  if (welcome) welcome.remove()
  
  if (!currentChatId) {
    currentChatId = 'chat_' + Date.now()
    allChats[currentChatId] = {
      id: currentChatId,
      title: text.substring(0, 50),
      messages: [],
      timestamp: Date.now()
    }
  }
  
  let payload = text
  
  addMessageToUI(text || "[File sent]", "user")
  input.value = ""
  autoResizeTextarea()
  resetFile()
  
  const userMsg = { role: "user", content: payload }
  conversationHistory.push(userMsg)
  allChats[currentChatId].messages.push(userMsg)
  allChats[currentChatId].timestamp = Date.now()
  
  if (conversationHistory.length === 1) {
    allChats[currentChatId].title = text.substring(0, 50)
  }
  
  saveChatsToStorage()
  renderChatHistory()
  
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: payload,
        history: conversationHistory
      })
    })
    
    const data = await res.json()
    const reply = data.reply || "No response."
    
    addMessageToUI(reply, "ai")
    
    const aiMsg = { role: "assistant", content: reply }
    conversationHistory.push(aiMsg)
    allChats[currentChatId].messages.push(aiMsg)
    allChats[currentChatId].timestamp = Date.now()
    
    saveChatsToStorage()
    renderChatHistory()
    
  } catch (err) {
    console.error(err)
    addMessageToUI("Error connecting to AI.", "ai")
  }
}

// Approval Popup
function showApproval(icon, text) {
  const popup = document.getElementById("approvalPopup")
  const popupIcon = document.getElementById("popupIcon")
  const popupText = document.getElementById("popupText")
  
  popupIcon.textContent = icon
  popupText.textContent = text
  
  popup.classList.add("show")
  
  setTimeout(() => {
    popup.classList.remove("show")
  }, 2000)
}

// Events
send.onclick = sendMsg

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault()
    sendMsg()
  }
})
</script>
</body>
</html>
