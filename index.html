    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: rgba(59, 130, 246, 0.15);
            --primary-glow: rgba(59, 130, 246, 0.3);
            
            --bg-main: #0a0f1a;
            --bg-secondary: #0d1117;
            --bg-glass: rgba(15, 23, 42, 0.7);
            --bg-glass-hover: rgba(20, 28, 50, 0.8);
            --bg-elevated: rgba(30, 41, 59, 0.6);
            
            --border-glass: rgba(59, 130, 246, 0.15);
            --border-subtle: rgba(148, 163, 184, 0.1);
            
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-tertiary: #64748b;
            
            --success: #10b981;
            --danger: #ef4444;
            
            --sidebar-width: 280px;
            --header-height: 64px;
            
            --radius-sm: 8px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 30px var(--primary-glow);
            
            --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            background: linear-gradient(135deg, #0a0f1a 0%, #1a1f35 100%);
            background-attachment: fixed;
            color: var(--text-primary); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            height: 100vh; 
            overflow: hidden;
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.08), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.06), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* SIDEBAR */
        .sidebar { 
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-right: 1px solid var(--border-glass);
            display: flex; 
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 100;
        }

        .sidebar-header { 
            padding: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 16px;
        }
        
        .logo {
            width: 36px;
            height: 36px;
            position: relative;
            filter: drop-shadow(0 0 12px var(--primary-glow));
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .brand-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .brand-version {
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 500;
        }

        .btn-new { 
            width: 100%; 
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
            color: white; 
            border: none;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer; 
            display: flex; 
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all var(--transition);
            font-family: inherit;
            box-shadow: var(--shadow-md), var(--shadow-glow);
        }

        .btn-new:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg), 0 0 35px var(--primary-glow);
        }

        .btn-new:active {
            transform: scale(0.98);
        }

        .nav-section { 
            flex: 1; 
            overflow-y: auto; 
            padding: 12px;
        }

        .nav-section::-webkit-scrollbar {
            width: 4px;
        }

        .nav-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .nav-section::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 2px;
        }
        
        .nav-label { 
            font-size: 11px; 
            color: var(--text-tertiary); 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            padding: 12px 8px 8px;
            font-weight: 600;
        }

        .nav-item { 
            width: 100%; 
            height: 36px;
            padding: 0 12px;
            background: transparent; 
            border: 1px solid transparent;
            color: var(--text-secondary); 
            border-radius: var(--radius-sm);
            cursor: pointer; 
            text-align: left; 
            margin-bottom: 4px;
            transition: all var(--transition);
            display: flex; 
            align-items: center; 
            gap: 10px;
            font-size: 13px;
            font-family: inherit;
            text-decoration: none;
            position: relative;
        }

        .nav-item:hover {
            background: var(--bg-glass-hover);
            color: var(--text-primary);
            border-color: var(--border-glass);
            transform: translateX(2px);
        }

        .nav-item:active {
            transform: scale(0.98);
        }

        .nav-item .icon {
            font-size: 16px;
            opacity: 0.7;
        }

        .nav-item-delete {
            margin-left: auto;
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            opacity: 0;
            transition: opacity var(--transition);
            font-size: 16px;
            padding: 4px;
            border-radius: var(--radius-sm);
        }

        .nav-item:hover .nav-item-delete {
            opacity: 1;
        }

        .nav-item-delete:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        .sidebar-footer { 
            padding: 16px;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 11px;
            color: var(--text-tertiary);
        }

        /* MAIN CONTENT */
        .main-content { 
            position: relative; 
            display: flex; 
            flex-direction: column;
            height: 100vh;
            background: transparent;
        }

        header { 
            height: var(--header-height);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-subtle);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-indicator { 
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 6px 12px;
            background: var(--bg-elevated);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid var(--border-glass);
        }

        .status-dot { 
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn-secondary { 
            background: transparent;
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all var(--transition);
            font-family: inherit;
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            background: var(--primary-light);
            color: var(--text-primary);
        }

        /* CHAT AREA */
        .chat-container { 
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-glass);
            border-radius: 3px;
        }

        /* WELCOME SCREEN */
        .welcome { 
            max-width: 800px;
            margin: 60px auto 0;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            position: relative;
            filter: drop-shadow(0 0 20px var(--primary-glow));
        }

        .welcome-logo svg {
            width: 100%;
            height: 100%;
        }

        .welcome h1 { 
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .welcome p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 48px;
        }

        .suggestions { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .suggestion-card { 
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            padding: 20px;
            border-radius: var(--radius-lg);
            text-align: left;
            cursor: pointer;
            transition: all var(--transition);
        }

        .suggestion-card:hover {
            border-color: var(--primary);
            background: var(--bg-glass-hover);
            transform: translateY(-4px);
            box-shadow: var(--shadow-md), 0 0 20px var(--primary-glow);
        }

        .suggestion-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .suggestion-card p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* MESSAGES */
        .message { 
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            max-width: 900px;
            opacity: 0;
            animation: slideUp 0.4s forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message-avatar { 
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: var(--radius-md);
            display: grid;
            place-items: center;
            font-size: 14px;
            font-weight: 600;
            background: var(--bg-elevated);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
            border: none;
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .message-content { 
            flex: 1;
            min-width: 0;
        }

        .message-bubble { 
            padding: 16px 18px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            line-height: 1.7;
            word-wrap: break-word;
        }

        .message.user .message-bubble { 
            background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
            color: white;
            box-shadow: var(--shadow-md), 0 0 20px var(--primary-glow);
        }

        .message.ai .message-bubble { 
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
        }

        .message-bubble pre {
            background: rgba(0, 0, 0, 0.4) !important;
            padding: 16px;
            border-radius: var(--radius-md);
            overflow-x: auto;
            border: 1px solid var(--border-glass);
            margin: 12px 0;
        }

        .message-bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }

        .message-actions { 
            display: flex;
            gap: 8px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity var(--transition);
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .action-btn {
            background: var(--bg-elevated);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all var(--transition);
            font-family: inherit;
        }

        .action-btn:hover {
            color: var(--text-primary);
            border-color: var(--primary);
            background: var(--primary-light);
        }

        /* INPUT AREA */
        .input-container { 
            padding: 20px 24px 24px;
            background: transparent;
        }

        .input-wrapper { 
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 12px;
            transition: all var(--transition);
            box-shadow: var(--shadow-md);
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: var(--shadow-lg), 0 0 30px var(--primary-glow);
        }
        
        .file-preview {
            display: flex;
            gap: 8px;
            padding: 0 4px 8px;
            flex-wrap: wrap;
        }

        .file-chip { 
            background: var(--bg-elevated);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .file-chip button {
            background: none;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            line-height: 1;
            transition: color var(--transition);
        }

        .file-chip button:hover {
            color: var(--danger);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        
        .input-btn { 
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 18px;
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .input-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .input-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, #6366f1 100%);
            color: white;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .input-btn.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .input-btn.recording {
            color: var(--danger);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            50% { opacity: 0.5; }
        }

        textarea { 
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            padding: 8px 4px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            max-height: 200px;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--text-tertiary);
        }

        /* MODAL */
        dialog { 
            background: var(--bg-glass);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            color: var(--text-primary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-xl);
            padding: 0;
            max-width: 440px;
            width: 90%;
            box-shadow: var(--shadow-lg);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 24px 20px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-body {
            padding: 20px 24px 24px;
        }

        .export-option { 
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 8px;
            text-align: left;
            background: var(--bg-elevated);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            font-size: 14px;
        }

        .export-option:hover {
            border-color: var(--primary);
            background: var(--bg-glass-hover);
            transform: translateX(4px);
        }

        .export-icon {
            font-size: 20px;
            opacity: 0.7;
        }

        /* MOBILE */
        .mobile-toggle,
        .mobile-close,
        .overlay {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                grid-template-columns: 1fr;
            }

            .sidebar { 
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                width: 280px;
                transform: translateX(-100%);
                transition: transform 0.3s;
                box-shadow: none;
                z-index: 200;
            }

            .sidebar.active {
                transform: translateX(0);
                box-shadow: 20px 0 50px rgba(0, 0, 0, 0.7);
            }
            
            .overlay { 
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(4px);
                z-index: 150;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s;
            }

            .overlay.active {
                opacity: 1;
                pointer-events: auto;
            }

            .mobile-toggle {
                display: block;
                background: none;
                border: none;
                color: var(--text-primary);
                font-size: 20px;
                cursor: pointer;
                padding: 8px;
            }

            .mobile-close {
                display: block;
                position: absolute;
                top: 20px;
                right: 20px;
                background: none;
                border: none;
                color: var(--text-secondary);
                font-size: 24px;
                cursor: pointer;
                z-index: 10;
            }

            .chat-container {
                padding: 16px;
            }

            .message {
                max-width: 100%;
            }

            .welcome {
                margin-top: 40px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            header {
                padding: 0 16px;
            }

            .input-container {
                padding: 16px;
            }

            .welcome-logo {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }

            .welcome h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
        <button class="mobile-close" id="closeSidebar">×</button>
        <div class="sidebar-header">
            <div class="brand">
                <div class="logo">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <ellipse cx="85" cy="90" rx="45" ry="60" fill="url(#grad1)" opacity="0.8"/>
                        <ellipse cx="115" cy="110" rx="45" ry="60" fill="url(#grad1)" opacity="0.6"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <div class="brand-name">eSAMz AI</div>
                    <div class="brand-version">Version 8.0</div>
                </div>
            </div>
            <button class="btn-new" id="btnNewChat">
                <span>+</span> New Conversation
            </button>
        </div>
        
        <div class="nav-section">
            <div class="nav-label">Recent Conversations</div>
            <div id="historyList"></div>

            <div class="nav-label">Settings</div>
            <button class="nav-item" id="btnExportModal">
                <span class="icon">↓</span> Export Data
            </button>
            <button class="nav-item" id="btnClearCache">
                <span class="icon">×</span> Clear History
            </button>
            <a href="https://esamz.info" target="_blank" class="nav-item">
                <span class="icon">↗</span> Documentation
            </a>
            <a href="https://forms.gle/HUrbqLp3YFdHUxyd8" target="_blank" class="nav-item">
                <span class="icon">✎</span> Send Feedback
            </a>
        </div>
        
        <div class="sidebar-footer">
            © 2025 eSAMz AI · All rights reserved
            <div style="margin-top: 12px; display: flex; justify-content: center;">
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7184475263017731"
                     crossorigin="anonymous"></script>
                <!-- ad1 -->
                <ins class="adsbygoogle"
                     style="display:inline-block;width:320px;height:50px"
                     data-ad-client="ca-pub-7184475263017731"
                     data-ad-slot="4565510438"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <div class="header-left">
                <button class="mobile-toggle" id="openSidebar">☰</button>
                <div class="status-indicator">
                    <span class="status-dot"></span> Connected
                </div>
            </div>
            <button class="btn-secondary" id="btnClearChat">Clear Chat</button>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-logo">
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <ellipse cx="85" cy="90" rx="45" ry="60" fill="url(#heroGrad)" opacity="0.8"/>
                        <ellipse cx="115" cy="110" rx="45" ry="60" fill="url(#heroGrad)" opacity="0.6"/>
                    </svg>
                </div>
                <h1>Welcome to eSAMz AI</h1>
                <p>Start a conversation or choose a suggestion below</p>
                <div class="suggestions">
                    <button class="suggestion-card" onclick="app.fillInput('Design a scalable database schema for a SaaS application')">
                        <h3>Database Architecture</h3>
                        <p>Design scalable database schemas and system architectures</p>
                    </button>
                    <button class="suggestion-card" onclick="app.fillInput('Explain quantum computing concepts')">
                        <h3>Technical Explanations</h3>
                        <p>Get clear explanations of complex technical concepts</p>
                    </button>
                    <button class="suggestion-card" onclick="app.fillInput('Write a creative story about artificial intelligence')">
                        <h3>Creative Writing</h3>
                        <p>Generate creative content and compelling narratives</p>
                    </button>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper" id="inputWrapper">
                <div class="file-preview" id="filePreview"></div>
                <div class="input-row">
                    <button class="input-btn" id="btnUpload" title="Upload files">📎</button>
                    <input type="file" id="fileInput" hidden multiple>
                    <button class="input-btn" id="btnVoice" title="Voice input">🎤</button>
                    <textarea id="userInput" rows="1" placeholder="Type your message..."></textarea>
                    <button class="input-btn primary" id="btnSend">→</button>
                </div>
            </div>
        </div>
    </main>

    <dialog id="exportDialog">
        <div class="modal-header">
            <h3>Export Conversation</h3>
            <button class="btn-secondary" style="border:none; padding:8px;" id="closeDialog">×</button>
        </div>
        <div class="modal-body">
            <button class="export-option" onclick="app.exportChat('txt')">
                <span class="export-icon">📄</span>
                <span>Plain Text (.txt)</span>
            </button>
            <button class="export-option" onclick="app.exportChat('md')">
                <span class="export-icon">📝</span>
                <span>Markdown (.md)</span>
            </button>
            <button class="export-option" onclick="app.exportChat('html')">
                <span class="export-icon">🌐</span>
                <span>HTML Document</span>
            </button>
        </div>
    </dialog>

    <script>
class App {
    constructor() {
        this.dom = {
            chat: document.getElementById('chatContainer'),
            input: document.getElementById('userInput'),
            welcome: document.getElementById('welcomeScreen'),
            history: document.getElementById('historyList'),
            preview: document.getElementById('filePreview'),
            sidebar: document.getElementById('sidebar'),
            overlay: document.getElementById('overlay'),
            wrapper: document.getElementById('inputWrapper'),
            dialog: document.getElementById('exportDialog')
        };

        this.state = {
            chatId: null,
            files: [],
            isRecording: false,
            recognition: null
        };

        this.storageKey = 'esamz_conversations_v8';
        this.init();
    }

    init() {
        this.loadHistory();
        this.setupEvents();
        this.setupDragDrop();
        this.dom.input.focus();
    }

    setupEvents() {
        document.getElementById('btnSend').addEventListener('click', () => this.handleSend());
        
        this.dom.input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.handleSend();
            }
        });
        
        this.dom.input.addEventListener('input', () => {
            this.dom.input.style.height = 'auto';
            this.dom.input.style.height = this.dom.input.scrollHeight + 'px';
        });

        document.getElementById('openSidebar').addEventListener('click', () => this.toggleSidebar(true));
        document.getElementById('closeSidebar').addEventListener('click', () => this.toggleSidebar(false));
        this.dom.overlay.addEventListener('click', () => this.toggleSidebar(false));

        document.getElementById('btnNewChat').addEventListener('click', () => this.newChat());
        document.getElementById('btnClearChat').addEventListener('click', () => this.clearChat());
        document.getElementById('btnClearCache').addEventListener('click', () => this.clearAllData());

        document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('fileInput').click());
        document.getElementById('fileInput').addEventListener('change', e => this.handleFiles(e.target.files));

        document.getElementById('btnVoice').addEventListener('click', () => this.toggleVoice());

        document.getElementById('btnExportModal').addEventListener('click', () => this.dom.dialog.showModal());
        document.getElementById('closeDialog').addEventListener('click', () => this.dom.dialog.close());
    }

    setupDragDrop() {
        const wrapper = this.dom.wrapper;
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt =>
            wrapper.addEventListener(evt, e => {
                e.preventDefault();
                e.stopPropagation();
            })
        );
        
        wrapper.addEventListener('dragenter', () => wrapper.style.borderColor = 'var(--primary)');
        wrapper.addEventListener('dragleave', () => wrapper.style.borderColor = 'var(--border-glass)');
        wrapper.addEventListener('drop', e => {
            wrapper.style.borderColor = 'var(--border-glass)';
            this.handleFiles(e.dataTransfer.files);
        });
    }

    async handleFiles(fileList) {
        for (const file of fileList) {
            let text = '';
            if (file.type.startsWith('image/')) {
                text = await this.ocrImage(file);
            } else {
                text = await this.readTextFile(file);
            }
            this.state.files.push({ file, textExtracted: text });
        }
        this.renderFiles();
    }

    readTextFile(file) {
        return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => resolve('(unable to read file)');
            reader.readAsText(file);
        });
    }

    async ocrImage(file) {
        if (!('Tesseract' in window)) {
            try {
                await import('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.esm.min.js');
            } catch {
                return '(OCR library unavailable)';
            }
        }
        try {
            const { data: { text } } = await Tesseract.recognize(file, 'eng');
            return text.trim();
        } catch {
            return '(OCR failed)';
        }
    }

    renderFiles() {
        this.dom.preview.innerHTML = '';
        this.state.files.forEach((item, idx) => {
            const chip = document.createElement('div');
            chip.className = 'file-chip';
            chip.innerHTML = `📎 ${item.file.name} <button onclick="app.removeFile(${idx})">×</button>`;
            this.dom.preview.appendChild(chip);
        });
    }

    removeFile(idx) {
        this.state.files.splice(idx, 1);
        this.renderFiles();
    }

    async handleSend() {
        const text = this.dom.input.value.trim();
        if (!text && this.state.files.length === 0) return;

        if (!this.state.chatId) this.createChatSession(text);

        this.dom.welcome.style.display = 'none';

        let fullMessage = text;
        if (this.state.files.length) {
            fullMessage += '\n\n' + this.state.files.map(f =>
                `**File:** ${f.file.name}\n\`\`\`\n${f.textExtracted}\n\`\`\``
            ).join('\n');
        }

        this.addMessage(fullMessage, 'user');
        this.appendToHistory('user', fullMessage);

        this.dom.input.value = '';
        this.dom.input.style.height = 'auto';
        this.state.files = [];
        this.renderFiles();

        const thinkingId = this.addThinking();

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    files: this.state.files,
                    context: this.getContext()
                })
            });
            
            if (!res.ok) throw new Error('Server error');
            
            const data = await res.json();
            this.removeThinking(thinkingId);
            const reply = data.reply || data.message || 'No response';
            this.addMessage(reply, 'ai');
            this.appendToHistory('ai', reply);
        } catch (e) {
            this.removeThinking(thinkingId);
            const reply = this.generateDemoResponse(text);
            this.addMessage(reply, 'ai');
            this.appendToHistory('ai', reply);
        }
    }

    addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        const avatar = sender === 'user' ? 'U' : 'eS';
        const htmlContent = marked.parse(text);
        
        div.innerHTML = `
            <div class="message-avatar">${avatar}</div>
            <div class="message-content">
                <div class="message-bubble">${htmlContent}</div>
                ${sender === 'ai' ? `<div class="message-actions"><button class="action-btn" onclick="app.copyText(this)">Copy</button></div>` : ''}
            </div>`;
        
        this.dom.chat.appendChild(div);
        this.dom.chat.scrollTop = this.dom.chat.scrollHeight;
        
        if (window.Prism) Prism.highlightAllUnder(div);
    }

    addThinking() {
        const id = 'thinking-' + Date.now();
        const div = document.createElement('div');
        div.className = 'message ai';
        div.id = id;
        div.innerHTML = `
            <div class="message-avatar">eS</div>
            <div class="message-content">
                <div class="message-bubble" style="display:flex; align-items:center; gap:10px;">
                    <span style="color:var(--primary); font-weight:500;">Processing</span>
                    <span class="status-dot"></span>
                </div>
            </div>`;
        
        this.dom.chat.appendChild(div);
        this.dom.chat.scrollTop = this.dom.chat.scrollHeight;
        return id;
    }

    removeThinking(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    generateDemoResponse(text) {
        return `**eSAMz AI (Demo Mode):**\n\nBackend service is currently unavailable. This is a simulated response for: "${text.slice(0, 50)}..."\n\n\`\`\`javascript\nconsole.log("Demo mode - Backend offline");\n\`\`\`\n\nAll features remain functional with local storage.`;
    }

    loadHistory() {
        const raw = localStorage.getItem(this.storageKey);
        const history = raw ? JSON.parse(raw) : [];
        history.forEach(chat => this.renderHistoryItem(chat));
    }

    renderHistoryItem(chat) {
        const btn = document.createElement('button');
        btn.className = 'nav-item';
        btn.innerHTML = `
            <span class="icon">💬</span> 
            ${chat.title}
            <button class="nav-item-delete" onclick="event.stopPropagation(); app.deleteChat('${chat.id}')">×</button>
        `;
        btn.onclick = () => this.loadChat(chat.id);
        this.dom.history.appendChild(btn);
    }

    createChatSession(firstText) {
        this.state.chatId = Date.now().toString();
        const title = firstText.slice(0, 35) + (firstText.length > 35 ? '…' : '');
        const chat = { id: this.state.chatId, title, messages: [] };
        this.saveChat(chat);
        this.renderHistoryItem(chat);
    }

    appendToHistory(role, content) {
        const history = this.getHistory();
        const chat = history.find(c => c.id === this.state.chatId);
        if (chat) {
            chat.messages.push({ role, content, ts: Date.now() });
            this.saveHistory(history);
        }
    }

    loadChat(chatId) {
        const history = this.getHistory();
        const chat = history.find(c => c.id === chatId);
        if (!chat) return;
        
        this.state.chatId = chatId;
        this.dom.chat.innerHTML = '';
        chat.messages.forEach(m => this.addMessage(m.content, m.role));
        this.dom.welcome.style.display = 'none';
        this.toggleSidebar(false);
    }

    deleteChat(chatId) {
        if (!confirm('Delete this conversation?')) return;
        
        let history = this.getHistory();
        history = history.filter(c => c.id !== chatId);
        this.saveHistory(history);
        
        this.dom.history.innerHTML = '';
        history.forEach(c => this.renderHistoryItem(c));
        
        if (this.state.chatId === chatId) this.newChat();
    }

    getContext() {
        const history = this.getHistory();
        const chat = history.find(c => c.id === this.state.chatId);
        if (!chat) return [];
        return chat.messages.slice(-10);
    }

    getHistory() {
        return JSON.parse(localStorage.getItem(this.storageKey) || '[]');
    }

    saveChat(chat) {
        const history = this.getHistory();
        history.unshift(chat);
        this.saveHistory(history);
    }

    saveHistory(history) {
        localStorage.setItem(this.storageKey, JSON.stringify(history));
    }

    toggleSidebar(open) {
        if (open) {
            this.dom.sidebar.classList.add('active');
            this.dom.overlay.classList.add('active');
        } else {
            this.dom.sidebar.classList.remove('active');
            this.dom.overlay.classList.remove('active');
        }
    }

    newChat() {
        this.state.chatId = null;
        this.dom.chat.innerHTML = '';
        this.dom.chat.appendChild(this.dom.welcome);
        this.dom.welcome.style.display = 'block';
        this.toggleSidebar(false);
    }

    clearChat() {
        this.newChat();
    }

    clearAllData() {
        if (confirm('Delete ALL conversation history? This cannot be undone.')) {
            localStorage.clear();
            location.reload();
        }
    }

    fillInput(text) {
        this.dom.input.value = text;
        this.dom.input.focus();
    }

    copyText(btn) {
        const text = btn.closest('.message').querySelector('.message-bubble').innerText;
        navigator.clipboard.writeText(text);
        const orig = btn.innerText;
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = orig, 2000);
    }

    toggleVoice() {
        const btn = document.getElementById('btnVoice');
        
        if (!this.state.recognition) {
            if (!('webkitSpeechRecognition' in window)) {
                return alert('Voice recognition is not supported in your browser');
            }
            
            this.state.recognition = new webkitSpeechRecognition();
            this.state.recognition.lang = 'en-US';
            this.state.recognition.continuous = false;
            
            this.state.recognition.onresult = e => {
                this.dom.input.value += e.results[0][0].transcript;
                this.dom.input.dispatchEvent(new Event('input'));
            };
            
            this.state.recognition.onend = () => {
                this.state.isRecording = false;
                btn.classList.remove('recording');
            };
        }
        
        if (this.state.isRecording) {
            this.state.recognition.stop();
            this.state.isRecording = false;
            btn.classList.remove('recording');
        } else {
            this.state.recognition.start();
            this.state.isRecording = true;
            btn.classList.add('recording');
        }
    }

    exportChat(type) {
        const msgs = Array.from(document.querySelectorAll('.message')).map(el => {
            const who = el.classList.contains('user') ? 'User' : 'eSAMz AI';
            const txt = el.querySelector('.message-bubble').innerText;
            return `[${who}]: ${txt}`;
        }).join('\n\n');
        
        const filename = `esamz-export-${Date.now()}`;
        
        if (type === 'txt') this.download(filename + '.txt', msgs);
        if (type === 'md') this.download(filename + '.md', msgs);
        if (type === 'html') {
            const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>eSAMz Export</title><style>body{font-family:sans-serif;max-width:800px;margin:2rem auto;padding:2rem;background:#0a0f1a;color:#f1f5f9;}pre{background:#000;padding:1rem;border-radius:8px;overflow-x:auto;}</style></head><body><pre>${msgs}</pre></body></html>`;
            this.download(filename + '.html', html);
        }
        
        this.dom.dialog.close();
    }

    download(name, content) {
        const link = document.createElement('a');
        link.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(content);
        link.download = name;
        link.click();
    }
}

const app = new App();
    </script>
</body>
