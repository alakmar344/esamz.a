<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>eSAMz v7 Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 12px;
      margin: 12px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .app-header {
      padding: 14px 18px;
      background: linear-gradient(90deg, #2563eb, #1d4ed8);
      color: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .app-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .app-subtitle {
      font-size: 12px;
      opacity: 0.9;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #22c55e;
      margin-right: 6px;
      box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.35);
    }

    .status-wrap {
      display: flex;
      align-items: center;
      font-size: 12px;
    }

    .chat-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 8px;
      background: #f9fafb;
      overflow-y: auto;
    }

    .placeholder-card {
      margin-bottom: 6px;
      padding: 12px 14px;
      background: #eff6ff;
      border-radius: 10px;
      border: 1px solid #dbeafe;
      font-size: 13px;
      color: #1e3a8a;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .msg-row {
      display: flex;
      width: 100%;
    }

    .msg-row.user {
      justify-content: flex-end;
    }

    .msg-row.ai {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg-user {
      background: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .msg-ai {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
      box-shadow: 0 3px 10px rgba(148, 163, 184, 0.35);
    }

    .msg-meta {
      font-size: 11px;
      color: #6b7280;
      margin-top: 2px;
    }

    .msg-meta.ai {
      margin-left: 4px;
    }

    .msg-meta.user {
      text-align: right;
      margin-right: 4px;
    }

    .typing {
      font-size: 13px;
      color: #4b5563;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: #9ca3af;
      animation: blink 1.1s infinite alternate;
    }

    .dot:nth-child(2) {
      animation-delay: 0.25s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.5s;
    }

    @keyframes blink {
      from { opacity: 0.2; transform: translateY(0); }
      to   { opacity: 1;   transform: translateY(-2px); }
    }

    .input-shell {
      padding: 10px 12px;
      border-top: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 110px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 14px;
      line-height: 1.4;
      background: #f9fafb;
      transition: border 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    textarea:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 1px #2563eb33;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      background: #2563eb;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.12s ease;
      box-shadow: 0 5px 14px rgba(37, 99, 235, 0.45);
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 7px 18px rgba(37, 99, 235, 0.55);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 3px 9px rgba(37, 99, 235, 0.5);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .send-icon {
      margin-left: 6px;
      font-size: 15px;
    }

    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #9ca3af;
      text-align: left;
    }

    @media (max-width: 640px) {
      .app-shell {
        margin: 0;
        border-radius: 0;
      }
      .chat-body {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <header class="app-header">
    <div>
      <div class="app-title">eSAMz v7</div>
      <div class="app-subtitle">Ask anything and get a clear answer</div>
    </div>
    <div class="status-wrap">
      <div class="status-dot"></div>
      <span>Online</span>
    </div>
  </header>

  <main class="chat-body">
    <div class="placeholder-card">
      Try things like:
      <br />• Explain something in very simple language
      <br />• Help me plan my day step by step
      <br />• Break down a topic like you are my close friend
    </div>

    <div class="messages" id="messages"></div>
  </main>

  <section class="input-shell">
    <div class="input-row">
      <textarea id="input" placeholder="Type your message and press Enter..."></textarea>
      <button id="send">
        Send
        <span class="send-icon">➤</span>
      </button>
    </div>
    <div class="hint">
      Enter to send, Shift plus Enter for a new line
    </div>
  </section>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("send");

  function addMessage(text, who) {
    const row = document.createElement("div");
    row.className = "msg-row " + (who === "user" ? "user" : "ai");

    const bubble = document.createElement("div");
    bubble.className = "msg-bubble " + (who === "user" ? "msg-user" : "msg-ai");
    bubble.textContent = text;

    row.appendChild(bubble);
    messagesEl.appendChild(row);

    const meta = document.createElement("div");
    meta.className = "msg-meta " + (who === "user" ? "user" : "ai");
    meta.textContent = who === "user" ? "You" : "eSAMz v7";
    messagesEl.appendChild(meta);

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  let typingRow = null;

  function showTyping() {
    if (typingRow) return;
    typingRow = document.createElement("div");
    typingRow.className = "msg-row ai";
    const bubble = document.createElement("div");
    bubble.className = "msg-bubble msg-ai";

    const t = document.createElement("span");
    t.className = "typing";
    t.innerHTML = `
      Thinking
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    `;
    bubble.appendChild(t);
    typingRow.appendChild(bubble);
    messagesEl.appendChild(typingRow);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    if (typingRow && typingRow.parentNode) {
      typingRow.parentNode.removeChild(typingRow);
    }
    typingRow = null;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      hideTyping();

      if (data.reply) {
        addMessage(data.reply, "ai");
      } else {
        addMessage("I could not generate a response just now.", "ai");
      }
    } catch (err) {
      hideTyping();
      addMessage("There was an error talking to the server. Please try again.", "ai");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  inputEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
