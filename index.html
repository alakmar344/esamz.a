<script>
/* ---------- SHORTCUTS ---------- */
const $ = id => document.getElementById(id);
const chat=$('chat'), input=$('input'), sendBtn=$('sendBtn'), sidebar=$('sidebar'), menuToggle=$('menuToggle'),
      chatHistory=$('chatHistory'), welcomeMsg=$('welcomeMsg'), filesContainer=$('filesContainer'),
      filesInfo=$('filesInfo'), fileInput=$('fileInput'), inputWrap=$('inputWrap'), dragDropOverlay=$('dragDropOverlay'),
      voiceBtn=$('voiceBtn'), approvalPopup=$('approvalPopup'), popupIcon=$('popupIcon'), popupText=$('popupText');

/* ---------- STATE ---------- */
let isLoading=false, currentChatId=null, uploadedFiles=[], recognition=null, isRecording=false, isMobile=innerWidth<=768, hasUserSentMessage=false;

/* ---------- RESPONSIVE ---------- */
window.addEventListener('resize', () => isMobile = innerWidth <= 768);

/* ---------- SIDEBAR ---------- */
function toggleSidebar(){
  if(isMobile){ sidebar.classList.toggle('open'); $('sidebarOverlay').classList.toggle('active'); }
  else sidebar.classList.toggle('collapsed');
}
function closeSidebar(){
  if(isMobile){ sidebar.classList.remove('open'); $('sidebarOverlay').classList.remove('active'); }
}

/* ---------- CHAT HISTORY ---------- */
function loadChatHistory(){
  const history=JSON.parse(localStorage.getItem('chatHistory')||'[]');
  chatHistory.innerHTML='';
  const now=Date.now(), dayMs=86400000;
  const today=[],yesterday=[],older=[];
  history.forEach(item=>{
    const age=now-item.timestamp;
    if(age<dayMs)today.push(item);else if(age<dayMs*2)yesterday.push(item);else older.push(item);
  });
  if(today.length)renderSection('Today',today);
  if(yesterday.length)renderSection('Yesterday',yesterday);
  if(older.length)renderSection('Older',older);
}
function renderSection(label,items){
  const sec=document.createElement('div');sec.className='history-section';
  sec.innerHTML=`<div class="history-label">${label}</div>`;
  items.forEach(item=>{
    const div=document.createElement('div');div.className='history-item'+(item.id===currentChatId?' active':'');
    div.innerHTML=`
      <div class="history-icon">💬</div>
      <div class="history-content">
        <div class="history-title">${item.title}</div>
        <div class="history-time">${new Date(item.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <button class="history-delete" onclick="deleteChat('${item.id}');event.stopPropagation()">×</button>`;
    div.onclick=()=>{loadChat(item.id);if(isMobile)closeSidebar();};
    sec.appendChild(div);
  });
  chatHistory.appendChild(sec);
}
function saveCurrentChat(){
  if(!currentChatId)return;
  const msgs=Array.from(chat.querySelectorAll('.message')).map(m=>({role:m.classList.contains('user')?'user':'ai',text:m.querySelector('.bubble').textContent}));
  const h=JSON.parse(localStorage.getItem('chatHistory')||'[]');
  const idx=h.findIndex(i=>i.id===currentChatId);
  if(idx>=0){h[idx].messages=msgs;h[idx].timestamp=Date.now();}
  localStorage.setItem('chatHistory',JSON.stringify(h));
}
function loadChat(id){
  saveCurrentChat();currentChatId=id;
  const h=JSON.parse(localStorage.getItem('chatHistory')||'[]');
  const data=h.find(i=>i.id===id);if(!data)return;
  chat.innerHTML='';
  if(data.messages&&data.messages.length){hasUserSentMessage=true;welcomeMsg.classList.add('hide');}
  else{hasUserSentMessage=false;welcomeMsg.classList.remove('hide');chat.appendChild(welcomeMsg);}
  data.messages.forEach(m=>addMessage(m.text,m.role,false));
  loadChatHistory();
}
function deleteChat(id){
  let h=JSON.parse(localStorage.getItem('chatHistory')||'[]');
  h=h.filter(i=>i.id!==id);localStorage.setItem('chatHistory',JSON.stringify(h));
  if(currentChatId===id)newChat();loadChatHistory();
}
function newChat(){
  saveCurrentChat();currentChatId='chat_'+Date.now();
  const h=JSON.parse(localStorage.getItem('chatHistory')||'[]');
  h.unshift({id:currentChatId,title:'New Chat',timestamp:Date.now(),messages:[]});
  localStorage.setItem('chatHistory',JSON.stringify(h));
  chat.innerHTML='';hasUserSentMessage=false;welcomeMsg.classList.remove('hide');chat.appendChild(welcomeMsg);
  uploadedFiles=[];filesContainer.style.display='none';filesInfo.style.display='none';filesContainer.innerHTML='';
  loadChatHistory();if(isMobile)closeSidebar();
}
function clearCurrentChat(){
  if(confirm('Clear this chat?')){
    chat.innerHTML='';hasUserSentMessage=false;welcomeMsg.classList.remove('hide');chat.appendChild(welcomeMsg);
    if(currentChatId){
      const h=JSON.parse(localStorage.getItem('chatHistory')||'[]');
      const idx=h.findIndex(i=>i.id===currentChatId);
      if(idx>=0){h[idx].messages=[];localStorage.setItem('chatHistory',JSON.stringify(h));}
    }
    uploadedFiles=[];filesContainer.style.display='none';filesInfo.style.display='none';filesContainer.innerHTML='';
  }
}
function clearAllHistory(){
  if(confirm('Delete all chat history?')){localStorage.removeItem('chatHistory');newChat();showApproval('🗑️','All chats cleared');}
}
function exportChat(){
  const msgs=Array.from(chat.querySelectorAll('.message')).map(m=>{
    const role=m.classList.contains('user')?'User':'AI';
    const text=m.querySelector('.bubble').textContent;
    return `${role}: ${text}`;
  }).join('\n\n');
  if(!msgs){showApproval('⚠️','No messages to export');return;}
  const blob=new Blob([msgs],{type:'text/plain'}),url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`esamz_chat_${Date.now()}.txt`;a.click();URL.revokeObjectURL(url);
  showApproval('✅','Chat exported');
}

/* ---------- UI ---------- */
function showApproval(icon,text){
  popupIcon.textContent=icon;popupText.textContent=text;
  approvalPopup.classList.add('show');
  setTimeout(()=>approvalPopup.classList.remove('show'),2000);
}
function addMessage(text,role,isNew=true){
  if(role==='user'&&!hasUserSentMessage){hasUserSentMessage=true;welcomeMsg.classList.add('hide');setTimeout(()=>welcomeMsg.remove(),300);}
  const div=document.createElement('div');div.className='message '+role;
  div.innerHTML=`<div class="message-avatar">${role==='user'?'👤':'🤖'}</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent=text;
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
  if(isNew)saveCurrentChat();
}
function addLoading(){
  const div=document.createElement('div');div.className='message ai';div.id='loading';
  div.innerHTML='<div class="message-avatar">🤖</div><div class="bubble">Thinking…</div>';
  chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
}
function removeLoading(){const el=$('loading');if(el)el.remove();}

/* ---------- SEND ---------- */
async function sendMessage(){
  const text=input.value.trim();if(!text||isLoading)return;
  if(!currentChatId)newChat();
  isLoading=true;sendBtn.disabled=true;
  input.value='';autoGrow();
  const h=JSON.parse(localStorage.getItem('chatHistory')||'[]');
  const chatData=h.find(i=>i.id===currentChatId);
  if(chatData&&chatData.title==='New Chat'){chatData.title=text.slice(0,30)+(text.length>30?'...':'');localStorage.setItem('chatHistory',JSON.stringify(h));loadChatHistory();}
  addMessage(text,'user');addLoading();
  if(isMobile)closeSidebar();
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,files:uploadedFiles.map(f=>({name:f.name,type:f.type,size:f.size}))})});
    const data=await res.json();removeLoading();addMessage(data.reply,'ai');
  }catch{removeLoading();addMessage('Network error. Please try again.','ai');}
  finally{isLoading=false;sendBtn.disabled=false;}
}
sendBtn.onclick=sendMessage;
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});

/* ---------- FILE HANDLING ---------- */
fileInput.addEventListener('change',e=>handleFiles(e.target.files));
function handleFiles(files){
  const valid=Array.from(files).slice(0,10);
  uploadedFiles.push(...valid);renderFiles();
}
function renderFiles(){
  if(!uploadedFiles.length){filesContainer.style.display='none';filesInfo.style.display='none';return;}
  filesContainer.style.display='flex';filesInfo.style.display='block';filesInfo.textContent=`${uploadedFiles.length} file(s) attached`;
  filesContainer.innerHTML='';
  uploadedFiles.forEach((f,i)=>{
    const badge=document.createElement('div');badge.className='file-badge';
    badge.innerHTML=`
      <div class="file-icon">${f.type.startsWith('audio')?'🎵':f.type.startsWith('video')?'🎬':'📄'}</div>
      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-type">${(f.size/1024).toFixed(1)} KB</div>
      </div>
      <button class="file-remove" onclick="removeFile(${i})">×</button>`;
    filesContainer.appendChild(badge);
  });
}
function removeFile(i){uploadedFiles.splice(i,1);renderFiles();}

/* ---------- DRAG & DROP ---------- */
['dragenter','dragover','dragleave','drop'].forEach(evt=>inputWrap.addEventListener(evt,preventDefaults,false));
function preventDefaults(e){e.preventDefault();e.stopPropagation();}
['dragenter','dragover'].forEach(evt=>inputWrap.addEventListener(evt,()=>{dragDropOverlay.classList.add('active');inputWrap.classList.add('drag-over');},false));
['dragleave','drop'].forEach(evt=>inputWrap.addEventListener(evt,()=>{dragDropOverlay.classList.remove('active');inputWrap.classList.remove('drag-over');},false));
inputWrap.addEventListener('drop',e=>handleFiles(e.dataTransfer.files),false);

/* ---------- VOICE ---------- */
if(window.SpeechRecognition||window.webkitSpeechRecognition){
  recognition=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=1;
  recognition.onresult=e=>{input.value+=e.results[0][0].transcript;autoGrow();};
  recognition.onerror=()=>{showApproval('⚠️','Voice input failed');voiceBtn.classList.remove('recording');isRecording=false;};
  recognition.onend=()=>{voiceBtn.classList.remove('recording');isRecording=false;};
}
function toggleVoice(){
  if(!recognition){showApproval('🚫','Voice input not supported');return;}
  if(isRecording){recognition.stop();}else{recognition.start();voiceBtn.classList.add('recording');isRecording=true;}
}

/* ---------- TEXTAREA AUTO-GROW ---------- */
function autoGrow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';}
input.addEventListener('input',autoGrow);

/* ---------- INIT ---------- */
loadChatHistory();if(!currentChatId)newChat();
if(isMobile)sidebar.classList.add('collapsed');
</script>
</body>
</html>
