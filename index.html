<script>
/* =======================
   ELEMENT REFERENCES
======================= */
const chat = document.getElementById("chat")
const input = document.getElementById("input")
const send = document.getElementById("send")
const fileInput = document.getElementById("fileInput")
const filePreview = document.getElementById("filePreview")
const voiceBtn = document.getElementById("voiceBtn")
const welcomeMsg = document.getElementById("welcomeMsg")
const sidebar = document.getElementById("sidebar")

/* =======================
   STATE
======================= */
let uploadedFile = null
let uploadedText = ""
let conversationHistory = []
let recognition = null
let isRecording = false
let isFirstMessage = true

/* =======================
   APPROVAL POPUP
======================= */
function showApproval(icon, text){
  const popup = document.getElementById("approvalPopup")
  const popupIcon = document.getElementById("popupIcon")
  const popupText = document.getElementById("popupText")

  popupIcon.textContent = icon
  popupText.textContent = text

  popup.classList.add("show")

  setTimeout(() => {
    popup.classList.remove("show")
  }, 2000)
}

/* =======================
   SIDEBAR TOGGLE
======================= */
function toggleSidebar(){
  sidebar.classList.toggle("collapsed")
}

/* =======================
   VOICE TO TEXT
======================= */
function toggleVoice(){
  if(!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)){
    alert("Voice recognition not supported in your browser.")
    return
  }

  if(isRecording){
    stopRecording()
  } else {
    startRecording()
  }
}

function startRecording(){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
  recognition = new SpeechRecognition()
  recognition.continuous = true
  recognition.interimResults = true
  recognition.lang = 'en-US'

  recognition.onstart = () => {
    isRecording = true
    voiceBtn.classList.add("recording")
  }

  recognition.onresult = (event) => {
    let transcript = ''
    for(let i = event.resultIndex; i < event.results.length; i++){
      transcript += event.results[i][0].transcript
    }
    input.value = transcript
  }

  recognition.onerror = (event) => {
    console.error("Voice recognition error:", event.error)
    stopRecording()
  }

  recognition.onend = () => {
    stopRecording()
  }

  recognition.start()
}

function stopRecording(){
  if(recognition){
    recognition.stop()
    recognition = null
  }
  isRecording = false
  voiceBtn.classList.remove("recording")
}

/* =======================
   MESSAGE UI
======================= */
function addMessage(text, role){
  // Remove welcome message on first user message
  if(role === "user" && isFirstMessage){
    if(welcomeMsg){
      welcomeMsg.style.display = "none"
    }
    isFirstMessage = false
  }

  const msg = document.createElement("div")
  msg.className = "message " + role

  const bubble = document.createElement("div")
  bubble.className = "bubble"
  bubble.textContent = text

  if(role === "ai") attachTools(bubble, text)

  msg.appendChild(bubble)
  chat.appendChild(msg)
  chat.scrollTop = chat.scrollHeight
}

/* =======================
   AI TOOLS
======================= */
function attachTools(bubble, text){
  const tools = document.createElement("div")
  tools.className = "ai-tools"

  const copyBtn = document.createElement("button")
  copyBtn.textContent = "📋 Copy"
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(text)
    showApproval("✓", "Copied to clipboard!")
  }

  const likeBtn = document.createElement("button")
  likeBtn.textContent = "👍"
  likeBtn.onclick = () => {
    console.log("Liked")
    showApproval("👍", "Thanks for your feedback!")
  }

  const dislikeBtn = document.createElement("button")
  dislikeBtn.textContent = "👎"
  dislikeBtn.onclick = () => {
    console.log("Disliked")
    showApproval("👎", "Feedback received!")
  }

  tools.append(copyBtn, likeBtn, dislikeBtn)
  bubble.appendChild(tools)
}

/* =======================
   NEW CHAT
======================= */
function newChat(){
  chat.innerHTML = `
    <div class="welcome" id="welcomeMsg">
      <h2>Welcome to eSAMz v7</h2>
      <p>Dive into intelligent conversations.</p>
    </div>`
  conversationHistory = []
  isFirstMessage = true
  resetFile()
}

/* =======================
   FILE HANDLING
======================= */
fileInput.onchange = async () => {
  const file = fileInput.files[0]
  if(!file) return

  uploadedFile = file
  uploadedText = ""

  if(file.type === "text/plain"){
    uploadedText = await file.text()
  }

  filePreview.style.display = "block"
  filePreview.innerHTML = `
    <div class="file-badge">
      <div class="file-icon">${file.name.split('.').pop().toUpperCase()}</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
        <div class="file-type">${(file.size/1024).toFixed(1)} KB</div>
      </div>
      <button class="file-remove" onclick="removeFile()">✕</button>
    </div>`
}

function removeFile(){
  uploadedFile = null
  uploadedText = ""
  fileInput.value = ""
  filePreview.style.display = "none"
  filePreview.innerHTML = ""
}

function resetFile(){
  uploadedFile = null
  uploadedText = ""
  fileInput.value = ""
  filePreview.style.display = "none"
  filePreview.innerHTML = ""
}

/* =======================
   SEND MESSAGE
======================= */
async function sendMsg(){
  const text = input.value.trim()
  if(!text && !uploadedFile) return

  let payload = text
  if(uploadedText){
    payload = `[FILE CONTENT]\n${uploadedText}\n\n${text}`
  } else if(uploadedFile){
    payload = `[Attached file: ${uploadedFile.name}]\n\n${text}`
  }

  addMessage(text || "[File sent]", "user")
  input.value = ""
  resetFile()

  conversationHistory.push({ role: "user", content: payload })

  try{
    const res = await fetch("/api/chat",{
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: payload,
        history: conversationHistory
      })
    })

    const data = await res.json()
    const reply = data.reply || "No response."

    addMessage(reply, "ai")
    conversationHistory.push({ role: "assistant", content: reply })

  } catch (err){
    console.error(err)
    addMessage("Error connecting to AI.", "ai")
  }
}

/* =======================
   EVENTS
======================= */
send.onclick = sendMsg

input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault()
    sendMsg()
  }
})
</script>
