<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5}
.app{display:flex;height:100vh;position:relative;overflow:hidden}

.app::before{
  content:'';
  position:absolute;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:radial-gradient(circle at 20% 50%, rgba(102,126,234,0.06) 0%, transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(118,75,162,0.06) 0%, transparent 50%);
  animation:gradient 30s ease infinite;
  pointer-events:none;
  z-index:0;
  will-change:transform;
}

@keyframes gradient{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  50%{transform:translate(5%,5%) rotate(180deg)}
}

.sidebar{
  width:300px;
  background:rgba(17,17,17,0.95);
  backdrop-filter:blur(10px);
  border-right:1px solid rgba(255,255,255,0.06);
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:10;
  transition:transform 0.3s ease;
}

.sidebar.collapsed{transform:translateX(-300px)}

.sidebar-toggle{
  position:absolute;
  right:-40px;
  top:20px;
  background:rgba(17,17,17,0.95);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:0 8px 8px 0;
  padding:10px 8px;
  cursor:pointer;
  color:#999;
  font-size:16px;
  transition:all 0.2s ease;
  z-index:11;
}

.sidebar.collapsed .sidebar-toggle{
  right:auto;
  left:100%;
}

.sidebar-toggle:hover{
  background:rgba(102,126,234,0.2);
  color:#667eea;
}

.menu-toggle{
  position:fixed;
  top:20px;
  left:20px;
  background:rgba(17,17,17,0.95);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:8px;
  padding:10px 12px;
  cursor:pointer;
  color:#999;
  font-size:16px;
  transition:all 0.2s ease;
  z-index:5;
  display:none;
}

.sidebar.collapsed ~ .main .menu-toggle{display:block}
.menu-toggle:hover{background:rgba(102,126,234,0.2);color:#667eea}

.sidebar-header{
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}

.logo{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:18px;
}

.logo-text{display:flex;flex-direction:column}

.logo-title{
  font-size:16px;
  font-weight:700;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.logo-subtitle{
  font-size:10px;
  color:#999;
  font-weight:500;
}

.new-chat-btn{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  transition:all 0.2s ease;
}

.new-chat-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(102,126,234,0.3);
}

.new-chat-btn:active{transform:translateY(0)}

.chat-history{
  flex:1;
  overflow-y:auto;
  padding:12px;
}

.chat-history::-webkit-scrollbar{width:4px}
.chat-history::-webkit-scrollbar-track{background:transparent}
.chat-history::-webkit-scrollbar-thumb{background:rgba(102,126,234,0.3);border-radius:2px}

.history-section{margin-bottom:20px}

.history-label{
  font-size:10px;
  font-weight:700;
  color:#666;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:6px;
  padding:0 6px;
}

.history-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  margin-bottom:2px;
  border-radius:8px;
  cursor:pointer;
  transition:background 0.2s ease;
}

.history-item:hover{background:rgba(102,126,234,0.1)}

.history-item.active{
  background:rgba(102,126,234,0.15);
  border:1px solid rgba(102,126,234,0.3);
}

.history-icon{font-size:14px;opacity:0.8}

.history-content{flex:1;min-width:0}

.history-title{
  font-size:13px;
  font-weight:600;
  color:#e5e5e5;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history-time{
  font-size:10px;
  color:#999;
  margin-top:2px;
}

.history-delete{
  opacity:0;
  background:none;
  border:none;
  color:#999;
  font-size:14px;
  padding:4px;
  cursor:pointer;
  border-radius:4px;
  transition:opacity 0.2s ease;
}

.history-item:hover .history-delete{opacity:1}

.history-delete:hover{
  background:rgba(239,68,68,0.2);
  color:#ef4444;
}

.sidebar-links{
  padding:12px;
  border-top:1px solid rgba(255,255,255,0.06);
}

.sidebar-links a{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 10px;
  color:#999;
  text-decoration:none;
  border-radius:6px;
  transition:background 0.2s ease;
  margin-bottom:2px;
  font-size:12px;
  font-weight:500;
}

.sidebar-links a:hover{
  background:rgba(102,126,234,0.1);
  color:#fff;
}

.sidebar-footer{
  padding:12px;
  font-size:10px;
  color:#666;
  border-top:1px solid rgba(255,255,255,0.06);
  text-align:center;
  line-height:1.5;
  background:rgba(0,0,0,0.2);
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}

.header{
  height:60px;
  background:rgba(17,17,17,0.95);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.header-title{
  font-size:16px;
  font-weight:600;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.header-actions{display:flex;gap:6px}

.header-btn{
  background:rgba(102,126,234,0.1);
  border:1px solid rgba(102,126,234,0.2);
  border-radius:6px;
  padding:6px 12px;
  color:#999;
  cursor:pointer;
  font-size:12px;
  font-weight:500;
  transition:all 0.2s ease;
}

.header-btn:hover{
  background:rgba(102,126,234,0.2);
  color:#667eea;
}

.chat{
  flex:1;
  padding:24px;
  overflow-y:auto;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-track{background:transparent}
.chat::-webkit-scrollbar-thumb{background:rgba(102,126,234,0.3);border-radius:3px}

.welcome{
  padding:48px 24px;
  margin-bottom:20px;
  border-radius:16px;
  background:linear-gradient(135deg,rgba(102,126,234,0.12),rgba(118,75,162,0.12));
  text-align:center;
  border:1px solid rgba(102,126,234,0.2);
}

.welcome h2{
  font-size:28px;
  margin-bottom:10px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-weight:700;
}

.welcome p{
  font-size:14px;
  color:#999;
  font-weight:500;
  margin-bottom:20px;
}

.welcome-features{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
  margin-top:20px;
}

.feature-card{
  background:rgba(17,17,17,0.6);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;
  padding:12px 16px;
  min-width:120px;
  transition:all 0.2s ease;
}

.feature-card:hover{
  background:rgba(102,126,234,0.1);
  border-color:rgba(102,126,234,0.3);
}

.feature-icon{font-size:20px;margin-bottom:6px}
.feature-text{font-size:12px;color:#999;font-weight:500}

.message{
  display:flex;
  margin-bottom:20px;
  gap:10px;
}

.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}

.message-avatar{
  width:32px;
  height:32px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  flex-shrink:0;
}

.message.user .message-avatar{
  background:linear-gradient(135deg,#667eea,#764ba2);
  order:2;
}

.message.ai .message-avatar{
  background:rgba(17,17,17,0.9);
  border:1px solid rgba(255,255,255,0.1);
}

.bubble{
  max-width:70%;
  padding:12px 16px;
  border-radius:14px;
  white-space:pre-wrap;
  font-size:14px;
  line-height:1.5;
}

.user .bubble{
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  border-bottom-right-radius:4px;
}

.ai .bubble{
  background:rgba(17,17,17,0.9);
  border:1px solid rgba(255,255,255,0.08);
  border-bottom-left-radius:4px;
}

.code-block{
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:8px;
  margin:10px 0;
  overflow:hidden;
}

.code-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 12px;
  background:rgba(0,0,0,0.3);
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.code-lang{
  font-size:11px;
  color:#999;
  font-weight:600;
  text-transform:uppercase;
}

.code-actions{
  display:flex;
  gap:6px;
}

.code-btn{
  background:rgba(102,126,234,0.2);
  border:1px solid rgba(102,126,234,0.3);
  border-radius:4px;
  padding:4px 8px;
  color:#999;
  cursor:pointer;
  font-size:10px;
  font-weight:600;
  transition:all 0.2s ease;
}

.code-btn:hover{
  background:rgba(102,126,234,0.3);
  color:#667eea;
}

.code-content{
  padding:12px;
  overflow-x:auto;
  font-family:'Courier New', monospace;
  font-size:13px;
  line-height:1.4;
  color:#e5e5e5;
}

.code-content::-webkit-scrollbar{height:6px}
.code-content::-webkit-scrollbar-track{background:transparent}
.code-content::-webkit-scrollbar-thumb{background:rgba(102,126,234,0.3);border-radius:3px}

.ai-tools{
  display:flex;
  gap:8px;
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.06);
}

.ai-tools button{
  background:rgba(102,126,234,0.1);
  border:1px solid rgba(102,126,234,0.2);
  border-radius:6px;
  padding:4px 10px;
  color:#999;
  cursor:pointer;
  font-size:11px;
  font-weight:500;
  transition:all 0.2s ease;
}

.ai-tools button:hover{
  background:rgba(102,126,234,0.2);
  color:#667eea;
}

.input-bar{
  padding:20px 24px;
  background:rgba(17,17,17,0.95);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,0.06);
}

.files-container{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
  max-height:150px;
  overflow-y:auto;
}

.files-container::-webkit-scrollbar{width:4px}
.files-container::-webkit-scrollbar-track{background:transparent}
.files-container::-webkit-scrollbar-thumb{background:rgba(102,126,234,0.3);border-radius:2px}

.file-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  background:rgba(102,126,234,0.15);
  border:1px solid rgba(102,126,234,0.3);
  border-radius:8px;
  color:#e5e5e5;
  font-size:12px;
}

.file-icon{
  display:flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  border-radius:6px;
  font-size:10px;
  font-weight:700;
  color:white;
}

.file-info{display:flex;flex-direction:column;gap:2px}

.file-name{
  font-weight:600;
  font-size:12px;
  max-width:150px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.file-type{font-size:9px;color:#999}

.file-remove{
  background:none;
  border:none;
  color:#999;
  font-size:14px;
  padding:2px;
  cursor:pointer;
  border-radius:4px;
  transition:all 0.2s ease;
}

.file-remove:hover{
  background:rgba(239,68,68,0.2);
  color:#ef4444;
}

.files-info{
  font-size:11px;
  color:#999;
  margin-bottom:8px;
  text-align:center;
}

.input-wrap{
  display:flex;
  gap:10px;
  background:rgba(26,26,26,0.8);
  border-radius:12px;
  padding:10px 12px;
  border:1px solid rgba(255,255,255,0.08);
  transition:border-color 0.2s ease;
  align-items:flex-end;
}

.input-wrap:focus-within{
  border-color:rgba(102,126,234,0.5);
}

textarea{
  flex:1;
  background:none;
  border:none;
  color:#e5e5e5;
  resize:none;
  outline:none;
  font-size:14px;
  font-family:inherit;
  line-height:1.4;
  max-height:120px;
}

textarea::placeholder{color:#666}

.file-btn, .voice-btn{
  background:none;
  border:none;
  color:#999;
  font-size:18px;
  padding:4px 6px;
  border-radius:6px;
  transition:all 0.2s ease;
  cursor:pointer;
}

.file-btn:hover, .voice-btn:hover{
  background:rgba(102,126,234,0.15);
  color:#667eea;
}

.voice-btn.recording{
  color:#ef4444;
  animation:recordPulse 1s ease infinite;
}

@keyframes recordPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.1)}
}

.send-btn{
  background:linear-gradient(135deg,#667eea,#764ba2);
  border:none;
  border-radius:10px;
  color:white;
  padding:8px 20px;
  font-weight:600;
  font-size:13px;
  transition:all 0.2s ease;
  cursor:pointer;
}

.send-btn:hover:not(:disabled){transform:translateY(-1px)}
.send-btn:active:not(:disabled){transform:translateY(0)}
.send-btn:disabled{opacity:0.5;cursor:not-allowed}

.approval-popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0);
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  padding:16px 24px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  z-index:1000;
  opacity:0;
  transition:all 0.2s ease;
  display:flex;
  align-items:center;
  gap:10px;
}

.approval-popup.show{
  transform:translate(-50%, -50%) scale(1);
  opacity:1;
}

.approval-popup .icon{font-size:20px}

.clear-history-btn{
  width:100%;
  padding:8px;
  margin-top:6px;
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.2);
  border-radius:6px;
  color:#ef4444;
  cursor:pointer;
  font-size:11px;
  font-weight:600;
  transition:all 0.2s ease;
}

.clear-history-btn:hover{background:rgba(239,68,68,0.2)}

@media(max-width:768px){
  .sidebar{width:260px}
  .chat{padding:16px}
  .input-bar{padding:14px}
  .bubble{max-width:85%}
  .welcome{padding:32px 16px}
  .header-actions{display:none}
}

@media (prefers-reduced-motion: reduce) {
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .app::before{animation:none}
}
</style>

<div class="app">

  <div class="chat-history" id="chatHistory"></div>

  <div class="sidebar-links">
    <a href="https://esamz.info" target="_blank">🏠 Home</a>
    <a href="https://esamz.info/docs" target="_blank">📚 Docs</a>
    <a href="https://esamz.info/aboutus" target="_blank">ℹ️ About</a>

  <div class="sidebar-footer">
    © 2025 eSAMz<br>By Alakmar Teenwala
  </div>
</aside>

  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  
  <div class="header">
    <div class="header-title">eSAMz AI Assistant</div>
    <div class="header-actions">
      <button class="header-btn" onclick="exportChat()">📥 Export</button>
      <button class="header-btn" onclick="clearCurrentChat()">🗑️ Clear</button>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcomeMsg">
      <h2>Welcome to eSAMz v7</h2>
      <p>Your intelligent AI companion</p>
      <div class="welcome-features">
        <div class="feature-card">
          <div class="feature-icon">💬</div>
          <div class="feature-text">Smart Chat</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">💾</div>
          <div class="feature-text">Auto Save</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎤</div>
          <div class="feature-text">Voice Input</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📎</div>
          <div class="feature-text">Multi-File</div>
        </div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="files-container" id="filesContainer" style="display:none"></div>
    <div class="files-info" id="filesInfo" style="display:none"></div>
    <div class="input-wrap">
      <input type="file" id="fileInput" style="display:none" 
        accept=".txt,.js,.py,.java,.cpp,.c,.html,.css,.json,.xml,.md,.csv,.log,.sh,.bat,.yaml,.yml,.ts,.jsx,.tsx,.php,.rb,.go,.rs,.swift,.kt,.scala,.r,.sql,.pl,.lua,.dart,.vim,.ini,.cfg,.conf,.properties,audio/*,video/*" 
        multiple>
      <button class="file-btn" onclick="fileInput.click()">📎</button>
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
      <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
      <button class="send-btn" id="send">Send</button>
    </div>
  </div>
</main>

</div>

<div class="approval-popup" id="approvalPopup">
  <span class="icon" id="popupIcon"></span>
  <span id="popupText"></span>
</div>

<script>
const chat = document.getElementById("chat")
const input = document.getElementById("input")
const send = document.getElementById("send")
const fileInput = document.getElementById("fileInput")
const filesContainer = document.getElementById("filesContainer")
const filesInfo = document.getElementById("filesInfo")
const voiceBtn = document.getElementById("voiceBtn")
const sidebar = document.getElementById("sidebar")
const chatHistory = document.getElementById("chatHistory")

let uploadedFiles = []
let conversationHistory = []
let recognition = null
let isRecording = false
let currentChatId = null
let allChats = {}
let saveTimeout = null

const MAX_FILES = 10
const MAX_FILE_SIZE = 50 * 1024 * 1024 // 50MB

window.addEventListener('DOMContentLoaded', () => {
  loadChatsFromStorage()
  renderChatHistory()
  autoResizeTextarea()
})

input.addEventListener('input', autoResizeTextarea)

function autoResizeTextarea() {
  input.style.height = 'auto'
  input.style.height = Math.min(input.scrollHeight, 120) + 'px'
}

function saveChatsToStorage() {
  clearTimeout(saveTimeout)
  saveTimeout = setTimeout(() => {
    try {
      localStorage.setItem('esamz_chats', JSON.stringify(allChats))
      localStorage.setItem('esamz_current_chat', currentChatId)
    } catch (e) {
      console.error('Storage error:', e)
    }
  }, 500)
}

function loadChatsFromStorage() {
  try {
    const stored = localStorage.getItem('esamz_chats')
    const storedCurrent = localStorage.getItem('esamz_current_chat')
    
    if (stored) {
      allChats = JSON.parse(stored)
    }
    
    if (storedCurrent && allChats[storedCurrent]) {
      currentChatId = storedCurrent
      loadChat(currentChatId)
    }
  } catch (e) {
    console.error('Load error:', e)
    allChats = {}
  }
}

function renderChatHistory() {
  const chatArray = Object.entries(allChats).sort((a, b) => b[1].timestamp - a[1].timestamp)
  
  if (chatArray.length === 0) {
    chatHistory.innerHTML = '<div style="padding:16px;text-align:center;color:#666;font-size:12px;">No history yet</div>'
    return
  }
  
  const today = []
  const yesterday = []
  const older = []
  
  const now = Date.now()
  const oneDay = 86400000
  
  chatArray.forEach(([id, chat]) => {
    const age = now - chat.timestamp
    if (age < oneDay) {
      today.push([id, chat])
    } else if (age < 2 * oneDay) {
      yesterday.push([id, chat])
    } else {
      older.push([id, chat])
    }
  })
  
  let html = ''
  
  if (today.length > 0) {
    html += '<div class="history-section"><div class="history-label">Today</div>'
    today.forEach(([id, chat]) => {
      html += renderHistoryItem(id, chat)
    })
    html += '</div>'
  }
  
  if (yesterday.length > 0) {
    html += '<div class="history-section"><div class="history-label">Yesterday</div>'
    yesterday.forEach(([id, chat]) => {
      html += renderHistoryItem(id, chat)
    })
    html += '</div>'
  }
  
  if (older.length > 0) {
    html += '<div class="history-section"><div class="history-label">Older</div>'
    older.forEach(([id, chat]) => {
      html += renderHistoryItem(id, chat)
    })
    html += '</div>'
  }
  
  chatHistory.innerHTML = html
}

function renderHistoryItem(id, chat) {
  const isActive = id === currentChatId ? 'active' : ''
  const title = chat.title || 'New conversation'
  const time = formatTime(chat.timestamp)
  
  return `
    <div class="history-item ${isActive}" onclick="loadChat('${id}')">
      <div class="history-icon">💬</div>
      <div class="history-content">
        <div class="history-title">${escapeHtml(title)}</div>
        <div class="history-time">${time}</div>
      </div>
      <button class="history-delete" onclick="event.stopPropagation(); deleteChat('${id}')">🗑️</button>
    </div>
  `
}

function formatTime(timestamp) {
  const date = new Date(timestamp)
  const now = new Date()
  
  if (date.toDateString() === now.toDateString()) {
    return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
  }
  
  return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
}

function escapeHtml(text) {
  const div = document.createElement('div')
  div.textContent = text
  return div.innerHTML
}

function newChat() {
  currentChatId = 'chat_' + Date.now()
  conversationHistory = []
  
  allChats[currentChatId] = {
    id: currentChatId,
    title: 'New conversation',
    messages: [],
    timestamp: Date.now()
  }
  
  saveChatsToStorage()
  renderChatHistory()
  
  chat.innerHTML = `
    <div class="welcome" id="welcomeMsg">
      <h2>Welcome to eSAMz v7</h2>
      <p>Your intelligent AI companion</p>
      <div class="welcome-features">
        <div class="feature-card">
          <div class="feature-icon">💬</div>
          <div class="feature-text">Smart Chat</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">💾</div>
          <div class="feature-text">Auto Save</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">🎤</div>
          <div class="feature-text">Voice Input</div>
        </div>
        <div class="feature-card">
          <div class="feature-icon">📎</div>
          <div class="feature-text">Multi-File</div>
        </div>
      </div>
    </div>`
  
  resetFiles()
}

function loadChat(chatId) {
  if (!allChats[chatId]) return
  
  currentChatId = chatId
  const chatData = allChats[chatId]
  conversationHistory = chatData.messages || []
  
  chat.innerHTML = ''
  
  if (conversationHistory.length === 0) {
    chat.innerHTML = `
      <div class="welcome" id="welcomeMsg">
        <h2>Welcome to eSAMz v7</h2>
        <p>Your intelligent AI companion</p>
        <div class="welcome-features">
          <div class="feature-card">
            <div class="feature-icon">💬</div>
            <div class="feature-text">Smart Chat</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">💾</div>
            <div class="feature-text">Auto Save</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">🎤</div>
            <div class="feature-text">Voice Input</div>
          </div>
          <div class="feature-card">
            <div class="feature-icon">📎</div>
            <div class="feature-text">Multi-File</div>
          </div>
        </div>
      </div>`
  } else {
    conversationHistory.forEach(msg => {
      addMessageToUI(msg.content, msg.role)
    })
  }
  
  saveChatsToStorage()
  renderChatHistory()
}

function deleteChat(chatId) {
  if (!confirm('Delete this chat?')) return
  
  delete allChats[chatId]
  
  if (currentChatId === chatId) {
    newChat()
  } else {
    saveChatsToStorage()
    renderChatHistory()
  }
  
  showApproval("🗑️", "Deleted")
}

function clearCurrentChat() {
  if (!currentChatId || conversationHistory.length === 0) return
  
  if (!confirm('Clear this chat?')) return
  
  conversationHistory = []
  allChats[currentChatId].messages = []
  allChats[currentChatId].timestamp = Date.now()
  
  saveChatsToStorage()
  loadChat(currentChatId)
  showApproval("✓", "Cleared")
}

function clearAllHistory() {
  if (!confirm('Delete all history?')) return
  
  allChats = {}
  localStorage.removeItem('esamz_chats')
  localStorage.removeItem('esamz_current_chat')
  
  newChat()
  showApproval("🗑️", "All cleared")
}

function exportChat() {
  if (!currentChatId || conversationHistory.length === 0) {
    showApproval("⚠️", "No messages")
    return
  }
  
  const chatData = allChats[currentChatId]
  let content = `eSAMz Chat Export\nTitle: ${chatData.title}\nDate: ${new Date(chatData.timestamp).toLocaleString()}\n\n`
  
  conversationHistory.forEach(msg => {
    content += `${msg.role === 'user' ? 'You' : 'eSAMz'}: ${msg.content}\n\n`
  })
  
  const blob = new Blob([content], { type: 'text/plain' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = `esamz-${Date.now()}.txt`
  a.click()
  URL.revokeObjectURL(url)
  
  showApproval("📥", "Exported")
}

function toggleSidebar() {
  sidebar.classList.toggle("collapsed")
}

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    showApproval("⚠️", "Not supported")
    return
  }
  
  if (isRecording) {
    stopRecording()
  } else {
    startRecording()
  }
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
  recognition = new SpeechRecognition()
  recognition.continuous = true
  recognition.interimResults = true
  recognition.lang = 'en-US'
  
  recognition.onstart = () => {
    isRecording = true
    voiceBtn.classList.add("recording")
  }
  
  recognition.onresult = (event) => {
    let transcript = ''
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript
    }
    input.value = transcript
    autoResizeTextarea()
  }
  
  recognition.onerror = () => {
    stopRecording()
  }
  
  recognition.onend = () => {
    stopRecording()
  }
  
  recognition.start()
}

function stopRecording() {
  if (recognition) {
    recognition.stop()
    recognition = null
  }
  isRecording = false
  voiceBtn.classList.remove("recording")
}

fileInput.onchange = async () => {
  const files = Array.from(fileInput.files)
  
  for (const file of files) {
    if (uploadedFiles.length >= MAX_FILES) {
      showApproval("⚠️", `Max ${MAX_FILES} files`)
      break
    }
    
    if (file.size > MAX_FILE_SIZE) {
      showApproval("⚠️", `${file.name} too large (max 50MB)`)
      continue
    }
    
    const fileData = {
      file: file,
      name: file.name,
      size: file.size,
      type: file.type,
      extension: file.name.split('.').pop().toLowerCase()
    }
    
    if (file.type.startsWith('text/') || isTextFile(file.name)) {
      try {
        fileData.content = await file.text()
      } catch (e) {
        console.error('Error reading file:', e)
      }
    }
    
    uploadedFiles.push(fileData)
  }
  
  renderFilesPreview()
  fileInput.value = ''
}

function isTextFile(filename) {
  const textExtensions = ['txt', 'js', 'py', 'java', 'cpp', 'c', 'html', 'css', 'json', 'xml', 'md', 'csv', 'log', 'sh', 'bat', 'yaml', 'yml', 'ts', 'jsx', 'tsx', 'php', 'rb', 'go', 'rs', 'swift', 'kt', 'scala', 'r', 'sql', 'pl', 'lua', 'dart', 'vim', 'ini', 'cfg', 'conf', 'properties']
  const ext = filename.split('.').pop().toLowerCase()
  return textExtensions.includes(ext)
}

function renderFilesPreview() {
  if (uploadedFiles.length === 0) {
    filesContainer.style.display = 'none'
    filesInfo.style.display = 'none'
    return
  }
  
  filesContainer.style.display = 'flex'
  filesInfo.style.display = 'block'
  
  const totalSize = uploadedFiles.reduce((sum, f) => sum + f.size, 0)
  filesInfo.textContent = `${uploadedFiles.length}/${MAX_FILES} files • ${(totalSize / (1024 * 1024)).toFixed(1)}MB/50MB`
  
  filesContainer.innerHTML = uploadedFiles.map((fileData, index) => `
    <div class="file-badge">
      <div class="file-icon">${getFileIcon(fileData)}</div>
      <div class="file-info">
        <div class="file-name">${escapeHtml(fileData.name)}</div>
        <div class="file-type">${(fileData.size / 1024).toFixed(1)} KB</div>
      </div>
      <button class="file-remove" onclick="removeFile(${index})">✕</button>
    </div>
  `).join('')
}

function getFileIcon(fileData) {
  if (fileData.type.startsWith('audio/')) return '🎵'
  if (fileData.type.startsWith('video/')) return '🎥'
  if (fileData.type.startsWith('image/')) return '🖼️'
  return fileData.extension.toUpperCase().substring(0, 3)
}

function removeFile(index) {
  uploadedFiles.splice(index, 1)
  renderFilesPreview()
}

function resetFiles() {
  uploadedFiles = []
  fileInput.value = ''
  filesContainer.style.display = 'none'
  filesInfo.style.display = 'none'
  filesContainer.innerHTML = ''
}

function addMessageToUI(text, role) {
  const msg = document.createElement("div")
  msg.className = "message " + role
  
  const avatar = document.createElement("div")
  avatar.className = "message-avatar"
  avatar.textContent = role === "user" ? "👤" : "🤖"
  
  const bubble = document.createElement("div")
  bubble.className = "bubble"
  
  if (role === "ai") {
    bubble.innerHTML = parseMessageContent(text)
    attachTools(bubble, text)
  } else {
    bubble.textContent = text
  }
  
  msg.appendChild(avatar)
  msg.appendChild(bubble)
  chat.appendChild(msg)
  chat.scrollTop = chat.scrollHeight
}

function parseMessageContent(text) {
  const codeBlockRegex = /```(\w+)?\n([\s\S]*?)```/g
  let lastIndex = 0
  let result = ''
  let match
  
  while ((match = codeBlockRegex.exec(text)) !== null) {
    result += escapeHtml(text.substring(lastIndex, match.index))
    
    const lang = match[1] || 'code'
    const code = match[2]
    
    result += createCodeBlock(lang, code)
    lastIndex = match.index + match[0].length
  }
  
  result += escapeHtml(text.substring(lastIndex))
  
  return result.replace(/\n/g, '<br>')
}

function createCodeBlock(lang, code) {
  const escapedCode = escapeHtml(code.trim())
  const blockId = 'code_' + Date.now() + Math.random().toString(36).substr(2, 9)
  
  return `
    <div class="code-block">
      <div class="code-header">
        <span class="code-lang">${escapeHtml(lang)}</span>
        <div class="code-actions">
          <button class="code-btn" onclick="copyCode('${blockId}')">📋 Copy</button>
          <button class="code-btn" onclick="downloadCode('${blockId}', '${lang}')">💾 Download</button>
        </div>
      </div>
      <div class="code-content" id="${blockId}">${escapedCode}</div>
    </div>
  `
}

function copyCode(blockId) {
  const codeElement = document.getElementById(blockId)
  if (!codeElement) return
  
  const code = codeElement.textContent
  navigator.clipboard.writeText(code)
  showApproval("✓", "Code copied!")
}

function downloadCode(blockId, lang) {
  const codeElement = document.getElementById(blockId)
  if (!codeElement) return
  
  const code = codeElement.textContent
  const extensions = {
    'javascript': 'js',
    'python': 'py',
    'java': 'java',
    'cpp': 'cpp',
    'c': 'c',
    'html': 'html',
    'css': 'css',
    'json': 'json',
    'typescript': 'ts',
    'php': 'php',
    'ruby': 'rb',
    'go': 'go',
    'rust': 'rs',
    'swift': 'swift',
    'kotlin': 'kt',
    'sql': 'sql'
  }
  
  const ext = extensions[lang.toLowerCase()] || 'txt'
  const filename = `code_${Date.now()}.${ext}`
  
  const blob = new Blob([code], { type: 'text/plain' })
  const url = URL.createObjectURL(blob)
  const a = document.createElement('a')
  a.href = url
  a.download = filename
  a.click()
  URL.revokeObjectURL(url)
  
  showApproval("💾", "Downloaded!")
}

function attachTools(bubble, text) {
  const tools = document.createElement("div")
  tools.className = "ai-tools"
  
  const copyBtn = document.createElement("button")
  copyBtn.textContent = "📋 Copy"
  copyBtn.onclick = () => {
    const textOnly = text.replace(/```[\s\S]*?```/g, '[code block]')
    navigator.clipboard.writeText(textOnly)
    showApproval("✓", "Copied!")
  }
  
  const likeBtn = document.createElement("button")
  likeBtn.textContent = "👍"
  likeBtn.onclick = () => {
    showApproval("👍", "Thanks!")
  }
  
  const dislikeBtn = document.createElement("button")
  dislikeBtn.textContent = "👎"
  dislikeBtn.onclick = () => {
    showApproval("👎", "Noted")
  }
  
  tools.append(copyBtn, likeBtn, dislikeBtn)
  bubble.appendChild(tools)
}

async function sendMsg() {
  const text = input.value.trim()
  if (!text && uploadedFiles.length === 0) return
  
  const welcome = document.getElementById("welcomeMsg")
  if (welcome) welcome.remove()
  
  if (!currentChatId) {
    currentChatId = 'chat_' + Date.now()
    allChats[currentChatId] = {
      id: currentChatId,
      title: text.substring(0, 50) || 'File conversation',
      messages: [],
      timestamp: Date.now()
    }
  }
  
  let payload = text
  
  if (uploadedFiles.length > 0) {
    payload += '\n\n[Attached files: '
    payload += uploadedFiles.map(f => {
      if (f.content) {
        return `\n\n${f.name}:\n${f.content}`
      } else {
        return `${f.name} (${f.type || 'file'}, ${(f.size / 1024).toFixed(1)}KB)`
      }
    }).join(', ')
    payload += ']'
  }
  
  addMessageToUI(text || `📎 ${uploadedFiles.length} file(s) attached`, "user")
  input.value = ""
  autoResizeTextarea()
  resetFiles()
  
  const userMsg = { role: "user", content: payload }
  conversationHistory.push(userMsg)
  allChats[currentChatId].messages.push(userMsg)
  allChats[currentChatId].timestamp = Date.now()
  
  if (conversationHistory.length === 1) {
    allChats[currentChatId].title = text.substring(0, 50) || 'File conversation'
  }
  
  saveChatsToStorage()
  renderChatHistory()
  
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: payload,
        history: conversationHistory
      })
    })
    
    const data = await res.json()
    const reply = data.reply || "No response."
    
    addMessageToUI(reply, "ai")
    
    const aiMsg = { role: "assistant", content: reply }
    conversationHistory.push(aiMsg)
    allChats[currentChatId].messages.push(aiMsg)
    allChats[currentChatId].timestamp = Date.now()
    
    saveChatsToStorage()
    renderChatHistory()
    
  } catch (err) {
    console.error(err)
    addMessageToUI("Connection error.", "ai")
  }
}

function showApproval(icon, text) {
  const popup = document.getElementById("approvalPopup")
  const popupIcon = document.getElementById("popupIcon")
  const popupText = document.getElementById("popupText")
  
  popupIcon.textContent = icon
  popupText.textContent = text
  
  popup.classList.add("show")
  
  setTimeout(() => {
    popup.classList.remove("show")
  }, 1500)
}

send.onclick = sendMsg

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault()
    sendMsg()
  }
})
</script>
