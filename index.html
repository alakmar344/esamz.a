<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSAMz v7.2 – Voice & Intelligence</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        :root {
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --bg: #050505;
            --panel: rgba(23, 23, 23, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #e5e5e5;
            --text-dim: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); height: 100vh; overflow: hidden; }

        .app-container { display: flex; height: 100vh; }

        /* --- SIDEBAR --- */
        .sidebar { width: 280px; background: #0d0d0d; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; }
        .logo { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 40px; }

        .nav-group { margin-bottom: 30px; }
        .nav-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; display: block; }
        
        .side-btn { 
            width: 100%; padding: 12px 15px; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            color: #ccc; border-radius: 10px; cursor: pointer; text-align: left; margin-bottom: 10px; transition: 0.2s;
            display: flex; align-items: center; gap: 12px; font-size: 14px; text-decoration: none;
        }
        .side-btn:hover { background: rgba(255,255,255,0.07); border-color: var(--accent); color: white; }

        /* --- MAIN AREA --- */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; background: radial-gradient(circle at top right, #111, transparent); }

        #welcome-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        .feature-card { 
            background: var(--panel); border: 1px solid var(--border); padding: 24px; border-radius: 16px; 
            cursor: pointer; transition: 0.3s; text-align: left;
        }
        .feature-card:hover { border-color: var(--accent); transform: translateY(-4px); }

        #chat-flow { flex: 1; overflow-y: auto; padding: 40px 15%; display: none; scroll-behavior: smooth; }
        .msg { margin-bottom: 35px; animation: slideUp 0.4s ease-out; line-height: 1.7; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg.user { background: #1a1a1a; padding: 18px; border-radius: 16px 16px 0 16px; border: 1px solid var(--border); max-width: 80%; margin-left: auto; }
        .msg.ai { border-left: 3px solid var(--accent); padding-left: 25px; font-size: 16px; }

        /* FILE PREVIEW CHIP */
        #file-preview-area { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .file-chip { background: var(--accent); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; }

        /* INPUT AREA & VOICE SPICE */
        .input-area { padding: 20px 15% 40px 15%; }
        .input-box { 
            background: var(--panel); border: 1px solid var(--border); border-radius: 20px; 
            padding: 12px 20px; display: flex; flex-direction: column; backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .input-row { display: flex; align-items: flex-end; gap: 12px; }
        textarea { flex: 1; background: none; border: none; color: white; resize: none; outline: none; font-size: 16px; padding: 10px 0; max-height: 200px; }
        
        .btn-round { 
            width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--border); 
            background: rgba(255,255,255,0.05); color: var(--text-dim); cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .btn-round:hover { background: rgba(255,255,255,0.1); color: white; }
        .btn-round.active-mic { background: #ef4444 !important; color: white !important; animation: pulse 1.5s infinite; border: none; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .send-btn { background: var(--accent) !important; color: white !important; border: none !important; }

        /* CODE BLOCK SPICE */
        .code-wrapper { background: #000; border-radius: 12px; margin: 20px 0; border: 1px solid var(--border); overflow: hidden; }
        .code-header { background: #181818; padding: 12px 20px; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
        .copy-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="logo">eSAMz AI</div>
        
        <div class="nav-group">
            <span class="nav-label">Core</span>
            <button class="side-btn" onclick="location.reload()"><span>✦</span> New Session</button>
            <button class="side-btn" onclick="clearMem()"><span>🗑</span> Clear Cache</button>
            <button class="side-btn" onclick="exportData()"><span>📥</span> Export History</button>
        </div>

        <div class="nav-group">
            <span class="nav-label">Assets</span>
            <a href="/docs" class="side-btn"><span>📁</span> Documentation</a>
            <a href="https://esamz.site" class="side-btn"><span>🔗</span> Official Site</a>
        </div>
    </aside>

    <main class="main-content">
        <section id="welcome-screen">
            <h1 style="font-size: 36px; margin-bottom: 10px; font-weight: 800;">Command Center.</h1>
            <p style="color: var(--text-dim); margin-bottom: 40px; font-size: 18px;">How shall we innovate today?</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 700px;">
                <div class="feature-card" onclick="fill('Build a secure API endpoint in Node.js')">
                    <h4 style="color: var(--accent); margin-bottom: 8px;">Architecture</h4>
                    <p style="font-size: 13px; color: var(--text-dim);">Design high-performance code structures.</p>
                </div>
                <div class="feature-card" onclick="fill('Explain the latest trends in AI agents')">
                    <h4 style="color: #a855f7; margin-bottom: 8px;">Research</h4>
                    <p style="font-size: 13px; color: var(--text-dim);">Get summarized insights on any topic.</p>
                </div>
            </div>
        </section>

        <div id="chat-flow"></div>

        <div class="input-area">
            <div id="file-preview-area"></div>
            <div class="input-box">
                <div class="input-row">
                    <button class="btn-round" title="Attach File" onclick="document.getElementById('file-input').click()">+</button>
                    <input type="file" id="file-input" hidden multiple onchange="handleFile(this)">
                    
                    <button class="btn-round" id="mic-btn" title="Voice Input" onclick="toggleVoice()">🎤</button>
                    
                    <textarea id="userInput" placeholder="Ask eSAMz anything..." rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
                    
                    <button class="btn-round send-btn" onclick="handleSend()">↑</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const chat = document.getElementById('chat-flow');
    const welcome = document.getElementById('welcome-screen');
    const input = document.getElementById('userInput');
    const preview = document.getElementById('file-preview-area');
    const micBtn = document.getElementById('mic-btn');
    
    let attachedFiles = [];
    let recognition;

    // Load Session
    if(localStorage.getItem('esamz_v7_chat')) {
        welcome.style.display = 'none';
        chat.style.display = 'block';
        chat.innerHTML = localStorage.getItem('esamz_v7_chat');
        Prism.highlightAll();
    }

    // --- VOICE LOGIC ---
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => micBtn.classList.add('active-mic');
        recognition.onend = () => micBtn.classList.remove('active-mic');
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            input.value += transcript;
            input.style.height = input.scrollHeight + 'px';
        };
    }

    function toggleVoice() {
        if (!recognition) return alert("Speech recognition not supported in this browser.");
        recognition.start();
    }

    function fill(t) { input.value = t; input.focus(); }

    function handleFile(inputElement) {
        const files = Array.from(inputElement.files);
        files.forEach(file => {
            attachedFiles.push(file);
            const chip = document.createElement('div');
            chip.className = 'file-chip';
            chip.innerHTML = `${file.name} <span style="cursor:pointer; margin-left:5px" onclick="this.parentElement.remove()">×</span>`;
            preview.appendChild(chip);
        });
    }

    async function handleSend() {
        const text = input.value.trim();
        if(!text && attachedFiles.length === 0) return;

        welcome.style.display = 'none';
        chat.style.display = 'block';

        addMessage('user', text + (attachedFiles.length ? `\n\n*(Attached: ${attachedFiles.map(f => f.name).join(', ')})*` : ''));
        
        const formData = new FormData();
        formData.append('message', text);
        attachedFiles.forEach(f => formData.append('files', f));

        input.value = '';
        input.style.height = 'auto';
        preview.innerHTML = '';
        attachedFiles = [];

        try {
            const res = await fetch('/api/chat.js', { method: 'POST', body: formData });
            const data = await res.json();
            addMessage('ai', data.reply || data.message);
        } catch (e) {
            addMessage('ai', "System Error: Connection to backend failed.");
        }
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = marked.parse(text);
        chat.appendChild(div);

        if(role === 'ai') {
            div.querySelectorAll('pre').forEach(pre => {
                const w = document.createElement('div');
                w.className = 'code-wrapper';
                w.innerHTML = `<div class="code-header"><span>Terminal</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>`;
                pre.parentNode.insertBefore(w, pre);
                w.appendChild(pre);
            });
            Prism.highlightAllUnder(div);
        }
        chat.scrollTop = chat.scrollHeight;
        localStorage.setItem('esamz_v7_chat', chat.innerHTML);
    }

    function clearMem() { localStorage.removeItem('esamz_v7_chat'); location.reload(); }
    function copyCode(btn) {
        const code = btn.closest('.code-wrapper').querySelector('code').innerText;
        navigator.clipboard.writeText(code);
        btn.innerText = "Saved!";
        setTimeout(() => btn.innerText = "Copy", 2000);
    }
    function exportData() {
        const blob = new Blob([localStorage.getItem('esamz_v7_chat')], {type:'text/html'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'esamz-session.html';
        a.click();
    }

    input.addEventListener('keydown', (e) => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }});
</script>

</body>
</html>
