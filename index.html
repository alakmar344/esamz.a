<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eSAMz v7 - AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5}
.app{display:flex;height:100vh;position:relative;overflow:hidden}

.app::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 20% 50%, rgba(102,126,234,0.06) 0%, transparent 50%),radial-gradient(circle at 80% 80%, rgba(118,75,162,0.06) 0%, transparent 50%);animation:gradient 30s ease infinite;pointer-events:none;z-index:0;will-change:transform}

@keyframes gradient{0%,100%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(5%,5%) rotate(180deg)}}

.sidebar{width:300px;background:rgba(17,17,17,0.95);backdrop-filter:blur(10px);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;position:relative;z-index:10;transition:transform 0.3s ease}
.sidebar.collapsed{transform:translateX(-300px)}
.sidebar-toggle{position:absolute;right:-40px;top:20px;background:rgba(17,17,17,0.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06);border-radius:0 8px 8px 0;padding:10px 8px;cursor:pointer;color:#999;font-size:16px;transition:all 0.2s ease;z-index:11}
.sidebar.collapsed .sidebar-toggle{right:auto;left:100%}
.sidebar-toggle:hover{background:rgba(102,126,234,0.2);color:#667eea}
.menu-toggle{position:fixed;top:20px;left:20px;background:rgba(17,17,17,0.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;cursor:pointer;color:#999;font-size:16px;transition:all 0.2s ease;z-index:5;display:none}
.sidebar.collapsed ~ .main .menu-toggle{display:block}
.menu-toggle:hover{background:rgba(102,126,234,0.2);color:#667eea}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,0.06)}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.logo-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.logo-text{display:flex;flex-direction:column}
.logo-title{font-size:16px;font-weight:700;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-subtitle{font-size:10px;color:#999;font-weight:500}
.new-chat-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;cursor:pointer;font-weight:600;font-size:13px;transition:all 0.2s ease}
.new-chat-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(102,126,234,0.3)}
.new-chat-btn:active{transform:translateY(0)}
.chat-history{flex:1;overflow-y:auto;padding:12px}
.chat-history::-webkit-scrollbar{width:4px}
.chat-history::-webkit-scrollbar-track{background:transparent}
.chat-history::-webkit-scrollbar-thumb{background:rgba(102,126,234,0.3);border-radius:2px}
.history-section{margin-bottom:20px}
.history-label{font-size:10px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding:0 6px}
.history-item{display:flex;align-items:center;gap:8px;padding:10px;margin-bottom:2px;border-radius:8px;cursor:pointer;transition:background 0.2s ease}
.history-item:hover{background:rgba(102,126,234,0.1)}
.history-item.active{background:rgba(102,126,234,0.15);border:1px solid rgba(102,126,234,0.3)}
.history-icon{font-size:14px;opacity:0.8}
.history-content{flex:1;min-width:0}
.history-title{font-size:13px;font-weight:600;color:#e5e5e5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-time{font-size:10px;color:#999;margin-top:2px}
.history-delete{opacity:0;background:none;border:none;color:#999;font-size:14px;padding:4px;cursor:pointer;border-radius:4px;transition:opacity 0.2s ease}
.history-item:hover .history-delete{opacity:1}
.history-delete:hover{background:rgba(239,68,68,0.2);color:#ef4444}
.sidebar-links{padding:12px;border-top:1px solid rgba(255,255,255,0.06)}
.sidebar-links a{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#999;text-decoration:none;border-radius:6px;transition:background 0.2s ease;margin-bottom:2px;font-size:12px;font-weight:500}
.sidebar-links a:hover{background:rgba(102,126,234,0.1);color:#fff}
.sidebar-footer{padding:12px;font-size:10px;color:#666;border-top:1px solid rgba(255,255,255,0.06);text-align:center;line-height:1.5;background:rgba(0,0,0,0.2)}
.main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1}
.header{height:60px;background:rgba(17,17,17,0.95);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.header-title{font-size:16px;font-weight:600;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;gap:6px;align-items:center}
.header-btn{background:rgba(102,126,234,0.1);border:1px solid rgba(102,126,234,0.2);border-radius:6px;padding:6px 12px;color:#999;cursor:pointer;font-size:12px;font-weight:500;transition:all 0.2s ease}
.header-btn:hover{background:rgba(102,126,234,0.2);color:#667eea}
.chat{flex:1;padding:24px;overflow-y:auto;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-track{background:transparent}
.chat::-webkit-scrollbar-thumb{background:rgba(102,126,234,0.3);border-radius:3px}
.welcome{padding:48px 24px;margin-bottom:20px;border-radius:16px;background:linear-gradient(135deg,rgba(102,126,234,0.12),rgba(118,75,162,0.12));text-align:center;border:1px solid rgba(102,126,234,0.2)}
.welcome h2{font-size:28px;margin-bottom:10px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700}
.welcome p{font-size:14px;color:#999;font-weight:500;margin-bottom:20px}
.welcome-features{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.feature-card{background:rgba(17,17,17,0.6);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:12px 16px;min-width:120px;transition:all 0.2s ease}
.feature-card:hover{background:rgba(102,126,234,0.1);border-color:rgba(102,126,234,0.3)}
.feature-icon{font-size:20px;margin-bottom:6px}
.feature-text{font-size:12px;color:#999;font-weight:500}
.message{display:flex;margin-bottom:20px;gap:10px}
.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}
.message-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.message.user .message-avatar{background:linear-gradient(135deg,#667eea,#764ba2);order:2}
.message.ai .message-avatar{background:rgba(17,17,17,0.9);border:1px solid rgba(255,255,255,0.1)}
.bubble{max-width:70%;padding:12px 16px;border-radius:14px;white-space:pre-wrap;font-size:14px;line-height:1.5}
.user .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-bottom-right-radius:4px}
.ai .bubble{background:rgba(17,17,17,0.9);border:1px solid rgba(255,255,255,0.08);border-bottom-left-radius:4px}
.input-bar{padding:20px 24px;background:rgba(17,17,17,0.95);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,0.06)}
.files-container{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;max-height:150px;overflow-y:auto}
.files-container::-webkit-scrollbar{width:4px}
.files-container::-webkit-scrollbar-track{background:transparent}
.files-container::-webkit-scrollbar-thumb{background:rgba(102,126,234,0.3);border-radius:2px}
.file-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(102,126,234,0.15);border:1px solid rgba(102,126,234,0.3);border-radius:8px;color:#e5e5e5;font-size:12px}
.file-icon{display:flex;align-items:center;justify-content:center;width:24px;height:24px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:6px;font-size:10px;font-weight:700;color:white}
.file-info{display:flex;flex-direction:column;gap:2px}
.file-name{font-weight:600;font-size:12px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-type{font-size:9px;color:#999}
.file-remove{background:none;border:none;color:#999;font-size:14px;padding:2px;cursor:pointer;border-radius:4px;transition:all 0.2s ease}
.file-remove:hover{background:rgba(239,68,68,0.2);color:#ef4444}
.files-info{font-size:11px;color:#999;margin-bottom:8px;text-align:center}
.input-wrap{display:flex;gap:10px;background:rgba(26,26,26,0.8);border-radius:12px;padding:10px 12px;border:1px solid rgba(255,255,255,0.08);transition:all 0.2s ease;align-items:flex-end;position:relative}
.input-wrap:focus-within{border-color:rgba(102,126,234,0.5)}
.input-wrap.drag-over{border-color:rgba(102,126,234,0.8);background:rgba(102,126,234,0.1)}
textarea{flex:1;background:none;border:none;color:#e5e5e5;resize:none;outline:none;font-size:14px;font-family:inherit;line-height:1.4;max-height:120px}
textarea::placeholder{color:#666}
.file-btn,.voice-btn{background:none;border:none;color:#999;font-size:18px;padding:4px 6px;border-radius:6px;transition:all 0.2s ease;cursor:pointer}
.file-btn:hover,.voice-btn:hover{background:rgba(102,126,234,0.15);color:#667eea}
.voice-btn.recording{color:#ef4444;animation:recordPulse 1s ease infinite}
@keyframes recordPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.send-btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;border-radius:10px;color:white;padding:8px 20px;font-weight:600;font-size:13px;transition:all 0.2s ease;cursor:pointer}
.send-btn:hover:not(:disabled){transform:translateY(-1px)}
.send-btn:active:not(:disabled){transform:translateY(0)}
.send-btn:disabled{opacity:0.5;cursor:not-allowed}
.approval-popup{position:fixed;top:50%;left:50%;transform:translate(-50%, -50%) scale(0);background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:16px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:1000;opacity:0;transition:all 0.2s ease;display:flex;align-items:center;gap:10px}
.approval-popup.show{transform:translate(-50%, -50%) scale(1);opacity:1}
.approval-popup .icon{font-size:20px}
.clear-history-btn{width:100%;padding:8px;margin-top:6px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:6px;color:#ef4444;cursor:pointer;font-size:11px;font-weight:600;transition:all 0.2s ease}
.clear-history-btn:hover{background:rgba(239,68,68,0.2)}
.drag-drop-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(102,126,234,0.15);border:2px dashed rgba(102,126,234,0.6);border-radius:12px;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(8px);pointer-events:none}
.drag-drop-overlay.active{display:flex}
.drag-drop-icon{font-size:48px;margin-bottom:12px;animation:bounce 2s infinite}
.drag-drop-text{color:#667eea;font-size:16px;font-weight:600;text-align:center}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(max-width:768px){.sidebar{width:260px}.chat{padding:16px}.input-bar{padding:14px}.bubble{max-width:85%}.welcome{padding:32px 16px}.header-actions{flex-wrap:wrap}}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar-header">
    <div class="logo">
      <div class="logo-icon">e</div>
      <div class="logo-text">
        <div class="logo-title">eSAMz v7</div>
        <div class="logo-subtitle">AI Assistant</div>
      </div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
  </div>
  <div class="chat-history" id="chatHistory"></div>
  <div class="sidebar-links">
    <a href="https://esamz.info" target="_blank">🏠 Home</a>
    <a href="https://esamz.info/docs" target="_blank">📚 Docs</a>
    <a href="https://esamz.info/aboutus" target="_blank">ℹ️ About</a>
    <a href="https://esamz.info/privacypolicy" target="_blank">🔒 Privacy</a>
    <button class="clear-history-btn" onclick="clearAllHistory()">🗑️ Clear All</button>
  </div>
  <div class="sidebar-footer">© 2025 eSAMz<br>By Alakmar Teenwala</div>
</aside>

<main class="main">
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="header">
    <div class="header-title">eSAMz AI Assistant</div>
    <div class="header-actions">
      <button class="header-btn" onclick="exportChat()">📥 Export</button>
      <button class="header-btn" onclick="clearCurrentChat()">🗑️ Clear</button>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcomeMsg">
      <h2>Welcome to eSAMz v7</h2>
      <p>Your intelligent AI companion powered by Groq</p>
      <div class="welcome-features">
        <div class="feature-card"><div class="feature-icon">⚡</div><div class="feature-text">Lightning Fast</div></div>
        <div class="feature-card"><div class="feature-icon">🎤</div><div class="feature-text">Voice Input</div></div>
        <div class="feature-card"><div class="feature-icon">📎</div><div class="feature-text">Multi-File</div></div>
        <div class="feature-card"><div class="feature-icon">💾</div><div class="feature-text">Chat History</div></div>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <div class="files-container" id="filesContainer" style="display:none"></div>
    <div class="files-info" id="filesInfo" style="display:none"></div>
    <div class="input-wrap" id="inputWrap">
      <div class="drag-drop-overlay" id="dragDropOverlay">
        <div class="drag-drop-icon">📁</div>
        <div class="drag-drop-text">Drop files here to upload</div>
      </div>
      <input type="file" id="fileInput" style="display:none" accept=".txt,.js,.py,.java,.cpp,.c,.html,.css,.json,.xml,.md,.csv,.log,.sh,.bat,.yaml,.yml,.ts,.jsx,.tsx,.php,.rb,.go,.rs,.swift,.kt,.scala,.r,.sql,.pl,.lua,.dart,.vim,.ini,.cfg,.conf,.properties,audio/*,video/*" multiple>
      <button class="file-btn" onclick="document.getElementById('fileInput').click()">📎</button>
      <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
      <textarea id="input" placeholder="Type your message..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">Send</button>
    </div>
  </div>
</main>

</div>

<div class="approval-popup" id="approvalPopup">
  <span class="icon" id="popupIcon"></span>
  <span id="popupText"></span>
</div>

<script>
// ==================== STATE ====================
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const sidebar = document.getElementById("sidebar");
const chatHistory = document.getElementById("chatHistory");
const welcomeMsg = document.getElementById("welcomeMsg");
const filesContainer = document.getElementById("filesContainer");
const filesInfo = document.getElementById("filesInfo");
const fileInput = document.getElementById("fileInput");
const inputWrap = document.getElementById("inputWrap");
const dragDropOverlay = document.getElementById("dragDropOverlay");
const voiceBtn = document.getElementById("voiceBtn");
const approvalPopup = document.getElementById("approvalPopup");
const popupIcon = document.getElementById("popupIcon");
const popupText = document.getElementById("popupText");

let isLoading = false;
let currentChatId = null;
let uploadedFiles = [];
let recognition = null;
let isRecording = false;

// ==================== CHAT MANAGEMENT ====================
function loadChatHistory() {
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  chatHistory.innerHTML = "";
  
  if (history.length === 0) return;
  
  const today = [];
  const yesterday = [];
  const older = [];
  const now = Date.now();
  const dayMs = 86400000;
  
  history.forEach(item => {
    const age = now - item.timestamp;
    if (age < dayMs) today.push(item);
    else if (age < dayMs * 2) yesterday.push(item);
    else older.push(item);
  });
  
  if (today.length) renderHistorySection("Today", today);
  if (yesterday.length) renderHistorySection("Yesterday", yesterday);
  if (older.length) renderHistorySection("Older", older);
}

function renderHistorySection(label, items) {
  const section = document.createElement("div");
  section.className = "history-section";
  section.innerHTML = `<div class="history-label">${label}</div>`;
  
  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item" + (item.id === currentChatId ? " active" : "");
    div.innerHTML = `
      <div class="history-icon">💬</div>
      <div class="history-content">
        <div class="history-title">${item.title}</div>
        <div class="history-time">${new Date(item.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
      </div>
      <button class="history-delete" onclick="deleteChat('${item.id}'); event.stopPropagation()">×</button>
    `;
    div.onclick = () => loadChat(item.id);
    section.appendChild(div);
  });
  
  chatHistory.appendChild(section);
}

function saveCurrentChat() {
  if (!currentChatId) return;
  
  const messages = Array.from(chat.querySelectorAll(".message")).map(msg => ({
    role: msg.classList.contains("user") ? "user" : "ai",
    text: msg.querySelector(".bubble").textContent
  }));
  
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  const idx = history.findIndex(h => h.id === currentChatId);
  
  if (idx >= 0) {
    history[idx].messages = messages;
    history[idx].timestamp = Date.now();
  }
  
  localStorage.setItem("chatHistory", JSON.stringify(history));
}

function loadChat(id) {
  saveCurrentChat();
  currentChatId = id;
  
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  const chatData = history.find(h => h.id === id);
  
  if (!chatData) return;
  
  chat.innerHTML = "";
  welcomeMsg.style.display = "none";
  
  chatData.messages.forEach(msg => addMessage(msg.text, msg.role));
  loadChatHistory();
}

function deleteChat(id) {
  let history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  history = history.filter(h => h.id !== id);
  localStorage.setItem("chatHistory", JSON.stringify(history));
  
  if (currentChatId === id) {
    newChat();
  }
  loadChatHistory();
}

function newChat() {
  saveCurrentChat();
  currentChatId = "chat_" + Date.now();
  
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  history.unshift({
    id: currentChatId,
    title: "New Chat",
    timestamp: Date.now(),
    messages: []
  });
  localStorage.setItem("chatHistory", JSON.stringify(history));
  
  chat.innerHTML = "";
  welcomeMsg.style.display = "block";
  chat.appendChild(welcomeMsg);
  uploadedFiles = [];
  filesContainer.style.display = "none";
  filesInfo.style.display = "none";
  filesContainer.innerHTML = "";
  
  loadChatHistory();
}

function clearCurrentChat() {
  if (confirm("Clear this chat?")) {
    chat.innerHTML = "";
    welcomeMsg.style.display = "block";
    chat.appendChild(welcomeMsg);
    
    if (currentChatId) {
      const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
      const idx = history.findIndex(h => h.id === currentChatId);
      if (idx >= 0) {
        history[idx].messages = [];
        localStorage.setItem("chatHistory", JSON.stringify(history));
      }
    }
    
    uploadedFiles = [];
    filesContainer.style.display = "none";
    filesInfo.style.display = "none";
    filesContainer.innerHTML = "";
  }
}

function clearAllHistory() {
  if (confirm("Delete all chat history?")) {
    localStorage.removeItem("chatHistory");
    newChat();
    showApproval("🗑️", "All chats cleared");
  }
}

function exportChat() {
  const messages = Array.from(chat.querySelectorAll(".message")).map(msg => {
    const role = msg.classList.contains("user") ? "User" : "AI";
    const text = msg.querySelector(".bubble").textContent;
    return `${role}: ${text}`;
  }).join("\n\n");
  
  if (!messages) {
    showApproval("⚠️", "No messages to export");
    return;
  }
  
  const blob = new Blob([messages], {type: "text/plain"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `esamz_chat_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showApproval("✅", "Chat exported");
}

// ==================== UI FUNCTIONS ====================
function addMessage(text, role) {
  welcomeMsg.style.display = "none";
  
  const msg = document.createElement("div");
  msg.className = "message " + role;
  
  const avatar = document.createElement("div");
  avatar.className = "message-avatar";
  avatar.textContent = role === "user" ? "👤" : "🤖";
  
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
  
  saveCurrentChat();
}

function addLoading() {
  const msg = document.createElement("div");
  msg.className = "message ai";
  msg.id = "loading";
  
  const avatar = document.createElement("div");
  avatar.className = "message-avatar";
  avatar.textContent = "🤖";
  
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = "Thinking...";
  
  msg.appendChild(avatar);
  msg.appendChild(bubble);
  chat.appendChild(msg);
  chat.scrollTop = chat.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById("loading");
  if (el) el.remove();
}

function showApproval(icon, text) {
  popupIcon.textContent = icon;
  popupText.textContent = text;
  approvalPopup.classList.add("show");
  setTimeout(() => approvalPopup.classList.remove("show"), 2000);
}

function toggleSidebar() {
  sidebar.classList.toggle("collapsed");
}

// ==================== MESSAGE SENDING ====================
async function sendMessage() {
  const text = input.value.trim();
  if (!text || isLoading) return;
  
  if (!currentChatId) newChat();
  
  isLoading = true;
  sendBtn.disabled = true;
  input.value = "";
  
  // Update chat title with first message
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  const chatData = history.find(h => h.id === currentChatId);
  if (chatData && chatData.title === "New Chat") {
    chatData.title = text.slice(0, 30) + (text.length > 30 ? "..." : "");
    localStorage.setItem("chatHistory", JSON.stringify(history));
    loadChatHistory();
  }
  
  addMessage(text, "user");
  addLoading();
  
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
            headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        files: uploadedFiles.map(f => ({ name: f.name, type: f.type, size: f.size }))
      })
    });

    const data = await res.json();
    removeLoading();
    addMessage(data.reply, "ai");
  } catch (err) {
    removeLoading();
    addMessage("Sorry, something went wrong. Please try again.", "ai");
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
  }
}

// ==================== FILE UPLOAD ====================
fileInput.addEventListener("change", e => handleFiles(e.target.files));

function handleFiles(files) {
  const validFiles = Array.from(files).slice(0, 10); // Max 10 files
  uploadedFiles = [...uploadedFiles, ...validFiles];
  renderFiles();
}

function renderFiles() {
  if (uploadedFiles.length === 0) {
    filesContainer.style.display = "none";
    filesInfo.style.display = "none";
    return;
  }

  filesContainer.style.display = "flex";
  filesInfo.style.display = "block";
  filesInfo.textContent = `${uploadedFiles.length} file(s) attached`;

  filesContainer.innerHTML = "";
  uploadedFiles.forEach((file, idx) => {
    const badge = document.createElement("div");
    badge.className = "file-badge";
    badge.innerHTML = `
      <div class="file-icon">${file.type.startsWith("audio") ? "🎵" : file.type.startsWith("video") ? "🎬" : "📄"}</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
        <div class="file-type">${(file.size / 1024).toFixed(1)} KB</div>
      </div>
      <button class="file-remove" onclick="removeFile(${idx})">×</button>
    `;
    filesContainer.appendChild(badge);
  });
}

function removeFile(index) {
  uploadedFiles.splice(index, 1);
  renderFiles();
}

// ==================== DRAG & DROP ====================
["dragenter", "dragover", "dragleave", "drop"].forEach(evt => {
  inputWrap.addEventListener(evt, preventDefaults, false);
});

function preventDefaults(e) {
  e.preventDefault();
  e.stopPropagation();
}

["dragenter", "dragover"].forEach(evt => {
  inputWrap.addEventListener(evt, () => {
    dragDropOverlay.classList.add("active");
    inputWrap.classList.add("drag-over");
  }, false);
});

["dragleave", "drop"].forEach(evt => {
  inputWrap.addEventListener(evt, () => {
    dragDropOverlay.classList.remove("active");
    inputWrap.classList.remove("drag-over");
  }, false);
});

inputWrap.addEventListener("drop", e => {
  handleFiles(e.dataTransfer.files);
}, false);

// ==================== VOICE INPUT ====================
if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = e => {
    const transcript = e.results[0][0].transcript;
    input.value += transcript;
    input.focus();
  };

  recognition.onerror = () => {
    showApproval("⚠️", "Voice input failed");
    voiceBtn.classList.remove("recording");
    isRecording = false;
  };

  recognition.onend = () => {
    voiceBtn.classList.remove("recording");
    isRecording = false;
  };
}

function toggleVoice() {
  if (!recognition) {
    showApproval("🚫", "Voice input not supported");
    return;
  }

  if (isRecording) {
    recognition.stop();
    voiceBtn.classList.remove("recording");
    isRecording = false;
  } else {
    recognition.start();
    voiceBtn.classList.add("recording");
    isRecording = true;
  }
}

// ==================== EVENT LISTENERS ====================
sendBtn.addEventListener("click", sendMessage);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ==================== INIT ====================
loadChatHistory();
if (!currentChatId) newChat();
</script>
</body>
