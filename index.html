<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookit Voice | Hands-Free Cooking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f97316;
            --bg-dark: #0f172a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark);
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, rgba(249, 115, 22, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(249, 115, 22, 0.08) 0px, transparent 50%);
            filter: blur(60px);
        }

        /* Voice Overlay */
        .voice-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease;
        }

        .voice-overlay.active { opacity: 1; visibility: visible; }

        .orb-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .voice-orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.4);
        }

        .voice-orb:active { transform: scale(0.95); }
        .voice-orb.listening {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.4);
            animation: pulse-green 1.5s ease-out infinite;
        }
        .voice-orb.speaking {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.4);
            animation: pulse-blue 1s ease-out infinite;
        }
        .voice-orb.processing {
            background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
            animation: spin 1s linear infinite;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7), 0 0 40px rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0), 0 0 60px rgba(16, 185, 129, 0.6); }
        }
        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7), 0 0 40px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 0 15px rgba(59, 130, 246, 0), 0 0 60px rgba(59, 130, 246, 0.6); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orb-icon {
            font-size: 48px;
            line-height: 1;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            pointer-events: none;
        }

        .voice-status {
            margin-top: 2rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
            text-align: center;
        }

        .voice-command {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #64748b;
            text-align: center;
            min-height: 1.5em;
            font-style: italic;
            padding: 0 2rem;
        }

        .phase-indicator {
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(255,255,255,0.1);
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .phase-indicator.ingredients { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: rgba(16, 185, 129, 0.3); }
        .phase-indicator.cooking { background: rgba(249, 115, 22, 0.2); color: #f97316; border-color: rgba(249, 115, 22, 0.3); }

        .hint-pills {
            position: absolute;
            bottom: 3rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 1rem;
        }
        .hint-pill {
            padding: 0.375rem 0.875rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 9999px;
            font-size: 0.75rem;
            color: #64748b;
        }
        .hint-pill.active {
            background: rgba(249, 115, 22, 0.2);
            border-color: rgba(249, 115, 22, 0.5);
            color: #f97316;
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.1); color: white; }

        /* Layout */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 300px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 1.5rem;
        }
        .sidebar.open { transform: translateX(0); }

        .main-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: margin-left 0.3s ease;
            position: relative;
        }
        .main-content.sidebar-open { margin-left: 300px; }

        .top-bar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            padding-bottom: 120px;
        }

        /* FIXED: Input Area */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 1.5rem 1.5rem;
            background: linear-gradient(to top, #0f172a 0%, #0f172a 70%, transparent 100%);
            z-index: 50;
            pointer-events: none;
        }

        .input-box {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            gap: 0.75rem;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(20px);
            padding: 0.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: auto;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 0.75rem 1rem;
            font-size: 1rem;
        }
        .input-box input::placeholder { color: #64748b; }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 0.75rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        .icon-btn.primary { background: #f97316; color: white; border-color: #f97316; }
        .icon-btn.primary:hover { background: #ea580c; }

        .menu-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 200;
            width: 44px;
            height: 44px;
            background: #f97316;
            border: none;
            border-radius: 0.75rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
        }

        /* Recipe Styling with DYNAMIC highlighting */
        .recipe-step {
            background: rgba(30, 41, 59, 0.4);
            border: 2px solid transparent;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .recipe-step.current {
            border-color: #f97316;
            background: rgba(249, 115, 22, 0.15);
            box-shadow: 0 0 30px rgba(249, 115, 22, 0.2);
            transform: scale(1.02);
        }

        .recipe-step.completed {
            opacity: 0.5;
            border-color: rgba(34, 197, 94, 0.3);
            background: rgba(34, 197, 94, 0.05);
        }

        /* DYNAMIC WORD HIGHLIGHTING */
        .word {
            display: inline;
            transition: all 0.15s ease;
            border-radius: 0.25rem;
            padding: 0.1rem 0.2rem;
            margin: -0.1rem -0.2rem;
        }

        .word.active {
            background: rgba(249, 115, 22, 0.4);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.3);
        }

        .word.spoken {
            color: rgba(255, 255, 255, 0.6);
        }

        .ingredient-tag {
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.2);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
            cursor: pointer;
        }
        .ingredient-tag:hover { background: rgba(249, 115, 22, 0.2); }
        
        .ingredient-tag.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .ingredient-tag .word.active {
            background: rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.3);
        }

        /* Last Step Visibility */
        .recipe-step:last-child {
            margin-bottom: 3rem;
        }
        .recipe-step:last-child.current {
            border-color: #22c55e;
            background: rgba(34, 197, 94, 0.15);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
        }

        /* Print Styles */
        @media print {
            body { overflow: visible; background: white; color: black; }
            .voice-overlay, .sidebar, .menu-btn, .input-area, .top-bar { display: none !important; }
            .main-content { margin: 0 !important; height: auto; }
            .content-area { padding: 0; overflow: visible; }
            .recipe-step { 
                break-inside: avoid; 
                background: white !important; 
                border: 1px solid #ddd !important;
                color: black !important;
            }
            .ingredient-tag { 
                background: white !important; 
                border: 1px solid #ddd !important;
                color: black !important;
            }
            .word { background: transparent !important; color: black !important; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { width: 100%; }
            .main-content.sidebar-open { margin-left: 0; }
            .content-area { padding: 1rem; padding-bottom: 100px; }
        }

        /* Toast */
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.3s ease; }
    </style>
</head>
<body>
    <div class="bg-mesh"></div>

    <!-- Voice Overlay -->
    <div class="voice-overlay" id="voiceOverlay">
        <button class="close-btn" onclick="toggleVoiceMode()">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <div class="orb-container">
            <div class="voice-orb" id="voiceOrb" onclick="handleOrbClick()">
                <span class="orb-icon" id="orbIcon">🎙️</span>
            </div>
        </div>

        <div class="voice-status" id="voiceStatus">Tap orb to start</div>
        <div class="voice-command" id="voiceCommand">Waiting for command...</div>
        
        <div class="phase-indicator" id="phaseIndicator">Ready</div>

        <div class="hint-pills" id="hintPills">
            <span class="hint-pill">"Make pasta"</span>
            <span class="hint-pill">"Start cooking"</span>
            <span class="hint-pill">"Next"</span>
        </div>
    </div>

    <!-- Menu Button -->
    <button class="menu-btn" onclick="toggleSidebar()">
        <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-red-600 rounded-lg flex items-center justify-center text-xl">🍳</div>
            <div>
                <h1 class="text-xl font-bold text-white">Cookit</h1>
                <p class="text-xs text-orange-400 font-semibold uppercase tracking-wider">Voice First</p>
            </div>
        </div>

        <button onclick="newRecipe()" class="w-full py-3 mb-3 bg-orange-600 hover:bg-orange-500 text-white rounded-xl font-semibold transition-colors flex items-center justify-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            New Recipe
        </button>

        <button onclick="toggleVoiceMode()" class="w-full py-3 mb-6 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold transition-colors flex items-center justify-center gap-2">
            <i data-lucide="mic" class="w-4 h-4"></i>
            Voice Mode
        </button>

        <p class="text-xs text-slate-500 uppercase tracking-wider mb-3 font-semibold">Saved Recipes</p>
        <div class="space-y-2" id="cookbookList"></div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <div class="flex items-center gap-3">
                <button onclick="toggleVoiceMode()" class="flex items-center gap-2 px-4 py-2 bg-blue-600/20 text-blue-400 rounded-lg text-sm font-medium hover:bg-blue-600/30 transition-colors">
                    <i data-lucide="mic" class="w-4 h-4"></i>
                    Voice Cook
                </button>
            </div>
            <div class="flex items-center gap-2" id="recipeActions" style="display: none;">
                <button onclick="printRecipe()" class="flex items-center gap-2 px-4 py-2 bg-slate-700/50 hover:bg-slate-600/50 text-slate-300 rounded-lg text-sm font-medium transition-colors">
                    <i data-lucide="printer" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Print</span>
                </button>
                <button onclick="saveRecipe()" class="flex items-center gap-2 px-4 py-2 bg-orange-600/20 text-orange-400 hover:bg-orange-600/30 rounded-lg text-sm font-medium transition-colors">
                    <i data-lucide="bookmark" class="w-4 h-4"></i>
                    Save
                </button>
            </div>
        </div>

        <div class="content-area" id="contentArea">
            <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center">
                <div class="w-24 h-24 mb-6 bg-gradient-to-br from-slate-800 to-slate-900 rounded-full flex items-center justify-center text-4xl border border-white/10 shadow-2xl cursor-pointer hover:scale-105 transition-transform" onclick="toggleVoiceMode()">
                    🎙️
                </div>
                <h2 class="text-4xl font-serif font-bold text-white mb-3">Cook Hands-Free</h2>
                <p class="text-slate-400 mb-8 max-w-md">Just say what you want to cook. No typing needed.</p>
                <button onclick="toggleVoiceMode()" class="px-8 py-4 bg-orange-600 hover:bg-orange-500 text-white rounded-2xl font-bold text-lg transition-all flex items-center gap-3 shadow-lg shadow-orange-600/25">
                    <i data-lucide="mic" class="w-6 h-6"></i>
                    Start Voice Mode
                </button>
            </div>

            <div id="recipeDisplay" style="display: none; max-width: 800px; margin: 0 auto;">
                <div class="mb-8">
                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-orange-500/10 text-orange-400 text-xs font-semibold uppercase tracking-wider mb-4">
                        <i data-lucide="sparkles" class="w-3 h-3"></i>
                        AI Generated
                    </span>
                    <h1 id="recipeTitle" class="text-3xl md:text-4xl font-serif font-bold text-white mb-3"></h1>
                    <div class="flex gap-4 text-sm text-slate-400">
                        <span class="flex items-center gap-1"><i data-lucide="clock" class="w-4 h-4"></i><span id="recipeTime"></span></span>
                        <span class="flex items-center gap-1"><i data-lucide="flame" class="w-4 h-4"></i><span id="recipeDifficulty"></span></span>
                        <span class="flex items-center gap-1"><i data-lucide="users" class="w-4 h-4"></i><span id="recipeServings"></span></span>
                    </div>
                </div>

                <div class="bg-slate-800/50 rounded-2xl p-6 mb-6 border border-white/5">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-orange-400 font-bold uppercase text-xs tracking-wider flex items-center gap-2">
                            <i data-lucide="shopping-basket" class="w-4 h-4"></i>
                            Ingredients
                        </h3>
                        <span class="text-xs text-slate-500" id="ingredientCount"></span>
                    </div>
                    <div id="ingredientsList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>

                <div>
                    <h3 class="text-orange-400 font-bold uppercase text-xs tracking-wider mb-4 flex items-center gap-2">
                        <i data-lucide="list-ordered" class="w-4 h-4"></i>
                        Instructions
                    </h3>
                    <div id="stepsList"></div>
                </div>

                <div id="completionMessage" class="hidden mt-8 p-6 bg-green-500/10 border border-green-500/20 rounded-2xl text-center">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-green-500/20 flex items-center justify-center text-3xl">🎉</div>
                    <h3 class="text-xl font-bold text-white mb-2">All Done!</h3>
                    <p class="text-slate-400">Your dish is ready to enjoy. Great cooking!</p>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-box">
                <button class="icon-btn" onclick="toggleVoiceMode()" title="Voice Input">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </button>
                <input type="text" id="textInput" placeholder="What do you want to cook? (or click mic to speak)" onkeypress="handleKeyPress(event)">
                <button class="icon-btn primary" onclick="processTextInput()" id="sendBtn">
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // State
        let currentRecipe = null;
        let sidebarOpen = false;
        let voiceActive = false;
        let cookbook = [];
        
        // Voice State
        const PHASES = { IDLE: 'idle', SEARCH: 'search', INGREDIENTS: 'ingredients', STEPS: 'steps', DONE: 'done' };
        let currentPhase = PHASES.IDLE;
        let currentIndex = 0;
        let isSpeaking = false;
        let recognition = null;
        let synth = window.speechSynthesis;
        
        // Word highlighting state
        let currentWordInterval = null;
        let wordsArray = [];
        let currentWordIndex = 0;

        // Load cookbook
        function loadCookbook() {
            const saved = localStorage.getItem('cookit_cookbook');
            if (saved) {
                cookbook = JSON.parse(saved);
                renderCookbook();
            }
        }

        window.onload = () => {
            lucide.createIcons();
            loadCookbook();
            initSpeech();
        };

        function initSpeech() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.lang = 'en-US';
                recognition.maxAlternatives = 1;
                
                recognition.onstart = () => {
                    updateOrbState('listening');
                    updateStatus('Listening...', 'Speak now');
                };
                
                recognition.onresult = (e) => {
                    const results = e.results;
                    if (!results.length) return;
                    const transcript = results[results.length - 1][0].transcript;
                    updateCommand(transcript);
                    if (results[results.length - 1].isFinal) {
                        processVoiceCommand(transcript.toLowerCase().trim());
                    }
                };
                
                recognition.onerror = (e) => {
                    if (e.error !== 'aborted' && voiceActive) {
                        setTimeout(() => startListening(), 200);
                    }
                };
                
                recognition.onend = () => {
                    if (voiceActive && !isSpeaking) startListening();
                };
            }
        }

        function toggleVoiceMode() {
            voiceActive = !voiceActive;
            const overlay = document.getElementById('voiceOverlay');
            
            if (voiceActive) {
                overlay.classList.add('active');
                resetVoiceState();
                if (currentRecipe) {
                    speak(`Voice mode on. Say "start cooking" for ${currentRecipe.title}, or tell me what else to cook.`);
                } else {
                    speak("Voice mode on. What would you like to cook?");
                    updatePhase(PHASES.SEARCH);
                }
                setTimeout(() => startListening(), 1500);
            } else {
                overlay.classList.remove('active');
                stopListening();
                stopSpeaking();
                clearWordHighlight();
            }
        }

        function resetVoiceState() {
            currentPhase = PHASES.IDLE;
            currentIndex = 0;
            isSpeaking = false;
            updatePhase(PHASES.IDLE);
            updateHints(['"Make pasta"', '"Start cooking"', '"Next"']);
            clearWordHighlight();
            document.querySelectorAll('.recipe-step').forEach(el => el.classList.remove('current', 'completed'));
            document.querySelectorAll('.ingredient-tag').forEach(el => el.classList.remove('active'));
        }

        function clearWordHighlight() {
            if (currentWordInterval) {
                clearInterval(currentWordInterval);
                currentWordInterval = null;
            }
            document.querySelectorAll('.word.active').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.word.spoken').forEach(el => el.classList.remove('spoken'));
            wordsArray = [];
            currentWordIndex = 0;
        }

        function startListening() {
            if (!recognition || isSpeaking) return;
            try { recognition.start(); } catch (e) {}
        }

        function stopListening() {
            if (!recognition) return;
            try { recognition.abort(); } catch (e) {}
        }

        function updateOrbState(state) {
            const orb = document.getElementById('voiceOrb');
            const icon = document.getElementById('orbIcon');
            orb.className = 'voice-orb ' + state;
            switch(state) {
                case 'listening': icon.textContent = '👂'; break;
                case 'speaking': icon.textContent = '🔊'; break;
                case 'processing': icon.textContent = '⚡'; break;
                default: icon.textContent = '🎙️';
            }
        }

        function updateStatus(main, sub) {
            document.getElementById('voiceStatus').textContent = main;
            document.getElementById('voiceCommand').textContent = sub;
        }

        function updateCommand(text) {
            document.getElementById('voiceCommand').textContent = `"${text}"`;
        }

        function updatePhase(phase) {
            currentPhase = phase;
            const indicator = document.getElementById('phaseIndicator');
            switch(phase) {
                case PHASES.IDLE: indicator.textContent = 'Ready'; indicator.className = 'phase-indicator'; break;
                case PHASES.SEARCH: indicator.textContent = 'Recipe Search'; indicator.className = 'phase-indicator'; break;
                case PHASES.INGREDIENTS: 
                    indicator.textContent = `Ingredients (${currentIndex + 1}/${currentRecipe?.ingredients?.length || 0})`; 
                    indicator.className = 'phase-indicator ingredients'; 
                    break;
                case PHASES.STEPS: 
                    indicator.textContent = `Cooking (${currentIndex + 1}/${currentRecipe?.steps?.length || 0})`; 
                    indicator.className = 'phase-indicator cooking'; 
                    break;
                case PHASES.DONE: indicator.textContent = 'Completed!'; indicator.className = 'phase-indicator ingredients'; break;
            }
        }

        function updateHints(hints) {
            document.getElementById('hintPills').innerHTML = hints.map(h => `<span class="hint-pill">${h}</span>`).join('');
        }

        function handleOrbClick() {
            if (isSpeaking) {
                stopSpeaking();
                setTimeout(() => startListening(), 300);
            } else {
                startListening();
            }
        }

        // Command Processing
        function processVoiceCommand(cmd) {
            if (cmd.includes('stop') || cmd.includes('exit')) {
                speak('Closing voice mode');
                setTimeout(() => toggleVoiceMode(), 800);
                return;
            }
            if (cmd.includes('help')) {
                speak('Say: make, start, next, previous, repeat, or stop');
                return;
            }
            
            switch(currentPhase) {
                case PHASES.IDLE:
                case PHASES.SEARCH:
                    if (cmd.includes('start') && currentRecipe) {
                        startCooking();
                    } else {
                        const searchTerm = cmd.replace(/make|cook|prepare|recipe|how do i|can i|i want|a|an|some/g, '').trim();
                        if (searchTerm && searchTerm.length > 2) {
                            searchRecipe(searchTerm);
                        } else if (!currentRecipe) {
                            speak('What would you like to cook?');
                        }
                    }
                    break;
                case PHASES.INGREDIENTS:
                    if (cmd.match(/next|ok|done|got it/)) nextIngredient();
                    else if (cmd.match(/skip|start cooking|step/)) finishIngredients();
                    else if (cmd.match(/previous|back/)) prevIngredient();
                    else if (cmd.match(/repeat|again/)) readCurrentIngredient();
                    break;
                case PHASES.STEPS:
                    if (cmd.match(/next|ok|done|finished/)) nextStep();
                    else if (cmd.match(/previous|back/)) prevStep();
                    else if (cmd.match(/repeat|again/)) readCurrentStep();
                    break;
                case PHASES.DONE:
                    if (cmd.match(/again|restart/)) startCooking();
                    break;
            }
        }

        // Cooking Flow with Word Highlighting
        function startCooking() {
            if (!currentRecipe) return;
            updateHints(['"Next"', '"Repeat"', '"Skip"']);
            currentIndex = 0;
            updatePhase(PHASES.INGREDIENTS);
            speak(`Let's make ${currentRecipe.title}. ${currentRecipe.ingredients.length} ingredients. Say "next" for each one.`);
            setTimeout(() => {
                highlightIngredient(0);
                readCurrentIngredient();
            }, 3500);
        }

        function readCurrentIngredient() {
            if (!currentRecipe?.ingredients) return;
            if (currentIndex >= currentRecipe.ingredients.length) {
                finishIngredients();
                return;
            }
            const ingText = currentRecipe.ingredients[currentIndex];
            const isLast = currentIndex === currentRecipe.ingredients.length - 1;
            highlightIngredient(currentIndex);
            updatePhase(PHASES.INGREDIENTS);
            
            if (isLast) {
                speakWithHighlight(`ing-${currentIndex}`, `${ingText}. Last ingredient! Say "start cooking" to begin.`);
            } else {
                speakWithHighlight(`ing-${currentIndex}`, `${ingText}.`);
            }
        }

        function nextIngredient() {
            currentIndex++;
            readCurrentIngredient();
        }

        function prevIngredient() {
            if (currentIndex > 0) {
                currentIndex--;
                readCurrentIngredient();
            }
        }

        function finishIngredients() {
            currentIndex = 0;
            updatePhase(PHASES.STEPS);
            updateHints(['"Next"', '"Repeat"', '"Back"']);
            document.querySelectorAll('.ingredient-tag').forEach(el => el.classList.remove('active'));
            clearWordHighlight();
            speak('All ingredients ready! Let us start cooking. Say "next" for the first step.');
            setTimeout(() => {
                highlightStep(0);
                readCurrentStep();
            }, 2500);
        }

        function readCurrentStep() {
            if (!currentRecipe?.steps) return;
            if (currentIndex >= currentRecipe.steps.length) {
                finishCooking();
                return;
            }
            const stepText = currentRecipe.steps[currentIndex];
            highlightStep(currentIndex);
            updatePhase(PHASES.STEPS);
            const isLast = currentIndex === currentRecipe.steps.length - 1;
            if (isLast) {
                speakWithHighlight(`step-${currentIndex}`, `Final step ${currentIndex + 1}. ${stepText}. Say "next" when complete!`);
            } else {
                speakWithHighlight(`step-${currentIndex}`, `Step ${currentIndex + 1}. ${stepText}.`);
            }
        }

        function nextStep() {
            clearWordHighlight();
            const stepEl = document.getElementById(`step-${currentIndex}`);
            if (stepEl) stepEl.classList.add('completed');
            currentIndex++;
            readCurrentStep();
        }

        function prevStep() {
            if (currentIndex > 0) {
                clearWordHighlight();
                const prevEl = document.getElementById(`step-${currentIndex - 1}`);
                if (prevEl) prevEl.classList.remove('completed');
                currentIndex--;
                readCurrentStep();
            }
        }

        function finishCooking() {
            updatePhase(PHASES.DONE);
            updateHints(['"Again"', '"Exit"']);
            updateStatus('Completed!', 'Enjoy your meal');
            document.getElementById('completionMessage').classList.remove('hidden');
            document.getElementById('completionMessage').scrollIntoView({ behavior: 'smooth', block: 'center' });
            speak('Congratulations! Your dish is ready. Enjoy!');
        }

        // ENHANCED: TTS with Word-by-Word Highlighting
        function speakWithHighlight(elementId, text) {
            if (!synth) return;
            stopListening();
            clearWordHighlight();
            
            // Prepare words in the element
            const element = document.getElementById(elementId);
            if (!element) {
                // Fallback to regular speak if element not found
                speak(text);
                return;
            }
            
            // Split text into words and wrap in spans
            const words = text.split(/(\s+|[,.!?;])/g).filter(w => w.length > 0);
            let htmlContent = '';
            words.forEach((word, idx) => {
                if (word.match(/^\s+$/)) {
                    htmlContent += word;
                } else {
                    htmlContent += `<span class="word" data-index="${idx}">${word}</span>`;
                }
            });
            
            // Update element with word spans
            const textContainer = element.querySelector('p') || element;
            const originalText = textContainer.innerHTML;
            textContainer.innerHTML = htmlContent;
            
            // Get all word spans
            wordsArray = Array.from(textContainer.querySelectorAll('.word'));
            currentWordIndex = 0;
            
            // Create utterance
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 0.9;
            utter.pitch = 1;
            utter.volume = 1;
            
            const voices = synth.getVoices();
            const voice = voices.find(v => v.name.includes('Google US English')) || 
                        voices.find(v => v.name.includes('Samantha')) ||
                        voices.find(v => v.lang === 'en-US');
            if (voice) utter.voice = voice;
            
            // Calculate word timing based on text length and speech rate
            const baseDelay = 250; // ms per word approximation
            
            utter.onstart = () => {
                isSpeaking = true;
                updateOrbState('speaking');
                updateStatus('Speaking...', '');
                
                // Start word highlighting interval
                let wordIdx = 0;
                currentWordInterval = setInterval(() => {
                    if (wordIdx < wordsArray.length) {
                        // Remove previous active
                        if (wordIdx > 0 && wordsArray[wordIdx - 1]) {
                            wordsArray[wordIdx - 1].classList.remove('active');
                            wordsArray[wordIdx - 1].classList.add('spoken');
                        }
                        // Add active to current
                        if (wordsArray[wordIdx]) {
                            wordsArray[wordIdx].classList.add('active');
                            wordsArray[wordIdx].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                        wordIdx++;
                    }
                }, baseDelay);
            };
            
            utter.onend = () => {
                isSpeaking = false;
                updateOrbState('idle');
                clearInterval(currentWordInterval);
                
                // Mark all as spoken
                wordsArray.forEach(w => {
                    w.classList.remove('active');
                    w.classList.add('spoken');
                });
                
                if (voiceActive) startListening();
            };
            
            utter.onerror = () => {
                isSpeaking = false;
                clearInterval(currentWordInterval);
                if (voiceActive) startListening();
            };
            
            synth.speak(utter);
        }

        function speak(text) {
            if (!synth) return;
            stopListening();
            
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 0.95;
            utter.pitch = 1;
            utter.volume = 1;
            
            const voices = synth.getVoices();
            const voice = voices.find(v => v.name.includes('Google US English')) || 
                        voices.find(v => v.name.includes('Samantha')) ||
                        voices.find(v => v.lang === 'en-US');
            if (voice) utter.voice = voice;
            
            utter.onstart = () => {
                isSpeaking = true;
                updateOrbState('speaking');
                updateStatus('Speaking...', '');
            };
            
            utter.onend = () => {
                isSpeaking = false;
                updateOrbState('idle');
                if (voiceActive) startListening();
            };
            
            synth.speak(utter);
        }

        function stopSpeaking() {
            synth.cancel();
            isSpeaking = false;
            clearInterval(currentWordInterval);
        }

        // Recipe Management
        async function searchRecipe(query) {
            updateOrbState('processing');
            updateStatus('Finding recipe...', query);
            stopListening();
            await new Promise(r => setTimeout(r, 1000));
            
            const recipe = {
                id: Date.now(),
                title: query.charAt(0).toUpperCase() + query.slice(1) + " Delight",
                time: "25 mins",
                difficulty: "Easy",
                servings: "2 servings",
                ingredients: [
                    "2 tablespoons olive oil",
                    "1 large onion, diced finely",
                    "3 cloves garlic, minced",
                    "400g fresh " + query + ", chopped into pieces",
                    "1 teaspoon sea salt",
                    "1/2 teaspoon black pepper",
                    "Fresh herbs for garnish"
                ],
                steps: [
                    "Heat the olive oil in a large pan over medium heat until shimmering hot.",
                    "Add the diced onion and cook for 3 minutes until soft and translucent.",
                    "Add the minced garlic and cook for 1 minute until fragrant and golden.",
                    "Add the main ingredient and cook for 10 minutes, stirring occasionally.",
                    "Season with sea salt and black pepper to your taste preference.",
                    "Serve hot immediately, garnished with fresh herbs."
                ],
                savedAt: new Date().toISOString()
            };
            
            loadRecipe(recipe);
            updateOrbState('idle');
            speak(`Found ${recipe.title}. Say "start cooking" when ready.`);
        }

        function loadRecipe(recipe) {
            currentRecipe = recipe;
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('recipeDisplay').style.display = 'block';
            document.getElementById('recipeActions').style.display = 'flex';
            document.getElementById('completionMessage').classList.add('hidden');
            
            document.getElementById('recipeTitle').textContent = recipe.title;
            document.getElementById('recipeTime').textContent = recipe.time;
            document.getElementById('recipeDifficulty').textContent = recipe.difficulty;
            document.getElementById('recipeServings').textContent = recipe.servings;
            document.getElementById('ingredientCount').textContent = `${recipe.ingredients.length} items`;
            
            // Render with word spans ready for highlighting
            document.getElementById('ingredientsList').innerHTML = recipe.ingredients.map((ing, i) => `
                <div class="ingredient-tag" id="ing-${i}" onclick="toggleIngredient(${i})">
                    <p class="text-slate-300 text-sm">${ing}</p>
                </div>
            `).join('');
            
            document.getElementById('stepsList').innerHTML = recipe.steps.map((step, i) => `
                <div class="recipe-step" id="step-${i}" onclick="selectStep(${i})">
                    <div class="flex gap-4">
                        <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-sm font-bold text-slate-400 flex-shrink-0">${i + 1}</div>
                        <p class="text-slate-200 leading-relaxed text-lg">${step}</p>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
            document.getElementById('contentArea').scrollTop = 0;
        }

        function toggleIngredient(idx) {
            const el = document.getElementById(`ing-${idx}`);
            el.classList.toggle('active');
        }

        function selectStep(idx) {
            document.querySelectorAll('.recipe-step').forEach((el, i) => {
                el.classList.toggle('current', i === idx);
            });
            const el = document.getElementById(`step-${idx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function highlightIngredient(idx) {
            document.querySelectorAll('.ingredient-tag').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            const el = document.getElementById(`ing-${idx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function highlightStep(idx) {
            document.querySelectorAll('.recipe-step').forEach((el, i) => {
                el.classList.remove('current');
                if (i === idx) {
                    el.classList.add('current');
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        // Save functionality
        function saveRecipe() {
            if (!currentRecipe) return;
            const existingIndex = cookbook.findIndex(r => r.id === currentRecipe.id || r.title === currentRecipe.title);
            
            if (existingIndex !== -1) {
                cookbook[existingIndex] = { ...currentRecipe, savedAt: new Date().toISOString() };
                speak('Recipe updated');
                showToast('Recipe updated in cookbook');
            } else {
                cookbook.unshift({ ...currentRecipe, id: Date.now(), savedAt: new Date().toISOString() });
                speak('Recipe saved');
                showToast('Recipe saved to cookbook');
            }
            
            localStorage.setItem('cookit_cookbook', JSON.stringify(cookbook));
            renderCookbook();
        }

        function renderCookbook() {
            const container = document.getElementById('cookbookList');
            if (cookbook.length === 0) {
                container.innerHTML = '<p class="text-slate-600 text-sm text-center py-4">No saved recipes yet</p>';
                return;
            }
            
            container.innerHTML = cookbook.map((r, i) => `
                <div class="p-3 bg-slate-800/50 rounded-lg cursor-pointer hover:bg-slate-700/50 transition-colors group" onclick="loadSavedRecipe(${i})">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-white font-medium text-sm">${r.title}</p>
                            <p class="text-slate-500 text-xs">${r.time} • ${r.difficulty}</p>
                        </div>
                        <button onclick="event.stopPropagation(); deleteRecipe(${i})" class="opacity-0 group-hover:opacity-100 p-2 text-slate-500 hover:text-red-400 transition-opacity">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function loadSavedRecipe(index) {
            const recipe = cookbook[index];
            if (recipe) {
                loadRecipe(recipe);
                if (sidebarOpen) toggleSidebar();
            }
        }

        function deleteRecipe(index) {
            if (confirm('Delete this recipe?')) {
                cookbook.splice(index, 1);
                localStorage.setItem('cookit_cookbook', JSON.stringify(cookbook));
                renderCookbook();
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed top-4 right-4 bg-slate-800 text-white px-4 py-3 rounded-lg shadow-lg border border-white/10 z-50 animate-fade-in';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function printRecipe() {
            if (!currentRecipe) return;
            window.print();
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('mainContent').classList.toggle('sidebar-open');
        }

        function newRecipe() {
            document.getElementById('welcomeScreen').style.display = 'flex';
            document.getElementById('recipeDisplay').style.display = 'none';
            document.getElementById('recipeActions').style.display = 'none';
            document.getElementById('textInput').value = '';
            currentRecipe = null;
            resetVoiceState();
            if (sidebarOpen) toggleSidebar();
        }

        function processTextInput() {
            const val = document.getElementById('textInput').value.trim();
            if (val) {
                searchRecipe(val);
                document.getElementById('textInput').value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') processTextInput();
        }
    </script>
</body>
