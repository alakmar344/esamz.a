<script>
const chat = document.getElementById("chat")
const input = document.getElementById("input")
const send = document.getElementById("send")
const fileInput = document.getElementById("fileInput")
const filePreview = document.getElementById("filePreview")

let uploadedFile = null
let uploadedText = ""
let conversationHistory = []  // Store conversation history

/* Chat helpers */
function add(text, who){
  const m=document.createElement("div")
  m.className="message "+who
  const b=document.createElement("div")
  b.className="bubble"
  b.textContent=text
  m.appendChild(b)
  chat.appendChild(m)
  chat.scrollTop=chat.scrollHeight
}

function newChat(){
  chat.innerHTML=`<div class="welcome">
    <h2>Welcome to eSAMz v7</h2>
    <p>Dive into intelligent conversations.</p>
  </div>`
  uploadedFile=null
  uploadedText=""
  filePreview.style.display='none'
  filePreview.innerHTML=""
  conversationHistory=[]  // Clear history on new chat
  console.log("Chat history cleared")
}

/* File handling */
fileInput.onchange=async()=>{
  const file=fileInput.files[0]
  if(!file)return
  uploadedFile=file
  uploadedText=""

  if(file.type==="text/plain"){
    uploadedText=await file.text()
  }

  // Get file extension
  const ext = file.name.split('.').pop().toUpperCase()
  
  // Display file badge
  filePreview.style.display='block'
  filePreview.innerHTML=`
    <div class="file-badge">
      <div class="file-icon">${ext}</div>
      <div class="file-info">
        <div class="file-name">${file.name}</div>
        <div class="file-type">${(file.size/1024).toFixed(1)} KB${uploadedText ? ' • Loaded' : ''}</div>
      </div>
      <button class="file-remove" onclick="removeFile()">✕</button>
    </div>
  `
}

function removeFile(){
  uploadedFile=null
  uploadedText=""
  fileInput.value=""
  filePreview.style.display='none'
  filePreview.innerHTML=""
}

/* Send */
async function sendMsg(){
  const text=input.value.trim()
  if(!text && !uploadedFile)return

  let payload=text
  if(uploadedText){
    payload=`[FILE CONTENT START]\n${uploadedText}\n[FILE CONTENT END]\n\n${text}`
  } else if(uploadedFile){
    payload=`[Attached file: ${uploadedFile.name}]\n\n${text}`
  }

  add(text || "[File sent]", "user")
  input.value=""
  fileInput.value=""
  filePreview.style.display='none'
  filePreview.innerHTML=""
  uploadedFile=null
  uploadedText=""

  // Add user message to history
  conversationHistory.push({
    role: "user",
    content: payload
  })

  console.log(`Sending message with ${conversationHistory.length} history items`)

  try{
    const r=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message: payload,
        history: conversationHistory  // Send history with request
      })
    })
    const j=await r.json()
    const reply = j.reply || "No response."
    
    add(reply, "ai")
    
    // Add assistant response to history
    conversationHistory.push({
      role: "assistant",
      content: reply
    })
    
    console.log(`History now has ${conversationHistory.length} items`)
  }catch(err){
    add("Error connecting to AI.", "ai")
    console.error("API Error:", err)
  }
}

send.onclick=sendMsg
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault()
    sendMsg()
  }
})
 /* ===== AI EXTRAS ===== */
function attachTools(bubble, text){
  const tools=document.createElement("div")
  tools.className="ai-tools"

  const copy=document.createElement("button")
  copy.textContent="📋 Copy"
  copy.onclick=()=>navigator.clipboard.writeText(text)

  const like=document.createElement("button")
  like.textContent="👍"
  like.onclick=()=>console.log("Liked")

  const dislike=document.createElement("button")
  dislike.textContent="👎"
  dislike.onclick=()=>console.log("Disliked")

  const canvasBtn=document.createElement("button")
  canvasBtn.textContent="🧾 Canvas"
  canvasBtn.onclick=()=>{
    const c=document.getElementById("codeCanvas")
    c.style.display = c.style.display==="block"?"none":"block"
  }

  tools.append(copy,like,dislike,canvasBtn)
  bubble.appendChild(tools)
}
 function add(text, who){
  const m=document.createElement("div")
  m.className="message "+who
  const b=document.createElement("div")
  b.className="bubble"
  b.textContent=text

  if(who==="ai") attachTools(b, text)

  m.appendChild(b)
  chat.appendChild(m)
  chat.scrollTop=chat.scrollHeight
}

</script>
