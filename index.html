<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>eSAMz v7 – AI Assistant</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://esamz.site/#organization",
      "name": "eSAMz",
      "legalName": "eSAMz AI",
      "url": "https://esamz.site",
      "logo": "https://esamz.site/logo.png",
      "foundingDate": "2025",
      "founder": { "@type": "Person", "name": "Alakmar Teenwala" },
      "brand": { "@type": "Brand", "name": "eSAMz AI", "slogan": "Not just responsive but supportive" }
    }
  ]
}
</script>

<style>
:root {
    --bg-app: #0a0a0a;
    --bg-sidebar: #111111;
    --bg-message-ai: #1a1a1a;
    --primary: #6366f1;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e5e5e5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg-app); color: var(--text); overflow: hidden; height: 100vh; }

.app { display: flex; height: 100vh; width: 100vw; }

/* SIDEBAR - VISIBLE BY DEFAULT ON DESKTOP */
.sidebar {
    width: 280px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 0.3s ease;
    z-index: 100;
}

.main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }

/* HEADER */
.header {
    height: 60px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 15px;
    background: rgba(10, 10, 10, 0.8);
    backdrop-filter: blur(10px);
}

.menu-toggle { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; display: none; }

/* CHAT AREA */
.chat-window { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
.message { display: flex; gap: 15px; margin-bottom: 25px; max-width: 850px; margin-left: auto; margin-right: auto; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.avatar { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; }
.user .avatar { background: #444; }
.ai .avatar { background: var(--primary); color: white; }

.bubble { line-height: 1.6; font-size: 15px; flex: 1; min-width: 0; }
.ai .bubble { color: #ddd; }

/* CODE BLOCK UI */
.code-block-wrapper { margin: 15px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #000; }
.code-header { background: #222; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif; font-size: 12px; }
.code-actions { display: flex; gap: 10px; }
.code-btn { background: none; border: none; color: #999; cursor: pointer; transition: 0.2s; }
.code-btn:hover { color: #fff; }
pre { padding: 15px !important; margin: 0 !important; font-family: 'JetBrains Mono', monospace !important; font-size: 13px !important; }

/* INPUT BAR */
.input-container { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, var(--bg-app) 40%); }
.input-wrap { max-width: 800px; margin: 0 auto; background: #1a1a1a; border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; align-items: flex-end; gap: 10px; }
textarea { flex: 1; background: none; border: none; color: #fff; resize: none; outline: none; padding: 8px; font-family: inherit; font-size: 15px; max-height: 200px; }
.send-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }

/* MOBILE ADJUSTMENTS */
@media (max-width: 768px) {
    .sidebar { position: fixed; left: -280px; height: 100%; }
    .sidebar.open { transform: translateX(280px); }
    .menu-toggle { display: block; }
}
</style>
</head>
<body>

<div class="app">
    <aside class="sidebar" id="sidebar">
        <div style="padding: 20px; border-bottom: 1px solid var(--border);">
            <h2 style="font-size: 18px; color: var(--primary);">eSAMz v7</h2>
            <button onclick="location.reload()" style="width:100%; margin-top:15px; padding:8px; background:#222; border:1px solid #333; color:#fff; border-radius:6px; cursor:pointer;">+ New Chat</button>
        </div>
        <div id="history" style="flex:1; overflow-y:auto; padding:10px;">
            <p style="font-size:11px; color:#555; text-transform:uppercase; padding:10px;">Recent History</p>
            </div>
        <div style="padding: 15px; border-top: 1px solid var(--border); font-size:12px; color:#666;">
            © 2025 Alakmar Teenwala
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <div style="font-weight: 600;">AI Assistant</div>
        </header>

        <div class="chat-window" id="chat">
            <div class="message ai">
                <div class="avatar">e</div>
                <div class="bubble">Hello! I am eSAMz v7. I can help you with general questions, creative writing, or coding. What's on your mind?</div>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrap">
                <textarea id="userInput" placeholder="Ask anything..." rows="1" oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
                <button class="send-btn" onclick="handleSend()">Send</button>
            </div>
        </div>
    </main>
</div>

<script>
const chatBox = document.getElementById('chat');
const userInput = document.getElementById('userInput');
const sidebar = document.getElementById('sidebar');

function toggleMenu() {
    sidebar.classList.toggle('open');
}

function handleSend() {
    const text = userInput.value.trim();
    if(!text) return;

    // Add User Message
    addMessage('user', text);
    userInput.value = '';
    userInput.style.height = 'auto';

    // AI "Thinking"
    setTimeout(() => {
        generateAIResponse(text);
    }, 600);
}

function addMessage(role, text) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${role}`;
    
    // Convert Markdown (including code blocks)
    let formattedText = marked.parse(text);

    msgDiv.innerHTML = `
        <div class="avatar">${role === 'user' ? 'U' : 'e'}</div>
        <div class="bubble">${formattedText}</div>
    `;
    
    chatBox.appendChild(msgDiv);
    
    // If AI message, check for code blocks to add buttons
    if(role === 'ai') {
        const preBlocks = msgDiv.querySelectorAll('pre');
        preBlocks.forEach(pre => {
            wrapCodeBlock(pre);
        });
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

function wrapCodeBlock(pre) {
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper';
    
    const header = document.createElement('div');
    header.className = 'code-header';
    header.innerHTML = `
        <span>Code Snippet</span>
        <div class="code-actions">
            <button class="code-btn" onclick="copyCode(this)">Copy</button>
            <button class="code-btn" onclick="downloadCode(this)">Download</button>
        </div>
    `;

    pre.parentNode.insertBefore(wrapper, pre);
    wrapper.appendChild(header);
    wrapper.appendChild(pre);
    Prism.highlightAllUnder(wrapper);
}

// --- LOGIC: GENERAL AI RESPONSE ---
function generateAIResponse(prompt) {
    let response = "";
    const input = prompt.toLowerCase();

    // Logic to handle both general chat and code
    if(input.includes("code") || input.includes("python") || input.includes("html")) {
        response = "Here is a code example for you:\n\n```python\ndef greet():\n    print('Hello from eSAMz AI!')\n\ngreet()\n```";
    } else if(input.includes("who are you")) {
        response = "I am **eSAMz v7**, an intelligent AI assistant created by **Alakmar Teenwala**. I focus on clarity, speed, and helpfulness.";
    } else {
        response = "That's interesting! Tell me more about that, or ask me to write some code if you need help with a project.";
    }

    addMessage('ai', response);
}

function copyCode(btn) {
    const code = btn.closest('.code-block-wrapper').querySelector('code').innerText;
    navigator.clipboard.writeText(code);
    btn.innerText = "Copied!";
    setTimeout(() => btn.innerText = "Copy", 2000);
}

function downloadCode(btn) {
    const code = btn.closest('.code-block-wrapper').querySelector('code').innerText;
    const blob = new Blob([code], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ai_generated_code.txt';
    a.click();
}

// Handle Enter Key
userInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
    }
});
</script>

</body>
</html>
