<style>
/* --------------------------- */
/* THEME VARIABLES             */
/* --------------------------- */
:root {
  --bg: #0a0a0a;
  --text: #e5e5e5;
  --subtext: #888;
  --card-bg: rgba(17,17,17,0.8);
  --bubble-ai: rgba(17,17,17,0.8);
  --bubble-user-grad1: #667eea;
  --bubble-user-grad2: #764ba2;
  --border: rgba(255,255,255,0.06);
}
.header {
    flex-shrink: 0;
}

.main {
    min-width: 0 !important;
}

[data-theme="light"] {
  --bg: #fafafa;
  --text: #222;
  --subtext: #555;
  --card-bg: rgba(255,255,255,0.8);
  --bubble-ai: #ffffff;
  --border: rgba(0,0,0,0.1);
}

/* --------------------------- */
/* GLOBAL + ORIGINAL STYLES    */
/* (Preserved, now using vars) */
/* --------------------------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
}
.app{display:flex;height:100vh;position:relative;overflow:hidden}

.app::before{
  content:'';
  position:absolute;
  top:-50%; left:-50%;
  width:200%; height:200%;
  background:radial-gradient(circle at 20% 50%, rgba(102,126,234,0.08) 0%, transparent 50%),
             radial-gradient(circle at 80% 80%, rgba(118,75,162,0.08) 0%, transparent 50%);
  animation:gradient 20s ease infinite;
  pointer-events:none; z-index:0;
}
@keyframes gradient{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  33%{transform:translate(5%,5%) rotate(120deg)}
  66%{transform:translate(-5%,10%) rotate(240deg)}
}

/* --------------------------- */
/* SIDEBAR (unchanged)         */
/* --------------------------- */
.sidebar{
  width:280px; background:var(--card-bg);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  position:relative; z-index:10;
  box-shadow:2px 0 24px rgba(0,0,0,0.4);
}
.sidebar-header{padding:24px;border-bottom:1px solid var(--border)}
.logo{display:flex;gap:12px;align-items:center;margin-bottom:16px;animation:slideDown 0.6s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.logo-icon{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:800;
}
.logo div{
  font-size:18px;font-weight:700;
  background:linear-gradient(135deg,#667eea,#764ba2);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.new-chat-btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;cursor:pointer;font-weight:600;font-size:14px;
  transition:.3s;box-shadow:0 4px 16px rgba(102,126,234,.3);
}
.new-chat-btn:hover{transform:translateY(-2px)}

/* --------------------------- */
/* HEADER + THEME TOGGLE       */
/* --------------------------- */
.header{
  height:70px;background:var(--card-bg);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 32px;
}
.theme-toggle{
  width:38px;height:38px;border-radius:50%;
  background:var(--bubble-ai);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;
  transition:0.3s;
}
.theme-toggle:hover{opacity:0.7}

/* --------------------------- */
/* CHAT + BUBBLES              */
/* --------------------------- */
.chat{flex:1;padding:32px;overflow-y:auto;scroll-behavior:smooth}
.welcome{
  padding:48px 32px;margin-bottom:24px;border-radius:20px;
  background:linear-gradient(135deg,rgba(102,126,234,0.15),rgba(118,75,162,0.15));
  border:1px solid rgba(102,126,234,.2);
  animation:fadeIn .6s ease;text-align:center;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1}}

.message{display:flex;margin-bottom:20px;animation:slideUp 0.4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.message.user{justify-content:flex-end}
.message.ai{justify-content:flex-start}

.bubble{
  max-width:70%;padding:16px 20px;border-radius:18px;
  font-size:15px;line-height:1.6;white-space:pre-wrap;
}
.user .bubble{
  background:linear-gradient(135deg,var(--bubble-user-grad1),var(--bubble-user-grad2));
  color:white;border-bottom-right-radius:4px;
}
.ai .bubble{
  background:var(--bubble-ai);
  border:1px solid var(--border);
  border-bottom-left-radius:4px;
}

/* --------------------------- */
/* AI LOADING INDICATOR        */
/* --------------------------- */
.ai-loading{
  display:inline-flex;gap:6px;padding:14px 20px;
}
.ai-loading span{
  width:8px;height:8px;border-radius:50%;
  background:#667eea;opacity:0.4;
  animation:blink 1.4s infinite;
}
.ai-loading span:nth-child(2){animation-delay:0.2s}
.ai-loading span:nth-child(3){animation-delay:0.4s}
@keyframes blink { 50%{opacity:1} }

/* --------------------------- */
/* CODE CANVAS                */
/* --------------------------- */
.code-box{
  background:#111;border:1px solid var(--border);
  border-radius:12px;padding:16px;margin-top:10px;
  font-family:monospace;font-size:14px;color:#ccc;
  overflow-x:auto;max-height:250px;
}
.code-title{
  font-size:12px;color:var(--subtext);margin-bottom:6px;
}

/* --------------------------- */
/* INPUT AREA (unchanged)      */
/* --------------------------- */
.input-bar{padding:24px 32px;background:var(--card-bg);border-top:1px solid var(--border)}
.input-wrap{display:flex;gap:12px;background:rgba(26,26,26,.8);padding:12px 16px;border-radius:16px;border:1px solid var(--border)}
textarea{flex:1;background:none;border:none;color:var(--text);font-size:15px}
.send-btn{
  background:linear-gradient(135deg,#667eea,#764ba2);
  border:none;border-radius:12px;color:white;
  padding:10px 24px;font-weight:600;
}

/* Fade-out welcome */
.welcome.fade-out { opacity:0; transform:translateY(-20px); transition:0.6s; }
</style>

<!-- MAIN -->
<main class="main">

  </div>

    <div class="welcome" id="welcomeBox">

    </div>
  </div>

  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="input" placeholder="Type your message..."></textarea>
      <button class="send-btn" id="send">Send</button>
    </div>
  </div>
</main>

</div>

<script>
/* --------------------------- */
/* THEME TOGGLE                */
/* --------------------------- */
function toggleTheme(){
  const html = document.documentElement
  const newTheme = html.dataset.theme === "dark" ? "light" : "dark"
  html.dataset.theme = newTheme
  localStorage.setItem("theme", newTheme)
}

document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"


/* --------------------------- */
/* CHAT ENGINE                 */
/* --------------------------- */
const chat = document.getElementById("chat")
const input = document.getElementById("input")
const send = document.getElementById("send")
let conversationHistory=[]

function addMessage(text, who){
  const m=document.createElement("div")
  m.className="message "+who

  const bubble=document.createElement("div")
  bubble.className="bubble"

  // auto code canvas
  if(text.includes("```")){
    const parts=text.split("```")
    bubble.textContent=parts[0]

    const codeBox=document.createElement("div")
    codeBox.className="code-box"
    codeBox.innerHTML = `<div class="code-title">AI Generated Code</div><pre>${parts[1]}</pre>`
    bubble.appendChild(codeBox)
  } else {
    bubble.textContent=text
  }

  m.appendChild(bubble)
  chat.appendChild(m)
  chat.scrollTop=chat.scrollHeight
}

function showLoader(){
  const m=document.createElement("div")
  m.className="message ai"
  m.id="loadingMsg"
  m.innerHTML = `<div class="bubble ai-loading">
    <span></span><span></span><span></span>
  </div>`
  chat.appendChild(m)
  chat.scrollTop=chat.scrollHeight
}

function removeLoader(){
  const loader=document.getElementById("loadingMsg")
  if(loader) loader.remove()
}

/* Hide welcome after first message */
function hideWelcome(){
  const w=document.getElementById("welcomeBox")
  if(w){
    w.classList.add("fade-out")
    setTimeout(()=>w.remove(),600)
  }
}

async function sendMsg(){
  const text=input.value.trim()
  if(!text) return

  hideWelcome()
  addMessage(text,"user")
  input.value=""

  conversationHistory.push({role:"user",content:text})

  showLoader()

  const r=await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text, history:conversationHistory})
  })

  removeLoader()

  const j=await r.json()
  const reply = j.reply || "No response."
  addMessage(reply,"ai")
  conversationHistory.push({role:"assistant",content:reply})
}

send.onclick = sendMsg
input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault()
    sendMsg()
  }
})
</script>
